# Scoring bands, blast-radius caps, approval rules, verification and temporary-control review.
# Approval can never be disabled here: there is no switch for it, and the loader rejects
# auto_approve / skip_approval / bypass_approval / approval_required keys.

scoring:
  bands:                        # risk score lower bounds (0-100)
    LOW: 0
    MEDIUM: 30
    HIGH: 60
    CRITICAL: 80
  weights:                      # category weight, 0.0-1.0 (docs/threat-scoring.md section 7)
    endpoint_detection: 1.0
    sandbox_verdict: 0.9
    network_behaviour: 0.9
    authentication_anomaly: 0.9
    email_verdict: 0.8
    persistence: 0.8
    lateral_movement: 1.0
    campaign_association: 0.7
    reputation: 0.6
  caps:                         # never overridable by a workflow
    reputation_max_contribution: 50
    reputation_only_confidence_cap: 50
  corroboration: {min: 30, step: 5, max: 15}
  confidence: {independent_source_step: 5, independent_source_max: 20,
               contradiction_penalty: 15, failed_source_penalty: 5, failed_source_max_penalty: 20}
  context: {critical_asset_bonus: 10}

blast_radius:                   # above a cap, every action of that kind needs ELEVATED approval
  max_endpoints: 5
  max_users: 3
  max_indicators: 50
  max_messages: 500

approval:
  signing_key_id: primary       # key id only; the key itself is the APPROVAL_SIGNING_KEY secret
  containment_token_ttl_minutes: 30
  release_token_ttl_minutes: 30
  package_ttl_minutes: 240
  standard_role: xdr-approver
  elevated_role: xdr-elevated-approver
  standard_min_approvers: 1     # distinct HUMAN approvers, >= 1
  elevated_min_approvers: 1     # distinct HUMAN approvers holding elevated_role, >= 1
  allow_self_approval: false
  clock_skew_seconds: 60

verification:
  poll_interval_seconds: 10
  timeout_seconds: 300
  unable_to_verify_counts_as_contained: false

temporary_controls:             # review reminders only; controls are never released automatically
  review_after_hours:
    isolate_endpoint: 24
    block_domain: 168
    block_url: 168
    block_ip: 72
    block_hash: 720
    disable_user: 24
    quarantine_email: 72
    block_network_client: 24
    remove_privileged_role: 24
    quarantine_file: 168
