# Org settings for the workflows that run inside Cisco XDR (xdr/).
#
# tools/xdr_native/build.py reads this file and writes the values into every generated workflow as the
# defaults of its inputs. Fill it in once, then run:
#
#     python tools/xdr_native/build.py
#
# Every list is empty here on purpose: this repository does not know your org. Until you fill them in,
# no asset is protected and nothing is excluded. Do not put a secret in this file.
# Values are text without commas. A flag of build.py overrides the roles.

# XDR roles asked for a standard approval: admin (administrators), user (incident responders).
approver_roles: [admin, user]
# XDR roles asked when a protected asset or a large package is involved, and how many must approve.
elevated_roles: [admin]
elevated_approvals: 2

# Your own DNS and mail suffixes. A dotted name under one of them is an endpoint, any other dotted name
# is a domain. Account actions are proposed only for addresses under them.
# Example: [corp.example.com, example.com]
internal_domain_suffixes: []

# Assets that always need elevated approval (two approvers). Names, patterns with * and ?, or @domain.
# Example: [DC-*, ADFS*, PRD-*, ESX*, ceo@example.com, "@finance.example.com"]
protected_assets: []

# Values that are never proposed for an action: your own domains (a domain covers its subdomains),
# resolvers, networks, break-glass accounts.
# Example: [example.com, microsoft.com, cisco.com, 192.0.2.53, 192.0.2.0/28, breakglass@example.com]
never_act_on: []

# Email Bombing only. Mailboxes or @domains that always need elevated approval, and sender domains
# whose messages are never moved.
protected_mailboxes: []
trusted_sender_domains: []
