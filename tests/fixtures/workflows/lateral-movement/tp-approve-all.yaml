# Lateral-movement workflow scenario; fake lab data only.
schema: 1
name: tp-approve-all
workflow: lateral-movement
description: >-
  True positive. A finance laptop with a credential-access detection opens a remote desktop session to
  the application server TH-SRV-0310, which the peer lookup resolves by its address; a service started
  there runs the same tool, rated malicious. The account used for the session signed in from an address
  rated malicious and Entra rates it high risk with a risk detection. The analyst approves everything:
  both isolations, the tool hash block, the address block, the session revocation and the account
  disable execute. The run hands the account off to account-takeover and the laptop to
  credential-dumping. Production parity: the block_hash recommendation stays UNROUTED (no enabled
  adapter has a VERIFIED write for it; shown for manual handling, never executed); isolate_endpoint
  through secure_endpoint cannot be read back by the real adapter and ends UNABLE_TO_VERIFY, so
  containment is PARTIALLY_CONTAINED.
tags: [true_positive, approve_all]
mode: both
