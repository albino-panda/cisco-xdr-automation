description: >-
  True positive over an admin share: TH-LT-1047 pushes a tool to TH-SRV-0310 and starts it as a service.
  The analyst approves only the source isolation and the session revocation; the target isolation and
  the hash block are recorded as rejected by the analyst and never executed. Production parity: the
  block_hash recommendation stays UNROUTED (no enabled adapter has a VERIFIED write for it; shown for
  manual handling, never executed); isolate_endpoint through secure_endpoint cannot be read back by the
  real adapter and ends UNABLE_TO_VERIFY, so containment is PARTIALLY_CONTAINED.
