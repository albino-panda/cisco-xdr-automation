               remote_ip: 198.51.100.51, remote_port: 5985, protocol: tcp, direction: internal,
               process_name: powershell.exe, first_seen: "2026-01-15T09:00:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: jump-01
      record: {kind: network_connection, endpoint: jump-01, user: it.admin@example.com, local_ip: 198.51.100.20,
