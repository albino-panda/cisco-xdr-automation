    - {type: hostname, value: srv-web-01}
    - {type: hostname, value: srv-web-02}
    - {type: user, value: it.admin@example.com}
    - {type: sha256, value: feedface00000000feedface00000000feedface00000000feedface00000000}
  trigger: {source: splunk, mitre_techniques: [T1021.006]}
environment:
