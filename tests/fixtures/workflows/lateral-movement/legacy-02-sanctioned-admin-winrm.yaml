# Lateral-movement workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-02-sanctioned-admin-winrm
workflow: lateral-movement
description: >-
  Legacy 02, converted to typed records. An IT administrator runs a change-approved patch script
  over WinRM from the admin jump host to two web servers. No host has a malicious detection or
  event, the script hash is rated clean and the account shows no risk or anomalies, so the movement
  is not confirmed: nothing is proposed and nothing is considered, even though the jump host is the
  source of the sessions.
tags: [legacy, benign]
legacy_source: workflows/lateral-movement/scenarios/02-sanctioned-admin-winrm.yaml
mode: both
incident:
  incident_id: INC-TEST-LM-0002
  title: WinRM sessions from jump-01 to multiple web servers
  severity: MEDIUM
  source: splunk
  workflow_id: lateral-movement
