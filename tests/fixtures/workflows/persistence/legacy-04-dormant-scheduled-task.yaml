# Persistence workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-04-dormant-scheduled-task
workflow: persistence
description: >-
  Migrated legacy scenario 04 (edge case). A malicious binary was registered as a weekly scheduled task
  but has not run yet, so the host has only a suspicious detection. A second incident binary has no
  verdict (the lookup returned nothing). Only a block of the malicious hash is recommended, so the task
  cannot launch it, and that block is UNROUTED: no enabled adapter has a VERIFIED hash block (the real
  Secure Endpoint adapter cannot block hashes), so it is shown for manual handling and no package is
  proposed. The host without active malicious execution is not isolated (listed as considered: dormant)
  and the unknown binary is left to the analyst (listed as considered). Deleting the task is the manual
  step. Production parity: the block_hash recommendation stays UNROUTED (no enabled adapter has a
  VERIFIED write for it; shown for manual handling, never executed).
tags: [legacy, true_positive]
legacy_source: workflows/persistence/scenarios/04-dormant-scheduled-task.yaml
