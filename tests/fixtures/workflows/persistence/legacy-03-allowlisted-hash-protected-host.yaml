# Persistence workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-03-allowlisted-hash-protected-host
workflow: persistence
description: >-
  Migrated legacy scenario 03 (guardrails, aligned with C3). A scheduled task on domain controller DC-01
  runs an internal admin tool that intel rates malicious (a known false positive) and the host shows a
  malicious detection for it. The hash is on this tenant's allow-list, so its block is shown as an
  excluded target, never executed. DC-01 is a critical asset, so its isolation stays proposed with
  ELEVATED approval and a visible warning (never skipped) and the lead decides. The task's review and
  removal stay a manual step that names the critical asset.
tags: [legacy, critical_asset, true_positive, approve_all]
legacy_source: workflows/persistence/scenarios/03-allowlisted-hash-protected-host.yaml
mode: both
suite: {secure_endpoint: [endpoint], virustotal: [intel]}
config:
  allowlists:
    never_block:
      hashes: ["3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3"]
incident:
  incident_id: INC-TEST-3003
  title: Scheduled task created on dc-01 running unsigned binary
  severity: HIGH
  workflow_id: persistence
  source: Cisco Secure Endpoint
  observables:
    - {type: sha256, value: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3}
    - {type: hostname, value: dc-01}
  trigger: {source: secure_endpoint, mitre_techniques: [T1053.005]}
environment:
  reputations:
    - {type: sha256, value: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3,
       verdict: MALICIOUS, risk_score: 70, confidence: 60, integrations: [secure_endpoint, virustotal],
       summary: "disposition malicious"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: DC-01
      record: {kind: endpoint, hostname: DC-01, connector_guid: 00000000-0000-4000-8000-000000000d01,
               groups: [Domain Controllers], isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: DC-01
      record: {kind: persistence_item, endpoint: DC-01, item_id: task-example-nightlyinventory, mechanism: scheduled_task,
               name: Example-NightlyInventory, sha256: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: DC-01
      record: {kind: detection, name: HackTool.InventoryAgent, verdict: MALICIOUS, severity: HIGH, endpoint: DC-01,
               status: active, sha256: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: DC-01
      record: {kind: process_event, endpoint: DC-01, timestamp: "2026-01-15T02:00:00Z", event_type: scheduled_task,
               process_name: Example-NightlyInventory}
    - integration: secure_endpoint
      atomic: search_hash_enterprise
      subject: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3
      record: {kind: hash_prevalence, sha256: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3, prevalence: 3,
               endpoints: [DC-01, DC-02, WS-IT-007]}
analyst: {decision: APPROVE_ALL, approvers: [lead]}
expect:
  package: true
  actions:
    - isolate_endpoint:DC-01
  elevated:
    - isolate_endpoint:DC-01
  excluded:
    - block_hash:3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3
  warnings: [ELEVATED APPROVAL REQUIRED, Domain controller]
  manual_steps: [remove_persistence:DC-01/task-example-nightlyinventory]
  considered: []
  containment: CONTAINED
  controls: 1
