# Persistence workflow scenario; fake lab data only.
schema: 1
name: partial-failure
workflow: persistence
description: >-
  Everything is approved. The tenant also runs Defender for Endpoint for indicators, so the hash block
  routes to Defender (the real Secure Endpoint adapter cannot block hashes), and the Defender indicator
  write fails. Containment is partial, the failed action is reported FAILED (never retried silently) and
  the Secure Endpoint isolation stands (UNABLE_TO_VERIFY: Secure Endpoint has no VERIFIED read-back).
  The process termination has no VERIFIED write on any enabled adapter and is UNROUTED. Production
  parity: the terminate_process recommendation stays UNROUTED (no enabled adapter has a VERIFIED write
  for it; shown for manual handling, never executed); isolate_endpoint through secure_endpoint cannot be
  read back by the real adapter and ends UNABLE_TO_VERIFY.
tags: [partial_failure, true_positive, approve_all]
