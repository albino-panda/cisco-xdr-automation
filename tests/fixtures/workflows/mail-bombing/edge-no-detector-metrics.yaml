# mail-bombing scenario; fake lab data only (example.com, *.example, *.test, documentation IPs).
schema: 1
name: edge-no-detector-metrics
workflow: mail-bombing
description: >-
  An XDR incident tagged Email Bombing (not raised by the mail-bomb detector, so no detector metrics).
  The flood window and the qualification come from the observed messages alone: ten neutral or
  graymail messages from ten sender domains inside ten minutes. Each is proposed for quarantine with a
  lower pattern confidence than a detector-backed flood.
tags: [edge_case, true_positive]
mode: both
incident:
  incident_id: XDR-MB-0013
  title: Subscription flood reported by the mail gateway
  severity: MEDIUM
  source: cisco_xdr
  workflow_id: mail-bombing
  observables:
    - {type: email_address, value: kwilson@example.com}
    - {type: email_message_id, value: etd-mb-0013-001}
  users: [kwilson@example.com]
  trigger: {source: secure_email, mitre_techniques: [T1667]}
environment:
  records:
