# Credential-dumping workflow scenario; fake lab data only.
schema: 1
name: edge-domain-controller-ntds
workflow: credential-dumping
description: >-
  The Active Directory database is copied on domain controller DC-02. Its isolation needs ELEVATED
  approval with the domain-controller warning (never skipped), and so do the revocation and disable of
  the Domain Admins member signed in on it. Because the domain credential store was exposed, every
  domain account is affected: the domain-wide credential reset (including the Kerberos ticket-granting
  account, twice) is a manual step for the incident commander, never automated. The lead approves.
  Production parity: isolate_endpoint through secure_endpoint cannot be read back by the real adapter
  and ends UNABLE_TO_VERIFY, so containment is PARTIALLY_CONTAINED.
tags: [edge_case, critical_asset, true_positive, approve_all]
mode: both
incident:
  incident_id: XDR-CD-0010
  title: Directory database access on DC-02
  severity: CRITICAL
  workflow_id: credential-dumping
  observables:
    - {type: hostname, value: DC-02}
  users: [infra.admin@example.com]
  trigger: {source: secure_endpoint, mitre_techniques: [T1003.003]}
environment:
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: DC-02
      record: {kind: endpoint, hostname: DC-02, connector_guid: 00000000-0000-4000-8000-0000000000d2,
               os: Windows Server 2022, ip_addresses: [198.51.100.12], users: [infra.admin@example.com],
               groups: [Domain Controllers], isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: DC-02
      record: {kind: detection, detection_id: det-cd-dc02-1, name: Unexpected copy of the directory database,
               category: CredentialAccess, verdict: MALICIOUS, severity: CRITICAL, endpoint: DC-02,
               user: infra.admin@example.com, mitre_techniques: [T1003.003], status: active,
               first_seen: "2026-01-15T11:30:00Z"}
    - integration: entra
      atomic: investigate_user
      subject: infra.admin@example.com
      record: {kind: user_profile, user: infra.admin@example.com, department: IT Operations, groups: [Domain Admins],
               risk_level: medium, risk_state: none, account_enabled: true}
analyst: {decision: APPROVE_ALL, approvers: [lead]}
expect:
  package: true
  actions:
    - isolate_endpoint:DC-02
    - revoke_sessions:infra.admin@example.com
    - disable_user:infra.admin@example.com
  elevated: [isolate_endpoint:DC-02, revoke_sessions:infra.admin@example.com, disable_user:infra.admin@example.com]
  warnings: [ELEVATED APPROVAL REQUIRED, Domain controller, Privileged account]
  considered: []
  manual_steps: [domain-credential-reset:DC-02]
  handoffs: [account-takeover:infra.admin@example.com]
  containment: PARTIALLY_CONTAINED
  controls: 2
