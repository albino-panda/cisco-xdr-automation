# Credential-dumping workflow scenario; fake lab data only.
schema: 1
name: critical-asset-elevated
workflow: credential-dumping
description: >-
  LSASS memory is read on an operations workstation where a member of Domain Admins is logged on
  next to a standard user. The revocation and disable of the Domain Admins member need ELEVATED
  approval with a visible privileged-account warning (never skipped): an analyst alone cannot
  approve the package and the lead approves. The workstation isolation, the standard user's
  revocation and the tool hash block need standard approval.
tags: [critical_asset, true_positive, approve_all]
mode: both
incident:
  incident_id: XDR-CD-0006
  title: Credential theft behaviour on TH-LT-3388
  severity: CRITICAL
  workflow_id: credential-dumping
  observables:
    - {type: hostname, value: TH-LT-3388}
    - {type: sha256, value: d00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeed}
  trigger: {source: secure_endpoint, mitre_techniques: [T1003.001]}
environment:
  reputations:
    - {type: sha256, value: d00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeed, verdict: MALICIOUS,
       risk_score: 90, confidence: 85, integrations: [secure_endpoint, virustotal], summary: credential theft tool}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-3388
      record: {kind: endpoint, hostname: TH-LT-3388, connector_guid: 00000000-0000-4000-8000-000000003388,
               os: Windows 11, ip_addresses: [198.51.100.88], users: [ops.lead@example.com, dokafor@example.com],
               groups: [Workstations], isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-3388
      record: {kind: detection, detection_id: det-cd-3388-1, name: Suspicious read of LSASS process memory,
               category: CredentialAccess, verdict: MALICIOUS, severity: CRITICAL, endpoint: TH-LT-3388,
               sha256: d00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeed, process_name: credtool.exe,
               mitre_techniques: [T1003.001], status: active, first_seen: "2026-01-15T11:40:00Z"}
    - integration: secure_endpoint
      atomic: search_hash_enterprise
      subject: d00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeed
      record: {kind: hash_prevalence, sha256: d00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeed,
               file_name: credtool.exe, verdict: MALICIOUS, prevalence: 1, endpoints: [TH-LT-3388]}
    - integration: entra
      atomic: investigate_user
      subject: ops.lead@example.com
      record: {kind: user_profile, user: ops.lead@example.com, department: IT Operations, groups: [Domain Admins],
               risk_level: medium, risk_state: none, account_enabled: true}
    - integration: entra
      atomic: investigate_user
      subject: dokafor@example.com
      record: {kind: user_profile, user: dokafor@example.com, department: Operations, groups: [Operations Users],
               risk_level: low, risk_state: none, account_enabled: true}
analyst: {decision: APPROVE_ALL, approvers: [lead]}
expect:
  package: true
  actions:
    - isolate_endpoint:TH-LT-3388
    - revoke_sessions:ops.lead@example.com
    - revoke_sessions:dokafor@example.com
    - disable_user:ops.lead@example.com
    - block_hash:d00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeedd00dfeed
  elevated: [revoke_sessions:ops.lead@example.com, disable_user:ops.lead@example.com]
  warnings: [ELEVATED APPROVAL REQUIRED, Privileged account]
  manual_steps: [credential-reset:TH-LT-3388]
  handoffs: [account-takeover:ops.lead@example.com, account-takeover:dokafor@example.com]
  containment: CONTAINED
  controls: 3
