       risk_score: 90, confidence: 85, integrations: [secure_endpoint, virustotal], summary: credential theft tool}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: adm-jump01.example.com
      record: {kind: endpoint, hostname: adm-jump01.example.com, connector_guid: 00000000-0000-4000-8000-0000000000a1,
               os: Windows Server 2022, users: [net-admin01@example.com, net-admin02@example.com,
               sys-admin03@example.com, sys-admin04@example.com], groups: [Admin Servers], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: adm-jump01.example.com
      record: {kind: detection, detection_id: det-legacy-0305-1, name: Unsigned process opened a handle to LSASS,
               category: CredentialAccess, verdict: UNKNOWN, severity: MEDIUM, endpoint: adm-jump01.example.com,
               status: active}
    - integration: secure_endpoint
      atomic: search_hash_enterprise
      subject: 0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
      record: {kind: hash_prevalence, sha256: 0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9,
               verdict: MALICIOUS, prevalence: 1, endpoints: [adm-jump01.example.com]}
    - integration: entra
      atomic: investigate_user
      subject: net-admin01@example.com
      record: {kind: user_profile, user: net-admin01@example.com, department: IT, groups: [Network Ops],
               roles: [Network Administrator], privileged: true, risk_level: medium, risk_state: none,
               account_enabled: true}
    - integration: entra
      atomic: investigate_user
      subject: net-admin02@example.com
      record: {kind: user_profile, user: net-admin02@example.com, department: IT, groups: [Network Ops],
               roles: [Network Administrator], privileged: true, risk_level: medium, risk_state: none,
               account_enabled: true}
    - integration: entra
      atomic: investigate_user
      subject: sys-admin03@example.com
      record: {kind: user_profile, user: sys-admin03@example.com, department: IT, groups: [Server Ops],
               roles: [Intune Administrator], risk_level: medium, risk_state: none, account_enabled: true}
    - integration: entra
