# Credential-dumping workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-05-shared-admin-server
workflow: credential-dumping
description: >-
  Legacy 05, converted to typed records (C5: over a blast-radius cap becomes ELEVATED). A shared
  administration server holds cached logons of four privileged accounts. The Secure Endpoint detection
  is still unknown, but the malicious tool hash is seen on the server, which confirms credential access.
  The isolation and the tool hash block need standard approval. Four exposed accounts exceed the
  blast-radius user cap (3), so every revocation and disable needs ELEVATED approval with a blast-radius
  warning; the runtime counts every user an action touches, so the revocations are ELEVATED too
  (stricter than the legacy plan, never weaker). A lead approves. Production parity: the block_hash
  recommendation stays UNROUTED (no enabled adapter has a VERIFIED write for it; shown for manual
  handling, never executed); isolate_endpoint through secure_endpoint cannot be read back by the real
  adapter and ends UNABLE_TO_VERIFY, so containment is PARTIALLY_CONTAINED.
tags: [legacy, true_positive, critical_asset, approve_all]
legacy_source: workflows/credential-dumping/scenarios/05-shared-admin-server.yaml
mode: both
incident:
  incident_id: INC-TEST-0305
  title: Credential theft behaviour on adm-jump01.example.com
  severity: CRITICAL
  workflow_id: credential-dumping
  observables:
    - {type: hostname, value: adm-jump01.example.com}
    - {type: sha256, value: 0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9}
  trigger: {source: cisco_xdr, mitre_techniques: [T1003.001]}
environment:
