# Credential-dumping workflow scenario; fake lab data only.
schema: 1
name: edge-compromised-account-disabled
workflow: credential-dumping
description: >-
  The SAM hive is read on TH-LT-1071 by a flagged process (a MALICIOUS process event). The logged-on
  account is not privileged, but Entra already rates it high risk with a risk detection from an
  unfamiliar location after the exposure: the disable is justified and proposed beside the
  revocation (citing the risk detection), the endpoint is isolated, and the credential reset of the
  local accounts is a manual step.
tags: [edge_case, true_positive, approve_all]
mode: both
incident:
  incident_id: XDR-CD-0013
  title: Security Account Manager access on TH-LT-1071
  severity: CRITICAL
  workflow_id: credential-dumping
  observables:
    - {type: hostname, value: TH-LT-1071}
  trigger: {source: secure_endpoint, mitre_techniques: [T1003.002]}
environment:
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1071
      record: {kind: endpoint, hostname: TH-LT-1071, connector_guid: 00000000-0000-4000-8000-000000001071,
               os: Windows 11, ip_addresses: [198.51.100.71], users: [pwhite@example.com], groups: [Workstations],
               isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1071
      record: {kind: process_event, event_id: evt-cd-1071-1, endpoint: TH-LT-1071, timestamp: "2026-01-15T11:31:00Z",
               event_type: registry, process_name: hivecopy.exe, pid: 7310, file_path: SAM registry hive export,
               user: pwhite@example.com, verdict: MALICIOUS}
    - integration: entra
      atomic: investigate_user
      subject: pwhite@example.com
      record: {kind: user_profile, user: pwhite@example.com, department: Marketing, groups: [Marketing Users],
               risk_level: high, risk_state: at_risk, account_enabled: true}
    - integration: entra
      atomic: investigate_user
      subject: pwhite@example.com
      record: {kind: anomaly, anomaly_id: risk-cd-1071-1, anomaly_type: unfamiliar_location, severity: HIGH,
               user: pwhite@example.com, ip: 203.0.113.140, first_seen: "2026-01-15T11:52:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: true
  actions:
    - isolate_endpoint:TH-LT-1071
    - revoke_sessions:pwhite@example.com
    - disable_user:pwhite@example.com
  elevated: []
  considered: []
  manual_steps: [credential-reset:TH-LT-1071]
  handoffs: [account-takeover:pwhite@example.com]
  containment: CONTAINED
  controls: 2
