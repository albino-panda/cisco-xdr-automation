# Credential-dumping workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-04-domain-admin-exposed
workflow: credential-dumping
description: >-
  Legacy 04, converted to typed records (C3: protected becomes ELEVATED). Credential access is
  confirmed on a workstation where a member of the protected group Domain Admins was logged on. The
  workstation isolation needs standard approval; the session revocation and the disable of the
  Domain Admins member need ELEVATED approval with a privileged-account warning; the standard
  user's revocation needs standard approval. A lead approves.
tags: [legacy, true_positive, critical_asset, approve_all]
legacy_source: workflows/credential-dumping/scenarios/04-domain-admin-exposed.yaml
mode: both
incident:
  incident_id: INC-TEST-0304
  title: Credential theft behaviour on ws-0388.example.com
  severity: CRITICAL
  workflow_id: credential-dumping
  observables:
    - {type: hostname, value: ws-0388.example.com}
    - {type: user, value: da-ops01@example.com}
    - {type: user, value: dan.okafor@example.com}
  trigger: {source: secure_endpoint, mitre_techniques: [T1003.001]}
environment:
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: ws-0388.example.com
      record: {kind: endpoint, hostname: ws-0388.example.com, connector_guid: 00000000-0000-4000-8000-000000000388,
               os: Windows 11, users: [da-ops01@example.com, dan.okafor@example.com], groups: [Workstations],
               isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: ws-0388.example.com
      record: {kind: detection, detection_id: det-legacy-0304-1, name: Suspicious read of LSASS process memory,
               category: CredentialAccess, verdict: MALICIOUS, severity: CRITICAL, endpoint: ws-0388.example.com,
               status: active}
    - integration: entra
      atomic: investigate_user
      subject: da-ops01@example.com
      record: {kind: user_profile, user: da-ops01@example.com, department: IT, groups: [Domain Admins],
               roles: [Privileged Role Administrator], privileged: true, risk_level: high, risk_state: none,
               account_enabled: true}
    - integration: entra
      atomic: investigate_user
      subject: dan.okafor@example.com
      record: {kind: user_profile, user: dan.okafor@example.com, department: Operations, groups: [Operations Users],
               risk_level: low, risk_state: none, account_enabled: true}
analyst: {decision: APPROVE_ALL, approvers: [lead]}
expect:
  package: true
  actions:
    - isolate_endpoint:WS-0388.EXAMPLE.COM
    - revoke_sessions:da-ops01@example.com
    - disable_user:da-ops01@example.com
    - revoke_sessions:dan.okafor@example.com
  elevated: [revoke_sessions:da-ops01@example.com, disable_user:da-ops01@example.com]
  warnings: [ELEVATED APPROVAL REQUIRED, Privileged account]
  manual_steps: [credential-reset:WS-0388.EXAMPLE.COM]
  handoffs: [account-takeover:da-ops01@example.com, account-takeover:dan.okafor@example.com]
  containment: CONTAINED
  controls: 2
