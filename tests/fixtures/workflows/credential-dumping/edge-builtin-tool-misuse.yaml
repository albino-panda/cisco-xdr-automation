# Credential-dumping workflow scenario; fake lab data only.
schema: 1
name: edge-builtin-tool-misuse
workflow: credential-dumping
description: >-
  A built-in system utility is misused to dump LSASS memory. Secure Endpoint's behaviour detection
  is MALICIOUS, so credential access is confirmed and the workstation and the exposed account are
  contained. The utility's own file has a CLEAN reputation and runs on thousands of endpoints:
  blocking its hash would break it everywhere, so no hash block is proposed and the hash is listed
  as considered.
tags: [edge_case, true_positive, approve_all]
mode: both
incident:
  incident_id: XDR-CD-0011
  title: Credential theft behaviour on TH-LT-1052
  severity: CRITICAL
  workflow_id: credential-dumping
  observables:
    - {type: hostname, value: TH-LT-1052}
  trigger: {source: secure_endpoint, mitre_techniques: [T1003.001]}
environment:
  reputations:
    - {type: sha256, value: 0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed, verdict: CLEAN,
       risk_score: 0, confidence: 90, integrations: [secure_endpoint, virustotal], summary: signed system utility}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1052
      record: {kind: endpoint, hostname: TH-LT-1052, connector_guid: 00000000-0000-4000-8000-000000001052,
               os: Windows 11, ip_addresses: [198.51.100.52], users: [mlopez@example.com], groups: [Workstations],
               isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1052
      record: {kind: detection, detection_id: det-cd-1052-1, name: LSASS memory dump by a system utility,
               category: CredentialAccess, verdict: MALICIOUS, severity: HIGH, endpoint: TH-LT-1052,
               user: mlopez@example.com, sha256: 0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed,
               process_name: sysutil.exe, mitre_techniques: [T1003.001], status: active,
               first_seen: "2026-01-15T11:44:00Z"}
    - integration: secure_endpoint
      atomic: search_hash_enterprise
      subject: 0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed
      record: {kind: hash_prevalence, sha256: 0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed,
               file_name: sysutil.exe, verdict: CLEAN, prevalence: 5100, endpoints: [TH-LT-1052], truncated: true}
    - integration: entra
      atomic: investigate_user
      subject: mlopez@example.com
      record: {kind: user_profile, user: mlopez@example.com, department: Legal, groups: [Legal Users],
               risk_level: low, risk_state: none, account_enabled: true}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: true
  actions:
    - isolate_endpoint:TH-LT-1052
    - revoke_sessions:mlopez@example.com
  elevated: []
  considered: [block_hash:0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed0b5e55ed]
  manual_steps: [credential-reset:TH-LT-1052]
  handoffs: [account-takeover:mlopez@example.com]
  containment: CONTAINED
  controls: 1
