# Credential-dumping workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-02-security-agent-memory-read
workflow: credential-dumping
description: >-
  Legacy 02, converted to typed records. Benign: the organisation's approved endpoint security agent
  scans LSASS memory as part of normal protection. The detection and the file hash are both clean
  and the binary is common across the fleet, so no host is isolated and no account is touched even
  though a user is logged on. The access and the hash are listed as considered (visible, with their
  records), never silently ignored.
tags: [legacy, benign]
legacy_source: workflows/credential-dumping/scenarios/02-security-agent-memory-read.yaml
mode: both
incident:
  incident_id: INC-TEST-0302
  title: LSASS access on ws-0207.example.com
  severity: HIGH
  workflow_id: credential-dumping
  observables:
    - {type: hostname, value: ws-0207.example.com}
    - {type: sha256, value: 9e8d7c6b5a4f30211f2e3d4c5b6a79880f1e2d3c4b5a69788796a5b4c3d2e1f0}
    - {type: user, value: carol.diaz@example.com}
  trigger: {source: cisco_xdr, mitre_techniques: [T1003.001]}
environment:
  reputations:
    - {type: sha256, value: 9e8d7c6b5a4f30211f2e3d4c5b6a79880f1e2d3c4b5a69788796a5b4c3d2e1f0, verdict: CLEAN,
       risk_score: 0, confidence: 90, integrations: [secure_endpoint, virustotal], summary: endpoint security agent}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: ws-0207.example.com
      record: {kind: endpoint, hostname: ws-0207.example.com, connector_guid: 00000000-0000-4000-8000-000000000207,
               os: Windows 11, users: [carol.diaz@example.com], groups: [Workstations], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: ws-0207.example.com
      record: {kind: detection, detection_id: det-legacy-0302-1,
               name: LSASS memory read by approved endpoint security agent, category: CredentialAccess,
               verdict: CLEAN, severity: LOW, endpoint: ws-0207.example.com,
               sha256: 9e8d7c6b5a4f30211f2e3d4c5b6a79880f1e2d3c4b5a69788796a5b4c3d2e1f0, status: resolved}
    - integration: secure_endpoint
      atomic: search_hash_enterprise
      subject: 9e8d7c6b5a4f30211f2e3d4c5b6a79880f1e2d3c4b5a69788796a5b4c3d2e1f0
      record: {kind: hash_prevalence, sha256: 9e8d7c6b5a4f30211f2e3d4c5b6a79880f1e2d3c4b5a69788796a5b4c3d2e1f0,
               verdict: CLEAN, prevalence: 4200, endpoints: [ws-0207.example.com], truncated: true}
    - integration: entra
      atomic: investigate_user
      subject: carol.diaz@example.com
      record: {kind: user_profile, user: carol.diaz@example.com, department: Sales, groups: [Sales Users],
               risk_level: none, risk_state: none, account_enabled: true}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: false
  actions: []
  considered:
    - isolate_endpoint:WS-0207.EXAMPLE.COM
    - block_hash:9e8d7c6b5a4f30211f2e3d4c5b6a79880f1e2d3c4b5a69788796a5b4c3d2e1f0
  manual_steps: []
  handoffs: []
  notifications: [incident_note]
