# Credential-dumping workflow scenario; fake lab data only.
schema: 1
name: edge-defender-managed-endpoint
workflow: credential-dumping
description: >-
  The endpoint is managed by Microsoft Defender for Endpoint only (no Secure Endpoint connector).
  Defender reports a MALICIOUS alert for access to LSASS memory. The isolation is routed to Defender
  (the Defender-pinned rule), never silently switched to another product, and the logged-on
  account's sessions are revoked through Entra.
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {defender_endpoint: [endpoint], entra: [identity], virustotal: [intel]}
incident:
  incident_id: XDR-CD-0014
  title: Credential theft behaviour on TH-LT-1088
  severity: CRITICAL
  workflow_id: credential-dumping
  observables:
    - {type: hostname, value: TH-LT-1088}
  trigger: {source: defender_endpoint, mitre_techniques: [T1003.001]}
environment:
  records:
    - integration: defender_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1088
      record: {kind: endpoint, hostname: TH-LT-1088, mde_machine_id: mde-0000000000001088, os: Windows 11,
               ip_addresses: [198.51.100.88], users: [tnguyen@example.com], groups: [Workstations],
               isolation_capable: true, isolation_state: not_isolated}
    - integration: defender_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1088
      record: {kind: detection, detection_id: da-cd-1088-1, name: Suspicious access to LSASS memory,
               category: CredentialAccess, verdict: MALICIOUS, severity: HIGH, endpoint: TH-LT-1088,
               user: tnguyen@example.com, mitre_techniques: [T1003.001], status: active,
               first_seen: "2026-01-15T11:42:00Z"}
    - integration: entra
      atomic: investigate_user
      subject: tnguyen@example.com
      record: {kind: user_profile, user: tnguyen@example.com, department: Engineering, groups: [Engineering Users],
               risk_level: low, risk_state: none, account_enabled: true}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: true
  actions:
    - isolate_endpoint:TH-LT-1088
    - revoke_sessions:tnguyen@example.com
  elevated: []
  unrouted: []
  manual_steps: [credential-reset:TH-LT-1088]
  handoffs: [account-takeover:tnguyen@example.com]
  containment: CONTAINED
  controls: 1
