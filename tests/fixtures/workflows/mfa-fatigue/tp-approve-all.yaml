# mfa-fatigue workflow scenario; fake lab data only (architecture 14.5.2).
schema: 1
name: tp-approve-all
workflow: mfa-fatigue
description: >-
  Six rejected push prompts from one public IP, then an approved prompt and a successful sign-in from
  the same IP. After the approval the session creates an external forwarding rule and the user's laptop
  raises a malicious detection. The full package is recommended (revoke sessions, disable the account,
  isolate the laptop, block the prompt source IP); the analyst approves everything, the routed actions
  execute. Production parity: isolate_endpoint through secure_endpoint cannot be read back by the real
  adapter and ends UNABLE_TO_VERIFY, so containment is PARTIALLY_CONTAINED.
tags: [true_positive, approve_all]
mode: both
suite: {entra: [identity], secure_endpoint: [endpoint], meraki: [network], virustotal: [intel]}
incident:
  incident_id: XDR-MFA-0001
  title: MFA fatigue pattern followed by successful sign-in
  severity: HIGH
  workflow_id: mfa-fatigue
  observables:
    - {type: user, value: jsmith@example.com}
    - {type: ip, value: 203.0.113.80}
    - {type: hostname, value: TH-LT-1047}
  users: [jsmith@example.com]
  trigger: {source: entra, mitre_techniques: [T1621]}
