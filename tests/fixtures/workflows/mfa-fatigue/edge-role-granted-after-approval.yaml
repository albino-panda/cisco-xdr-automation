# mfa-fatigue workflow scenario; fake lab data only (architecture 14.5.2).
schema: 1
name: edge-role-granted-after-approval
workflow: mfa-fatigue
description: >-
  Within minutes of the approved prompt the session grants the user the Exchange Administrator
  directory role. The role grant is a reason to disable the account, and because the account now
  holds a privileged role, revoking and disabling it need ELEVATED approval with a warning (the
  workflow passes the granted role as asset context; it never lowers the approval level).
tags: [edge_case, critical_asset, true_positive, approve_all]
mode: both
suite: {entra: [identity], secure_endpoint: [endpoint], meraki: [network], virustotal: [intel]}
incident:
  incident_id: XDR-MFA-0014
  title: MFA fatigue pattern followed by successful sign-in
  severity: HIGH
  workflow_id: mfa-fatigue
  observables:
    - {type: user, value: jsmith@example.com}
  users: [jsmith@example.com]
  trigger: {source: entra, mitre_techniques: [T1621]}
environment:
  records:
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: mfa_event, user: jsmith@example.com, timestamp: "2026-01-15T10:30:00Z", method: push,
                result: denied, ip: 203.0.113.80, country: NL}}
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: mfa_event, user: jsmith@example.com, timestamp: "2026-01-15T10:32:00Z", method: push,
                result: denied, ip: 203.0.113.80, country: NL}}
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: mfa_event, user: jsmith@example.com, timestamp: "2026-01-15T10:34:00Z", method: push,
                result: denied, ip: 203.0.113.80, country: NL}}
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: mfa_event, user: jsmith@example.com, timestamp: "2026-01-15T10:42:00Z", method: push,
                result: approved, ip: 203.0.113.80, country: NL}}
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: sign_in, sign_in_id: si-0014-1, user: jsmith@example.com, timestamp: "2026-01-15T10:42:30Z",
                ip: 203.0.113.80, country: NL, app: Azure Portal, result: success, mfa_result: satisfied}}
    - {integration: entra, atomic: investigate_user, subject: jsmith@example.com,
       record: {kind: user_profile, user: jsmith@example.com, department: Finance, groups: [Finance Users],
                roles: [], account_enabled: true, risk_level: medium}}
    - {integration: entra, atomic: search_user_activity, subject: jsmith@example.com,
       record: {kind: role_change, user: jsmith@example.com, role_name: Exchange Administrator,
                change: assigned, privileged: true, actor: jsmith@example.com, timestamp: "2026-01-15T10:51:00Z"}}
analyst: {decision: APPROVE_ALL, approvers: [lead]}
expect:
  handoffs: ["account-takeover:jsmith@example.com"]
  actions:
    - revoke_sessions:jsmith@example.com
    - disable_user:jsmith@example.com
    - block_ip:203.0.113.80
  elevated:
    - revoke_sessions:jsmith@example.com
    - disable_user:jsmith@example.com
  warnings: [ELEVATED APPROVAL REQUIRED, Privileged account]
  containment: CONTAINED
  controls: 2
