# mfa-fatigue workflow scenario; fake lab data only (architecture 14.5.2).
schema: 1
name: tp-approve-selected
workflow: mfa-fatigue
description: >-
  Five rejected prompts, an approved prompt and a sign-in from one public IP. Revoking the sessions
  and blocking the IP are recommended; the analyst approves only the session revocation. The IP
  block is recorded as rejected by the analyst and never executed. Revocation creates no temporary
  control (it is not reversible).
tags: [true_positive, approve_selected]
mode: live
suite: {entra: [identity], secure_endpoint: [endpoint], meraki: [network], virustotal: [intel]}
incident:
  incident_id: XDR-MFA-0002
  title: MFA fatigue pattern followed by successful sign-in
  severity: HIGH
  workflow_id: mfa-fatigue
  observables:
    - {type: user, value: lgarcia@example.com}
  users: [lgarcia@example.com]
  trigger: {source: entra, mitre_techniques: [T1621]}
environment:
  records:
    - {integration: entra, atomic: investigate_authentication, subject: lgarcia@example.com,
       record: {kind: mfa_event, user: lgarcia@example.com, timestamp: "2026-01-15T09:10:00Z", method: push,
                result: denied, ip: 198.51.100.140, country: BR}}
    - {integration: entra, atomic: investigate_authentication, subject: lgarcia@example.com,
       record: {kind: mfa_event, user: lgarcia@example.com, timestamp: "2026-01-15T09:12:00Z", method: push,
                result: denied, ip: 198.51.100.140, country: BR}}
    - {integration: entra, atomic: investigate_authentication, subject: lgarcia@example.com,
       record: {kind: mfa_event, user: lgarcia@example.com, timestamp: "2026-01-15T09:14:00Z", method: push,
                result: denied, ip: 198.51.100.140, country: BR}}
    - {integration: entra, atomic: investigate_authentication, subject: lgarcia@example.com,
       record: {kind: mfa_event, user: lgarcia@example.com, timestamp: "2026-01-15T09:16:00Z", method: push,
                result: fraud_reported, ip: 198.51.100.140, country: BR}}
    - {integration: entra, atomic: investigate_authentication, subject: lgarcia@example.com,
       record: {kind: mfa_event, user: lgarcia@example.com, timestamp: "2026-01-15T09:18:00Z", method: push,
                result: denied, ip: 198.51.100.140, country: BR}}
    - {integration: entra, atomic: investigate_authentication, subject: lgarcia@example.com,
       record: {kind: mfa_event, user: lgarcia@example.com, timestamp: "2026-01-15T09:21:00Z", method: push,
                result: approved, ip: 198.51.100.140, country: BR}}
    - {integration: entra, atomic: investigate_authentication, subject: lgarcia@example.com,
       record: {kind: sign_in, sign_in_id: si-0002-1, user: lgarcia@example.com, timestamp: "2026-01-15T09:21:20Z",
                ip: 198.51.100.140, country: BR, app: Office 365 Exchange Online, result: success,
                mfa_result: satisfied}}
    - {integration: entra, atomic: investigate_user, subject: lgarcia@example.com,
       record: {kind: user_profile, user: lgarcia@example.com, department: Sales, groups: [Sales Users],
                account_enabled: true, risk_level: medium}}
analyst: {decision: APPROVE_SELECTED, approvers: [analyst], select: ["revoke_sessions:lgarcia@example.com"]}
expect:
  handoffs: ["account-takeover:lgarcia@example.com"]
  actions:
    - revoke_sessions:lgarcia@example.com
    - block_ip:198.51.100.140
  elevated: []
  results:
    revoke_sessions:lgarcia@example.com: SUCCESS
    block_ip:198.51.100.140: REJECTED_BY_ANALYST
  containment: CONTAINED
  controls: 0
