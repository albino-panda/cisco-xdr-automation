# mfa-fatigue workflow scenario; fake lab data only (architecture 14.5.2).
schema: 1
name: edge-signin-from-second-ip
workflow: mfa-fatigue
description: >-
  The prompts come from one public IP, but after the approval the session signs in from a second
  IP that IP reputation rates malicious. Both IPs are recommended for blocking: the prompt source
  by the fatigue rule, the second IP by the malicious sign-in rule (with the reputation answer as
  evidence). The second IP sent no prompts, so the fatigue rule never proposes it.
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {entra: [identity], secure_endpoint: [endpoint], meraki: [network], virustotal: [intel]}
incident:
  incident_id: XDR-MFA-0013
  title: MFA fatigue pattern followed by successful sign-in
  severity: HIGH
  workflow_id: mfa-fatigue
  observables:
    - {type: user, value: jsmith@example.com}
  users: [jsmith@example.com]
  trigger: {source: entra, mitre_techniques: [T1621]}
environment:
  reputations:
    - {type: ip, value: 198.51.100.66, verdict: MALICIOUS, risk_score: 85, confidence: 80, integrations: [meraki],
       summary: "known anonymizing proxy exit"}
  records:
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: mfa_event, user: jsmith@example.com, timestamp: "2026-01-15T10:30:00Z", method: push,
                result: denied, ip: 203.0.113.80, country: NL}}
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: mfa_event, user: jsmith@example.com, timestamp: "2026-01-15T10:32:00Z", method: push,
                result: denied, ip: 203.0.113.80, country: NL}}
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: mfa_event, user: jsmith@example.com, timestamp: "2026-01-15T10:34:00Z", method: push,
                result: denied, ip: 203.0.113.80, country: NL}}
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: mfa_event, user: jsmith@example.com, timestamp: "2026-01-15T10:42:00Z", method: push,
                result: approved, ip: 203.0.113.80, country: NL}}
    - {integration: entra, atomic: investigate_authentication, subject: jsmith@example.com,
       record: {kind: sign_in, sign_in_id: si-0013-1, user: jsmith@example.com, timestamp: "2026-01-15T10:44:00Z",
                ip: 198.51.100.66, country: DE, app: Office 365 Exchange Online, result: success,
                mfa_result: satisfied}}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  handoffs: ["account-takeover:jsmith@example.com"]
  actions:
    - revoke_sessions:jsmith@example.com
    - block_ip:203.0.113.80
    - block_ip:198.51.100.66
  elevated: []
  containment: CONTAINED
  controls: 2
