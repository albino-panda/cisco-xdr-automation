# web-attacks workflow scenario; fake lab data only.
schema: 1
name: edge-defender-managed-web-server
workflow: web-attacks
description: >-
  The web server WEB-API-02 is managed by Defender for Endpoint only (no Secure Endpoint connector).
  Defender confirms a web shell after flagged requests from 203.0.113.150 to the API import path;
  the isolation is proposed through the Defender rule, with the source and URL blocks.
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {defender_endpoint: [endpoint], cisco_xdr: [intel], umbrella: [network], meraki: [network], virustotal: [intel]}
incident:
  incident_id: XDR-WEB-0012
  title: Web shell detected on WEB-API-02
  severity: HIGH
  workflow_id: web-attacks
  observables:
    - {type: hostname, value: WEB-API-02}
    - {type: ip, value: 203.0.113.150}
  trigger: {source: defender_endpoint, mitre_techniques: [T1505.003]}
environment:
  reputations:
    - {type: ip, value: 203.0.113.150, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr, virustotal], summary: "web exploitation source"}
    - {type: sha256, value: 5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f, verdict: MALICIOUS, risk_score: 90, confidence: 85,
       integrations: [cisco_xdr, virustotal], summary: "web shell"}
  records:
    - integration: defender_endpoint
      atomic: investigate_endpoint
      subject: WEB-API-02
      record: {kind: endpoint, hostname: WEB-API-02, mde_machine_id: 4f1c0000aaaa0000bbbb0000cccc0000dddd0002,
               os: Windows Server 2022, groups: [Web Servers], ip_addresses: [198.51.100.12],
               isolation_capable: true, isolation_state: not_isolated}
    - integration: defender_endpoint
      atomic: investigate_endpoint
      subject: WEB-API-02
      record: {kind: network_connection, endpoint: WEB-API-02, remote_ip: 203.0.113.150, local_ip: 198.51.100.12,
               protocol: tcp, direction: inbound, url: "https://api.example.net/v2/import", process_name: w3wp.exe,
               count: 3, action: allowed, verdict: MALICIOUS, first_seen: "2026-01-15T09:40:00Z",
               last_seen: "2026-01-15T09:42:00Z"}
    - integration: defender_endpoint
      atomic: investigate_endpoint
      subject: WEB-API-02
      record: {kind: detection, detection_id: det-web-api-02, name: Web shell file written to web root, verdict: MALICIOUS,
               severity: HIGH, category: Web Shell, endpoint: WEB-API-02, process_name: w3wp.exe,
               sha256: 5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f,
               file_path: "C:\\inetpub\\shop\\uploads\\img_cache.aspx", mitre_techniques: [T1505.003],
               status: active, first_seen: "2026-01-15T09:43:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions:
    - block_ip:203.0.113.150
    - "block_url:https://api.example.net/v2/import"
    - isolate_endpoint:WEB-API-02
  manual_steps: ["waf-virtual-patch:https://api.example.net/v2/import", "review-web-root:WEB-API-02"]
  handoffs: ["malware:5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f5be22b8f"]
  containment: CONTAINED
  controls: 3
