# web-attacks workflow scenario; fake lab data only.
schema: 1
name: benign-no-action
workflow: web-attacks
description: >-
  Benign. A WAF rule fires on bursts of requests to the health-check path of WEB-SHOP-01 from
  198.51.100.60, the hosting provider's uptime monitor. Cisco XDR and VirusTotal rate the source
  CLEAN, the security product flags none of its requests and the server has no detection, so nothing
  is proposed and nothing is listed as considered.
tags: [benign]
mode: both
suite: {secure_endpoint: [endpoint], cisco_xdr: [intel], umbrella: [network], meraki: [network], virustotal: [intel]}
incident:
  incident_id: XDR-WEB-0004
  title: WAF rule hits on the shop health-check path
  severity: LOW
  workflow_id: web-attacks
  observables:
    - {type: hostname, value: WEB-SHOP-01}
    - {type: ip, value: 198.51.100.60}
  trigger: {source: cisco_xdr}
environment:
  reputations:
    - {type: ip, value: 198.51.100.60, verdict: CLEAN, risk_score: 5, confidence: 80,
       integrations: [cisco_xdr, virustotal], summary: "uptime monitoring service"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: endpoint, hostname: WEB-SHOP-01, connector_guid: 00000000-0000-4000-8000-000000000101,
               os: Windows Server 2022, groups: [Web Servers], ip_addresses: [198.51.100.10],
               isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: network_connection, endpoint: WEB-SHOP-01, remote_ip: 198.51.100.60, local_ip: 198.51.100.10,
               protocol: tcp, direction: inbound, url: "https://shop.example.net/healthz", process_name: w3wp.exe,
               count: 240, action: allowed, verdict: UNKNOWN, first_seen: "2026-01-15T09:40:00Z",
               last_seen: "2026-01-15T09:42:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: false
  considered: []
  manual_steps: []
  handoffs: []
  final_state: NOT_STARTED
