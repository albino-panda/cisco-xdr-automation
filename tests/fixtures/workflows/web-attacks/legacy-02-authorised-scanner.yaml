# web-attacks workflow scenario; fake lab data only.
schema: 1
name: legacy-02-authorised-scanner
workflow: web-attacks
description: >-
  Migrated from legacy scenario 02. The contracted external scanning service ran its scheduled scan.
  Reputation feeds rate the scanner SUSPICIOUS, but the detection source lists it in
  trigger.authorized_scanners (the legacy incident.context.authorized_scanners), so its block is not
  proposed and is shown as considered with the reputation record; the web server is clean. Nothing
  is proposed and nothing changes.
tags: [legacy, benign]
legacy_source: workflows/web-attacks/scenarios/02-authorised-scanner.yaml
mode: both
suite: {secure_endpoint: [endpoint], cisco_xdr: [intel], umbrella: [network], meraki: [network], virustotal: [intel]}
incident:
  incident_id: INC-TEST-WEB-0002
  title: WAF rule hits from scheduled external vulnerability scan
  severity: LOW
  workflow_id: web-attacks
  observables:
    - {type: ip, value: 198.51.100.20}
    - {type: hostname, value: web-shop-01}
  trigger: {source: "Cloudflare WAF", authorized_scanners: [198.51.100.20]}
environment:
  reputations:
    - {type: ip, value: 198.51.100.20, verdict: SUSPICIOUS, risk_score: 55, confidence: 80,
       integrations: [cisco_xdr], summary: "Talos: suspicious"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: endpoint, hostname: WEB-SHOP-01, connector_guid: 00000000-0000-4000-8000-000000000101,
               os: Windows Server 2022, groups: [Web Servers], ip_addresses: [198.51.100.10],
               isolation_capable: true, isolation_state: not_isolated}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: false
  considered: [block_ip:198.51.100.20]
  manual_steps: []
  handoffs: []
  final_state: NOT_STARTED
