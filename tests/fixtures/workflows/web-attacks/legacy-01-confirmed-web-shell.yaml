# web-attacks workflow scenario; fake lab data only.
schema: 1
name: legacy-01-confirmed-web-shell
workflow: web-attacks
description: >-
  Migrated from legacy scenario 01. An upload endpoint was exploited from one external source and Secure
  Endpoint confirmed a web shell on web-shop-01. The package blocks the source and isolates the web
  server; the clean server web-shop-02 in the same pool is left alone. The upload URL is named only by
  the incident (no request, WAF or IPS record mentions it), so it is shown as considered and never
  blocked: the observable list is not evidence that the path was exploited (P5 safety round 1). The
  legacy context fields (targeted_endpoints, vulnerable, fix_pending) are not evidence and are dropped.
  The source address was renumbered from 203.0.113.45 to 203.0.113.145, outside the lab's
  production_server range 203.0.113.0/26, and the isolation targets the host name instead of the
  connector GUID. Production parity: isolate_endpoint through secure_endpoint cannot be read back by the
  real adapter and ends UNABLE_TO_VERIFY, so containment is PARTIALLY_CONTAINED.
tags: [legacy, true_positive, approve_all]
legacy_source: workflows/web-attacks/scenarios/01-confirmed-web-shell.yaml
mode: both
suite: {secure_endpoint: [endpoint], cisco_xdr: [intel], umbrella: [network], meraki: [network], virustotal: [intel]}
incident:
  incident_id: INC-TEST-WEB-0001
  title: Web shell detected on shop web server after upload exploitation
  severity: HIGH
  workflow_id: web-attacks
  observables:
    - {type: ip, value: 203.0.113.145}
    - {type: url, value: "https://shop.example.net/upload"}
    - {type: hostname, value: web-shop-01}
    - {type: hostname, value: web-shop-02}
  trigger: {source: "Cisco Secure Endpoint"}
environment:
  reputations:
    - {type: ip, value: 203.0.113.145, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr], summary: "Talos: malicious"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: endpoint, hostname: WEB-SHOP-01, connector_guid: 00000000-0000-4000-8000-000000000101,
               os: Windows Server 2022, groups: [Web Servers], ip_addresses: [198.51.100.10],
               isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: detection, detection_id: det-legacy-web-01, name: Web shell file written to web root,
               verdict: MALICIOUS, severity: HIGH, endpoint: WEB-SHOP-01, mitre_techniques: [T1505.003], status: active,
               first_seen: "2026-01-15T09:43:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: process_event, event_id: evt-legacy-web-01-1, endpoint: WEB-SHOP-01,
               timestamp: "2026-01-15T09:42:30Z", event_type: file_create, process_name: w3wp.exe, pid: 4410,
               verdict: SUSPICIOUS}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: process_event, event_id: evt-legacy-web-01-2, endpoint: WEB-SHOP-01,
               timestamp: "2026-01-15T09:44:00Z", event_type: process_start, process_name: cmd.exe, pid: 4520,
               parent_process_name: w3wp.exe, parent_pid: 4410, verdict: SUSPICIOUS}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-02
      record: {kind: endpoint, hostname: WEB-SHOP-02, connector_guid: 00000000-0000-4000-8000-000000000102,
               os: Windows Server 2022, groups: [Web Servers], ip_addresses: [198.51.100.11],
               isolation_capable: true, isolation_state: not_isolated}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions:
    - block_ip:203.0.113.145
    - isolate_endpoint:WEB-SHOP-01
  elevated: []
  excluded: []
  considered: ["block_url:https://shop.example.net/upload"]
  manual_steps: ["review-web-root:WEB-SHOP-01"]
  handoffs: []
  containment: PARTIALLY_CONTAINED
  controls: 2
