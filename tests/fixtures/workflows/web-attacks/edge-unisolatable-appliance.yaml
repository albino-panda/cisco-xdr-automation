# web-attacks workflow scenario; fake lab data only.
schema: 1
name: edge-unisolatable-appliance
workflow: web-attacks
description: >-
  A web shell is confirmed on the web appliance WEB-APPL-01 whose agent policy does not allow
  isolation. The source and the exploited URL are still blocked; the isolation is listed as a manual
  step (take the appliance out of the load-balancer pool by hand), never silently dropped.
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {secure_endpoint: [endpoint], cisco_xdr: [intel], umbrella: [network], meraki: [network], virustotal: [intel]}
incident:
  incident_id: XDR-WEB-0014
  title: Web shell detected on WEB-APPL-01
  severity: HIGH
  workflow_id: web-attacks
  observables:
    - {type: hostname, value: WEB-APPL-01}
    - {type: ip, value: 203.0.113.160}
  trigger: {source: secure_endpoint, mitre_techniques: [T1505.003, T1190]}
environment:
  reputations:
    - {type: ip, value: 203.0.113.160, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr, virustotal], summary: "web exploitation source"}
    - {type: sha256, value: 5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e, verdict: MALICIOUS, risk_score: 90, confidence: 85,
       integrations: [cisco_xdr, virustotal], summary: "web shell"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-APPL-01
      record: {kind: endpoint, hostname: WEB-APPL-01, connector_guid: 00000000-0000-4000-8000-000000000401,
               os: Linux, groups: [Web Appliances], ip_addresses: [198.51.100.14],
               isolation_capable: false, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-APPL-01
      record: {kind: network_connection, endpoint: WEB-APPL-01, remote_ip: 203.0.113.160, local_ip: 198.51.100.14,
               protocol: tcp, direction: inbound, url: "https://portal.example.net/cgi/upload", process_name: w3wp.exe,
               count: 3, action: allowed, verdict: MALICIOUS, first_seen: "2026-01-15T09:40:00Z",
               last_seen: "2026-01-15T09:42:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-APPL-01
      record: {kind: detection, detection_id: det-web-appl-01, name: Web shell file written to web root, verdict: MALICIOUS,
               severity: HIGH, category: Web Shell, endpoint: WEB-APPL-01, process_name: w3wp.exe,
               sha256: 5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e,
               file_path: "C:\\inetpub\\shop\\uploads\\img_cache.aspx", mitre_techniques: [T1505.003],
               status: active, first_seen: "2026-01-15T09:43:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions:
    - block_ip:203.0.113.160
    - "block_url:https://portal.example.net/cgi/upload"
  manual_steps:
    - "waf-virtual-patch:https://portal.example.net/cgi/upload"
    - review-web-root:WEB-APPL-01
    - isolate_endpoint:WEB-APPL-01
  handoffs: ["malware:5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e5be11a7e"]
  containment: CONTAINED
  controls: 2
