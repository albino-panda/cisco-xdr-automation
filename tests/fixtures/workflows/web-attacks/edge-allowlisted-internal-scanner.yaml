# web-attacks workflow scenario; fake lab data only.
schema: 1
name: edge-allowlisted-internal-scanner
workflow: web-attacks
description: >-
  The organisation's own vulnerability scanner 198.51.100.77 (listed in allowlists.never_block.ips
  for this lab) scans WEB-SHOP-01 while an external source, 203.0.113.170, probes the same admin
  path with requests the security product flags MALICIOUS. Reputation feeds rate both SUSPICIOUS or
  worse. The external source is blocked; the scanner's block is built and shown as an excluded
  target with the allow-list reason (never executed, never silently dropped). The admin path shows
  no sign of exploitation, so its block is only considered, and nothing is isolated.
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {secure_endpoint: [endpoint], cisco_xdr: [intel], umbrella: [network], meraki: [network], virustotal: [intel]}
config:
  allowlists:
    never_block:
      ips: [192.0.2.53, 198.51.100.77]
incident:
  incident_id: XDR-WEB-0010
  title: Vulnerability scan against the shop application
  severity: MEDIUM
  workflow_id: web-attacks
  observables:
    - {type: hostname, value: WEB-SHOP-01}
    - {type: ip, value: 198.51.100.77}
    - {type: ip, value: 203.0.113.170}
  trigger: {source: cisco_xdr, mitre_techniques: [T1595.002]}
environment:
  reputations:
    - {type: ip, value: 198.51.100.77, verdict: SUSPICIOUS, risk_score: 55, confidence: 80,
       integrations: [cisco_xdr], summary: "scanner"}
    - {type: ip, value: 203.0.113.170, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr], summary: "scanning source"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: endpoint, hostname: WEB-SHOP-01, connector_guid: 00000000-0000-4000-8000-000000000101,
               os: Windows Server 2022, groups: [Web Servers], ip_addresses: [198.51.100.10],
               isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: network_connection, endpoint: WEB-SHOP-01, remote_ip: 198.51.100.77, local_ip: 198.51.100.10,
               protocol: tcp, direction: inbound, url: "https://shop.example.net/admin", process_name: w3wp.exe,
               count: 40, action: allowed, verdict: SUSPICIOUS, first_seen: "2026-01-15T09:40:00Z",
               last_seen: "2026-01-15T09:42:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: network_connection, endpoint: WEB-SHOP-01, remote_ip: 203.0.113.170, local_ip: 198.51.100.10,
               protocol: tcp, direction: inbound, url: "https://shop.example.net/admin", process_name: w3wp.exe,
               count: 12, action: allowed, verdict: MALICIOUS, first_seen: "2026-01-15T09:46:00Z",
               last_seen: "2026-01-15T09:48:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions: [block_ip:203.0.113.170]
  excluded: [block_ip:198.51.100.77]
  considered: ["block_url:https://shop.example.net/admin"]
  manual_steps: []
  handoffs: []
  containment: CONTAINED
  controls: 1
