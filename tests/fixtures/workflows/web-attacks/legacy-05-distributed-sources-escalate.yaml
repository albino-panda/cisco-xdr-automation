    - block_ip:203.0.113.110
    - block_ip:203.0.113.111
    - block_ip:203.0.113.112
    - block_ip:198.51.100.30
    - block_ip:198.51.100.31
    - block_ip:192.0.2.90
  elevated:
    - block_ip:203.0.113.110
    - block_ip:203.0.113.111
    - block_ip:203.0.113.112
    - block_ip:198.51.100.30
    - block_ip:198.51.100.31
    - block_ip:192.0.2.90
  warnings: [ELEVATED APPROVAL REQUIRED]
  considered: []
  containment: CONTAINED
  controls: 6
