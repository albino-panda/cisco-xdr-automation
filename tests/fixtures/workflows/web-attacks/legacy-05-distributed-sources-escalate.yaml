# web-attacks workflow scenario; fake lab data only.
schema: 1
name: legacy-05-distributed-sources-escalate
workflow: web-attacks
description: >-
  Migrated from legacy scenario 05. Exploitation attempts against the shop application arrive from
  six rated sources at once. The scenario lowers blast_radius.max_indicators to 5, so every source
  block stays proposed with ELEVATED approval and a blast-radius warning (the legacy escalation);
  the SOC lead approves. The web server shows no web shell, so nothing is isolated. Three source
  addresses were renumbered from 203.0.113.10-12 to 203.0.113.110-112, outside the lab's
  production_server range 203.0.113.0/26.
tags: [legacy, true_positive, approve_all]
legacy_source: workflows/web-attacks/scenarios/05-distributed-sources-escalate.yaml
mode: both
suite: {secure_endpoint: [endpoint], cisco_xdr: [intel], umbrella: [network], meraki: [network], virustotal: [intel]}
config:
  thresholds:
    blast_radius: {max_indicators: 5}
incident:
  incident_id: INC-TEST-WEB-0005
  title: Exploitation attempts from many sources against shop application
  severity: MEDIUM
  workflow_id: web-attacks
  observables:
    - {type: ip, value: 203.0.113.110}
    - {type: ip, value: 203.0.113.111}
    - {type: ip, value: 203.0.113.112}
    - {type: ip, value: 198.51.100.30}
    - {type: ip, value: 198.51.100.31}
    - {type: ip, value: 192.0.2.90}
    - {type: hostname, value: web-shop-01}
  trigger: {source: "Cloudflare WAF"}
environment:
  reputations:
    - {type: ip, value: 203.0.113.110, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr], summary: "exploitation source"}
    - {type: ip, value: 203.0.113.111, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr], summary: "exploitation source"}
    - {type: ip, value: 203.0.113.112, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr], summary: "exploitation source"}
    - {type: ip, value: 198.51.100.30, verdict: SUSPICIOUS, risk_score: 55, confidence: 80,
       integrations: [cisco_xdr], summary: "exploitation source"}
    - {type: ip, value: 198.51.100.31, verdict: SUSPICIOUS, risk_score: 55, confidence: 80,
       integrations: [cisco_xdr], summary: "exploitation source"}
    - {type: ip, value: 192.0.2.90, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr], summary: "exploitation source"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: endpoint, hostname: WEB-SHOP-01, connector_guid: 00000000-0000-4000-8000-000000000101,
               os: Windows Server 2022, groups: [Web Servers], ip_addresses: [198.51.100.10],
               isolation_capable: true, isolation_state: not_isolated}
analyst: {decision: APPROVE_ALL, approvers: [lead]}
expect:
