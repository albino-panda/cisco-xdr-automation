# web-attacks workflow scenario; fake lab data only.
schema: 1
name: legacy-03-scanning-only
workflow: web-attacks
description: >-
  Migrated from legacy scenario 03. An unknown external source scanned the shop application.
  Reputation rates it SUSPICIOUS, and Secure Endpoint shows only a SUSPICIOUS scanning detection
  (T1595.002, not a web shell) on the web server. The package blocks the scanning source and never
  isolates the server: scanning alone never isolates. The legacy targeted_endpoints context (none
  vulnerable) is dropped.
tags: [legacy, true_positive, approve_all]
legacy_source: workflows/web-attacks/scenarios/03-scanning-only.yaml
mode: both
suite: {secure_endpoint: [endpoint], cisco_xdr: [intel], umbrella: [network], meraki: [network], virustotal: [intel]}
incident:
  incident_id: INC-TEST-WEB-0003
  title: Vulnerability scanning against shop application
  severity: LOW
  workflow_id: web-attacks
  observables:
    - {type: ip, value: 192.0.2.77}
    - {type: hostname, value: web-shop-01}
  trigger: {source: "Cloudflare WAF"}
environment:
  reputations:
    - {type: ip, value: 192.0.2.77, verdict: SUSPICIOUS, risk_score: 55, confidence: 80,
       integrations: [cisco_xdr], summary: "Talos: suspicious"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: endpoint, hostname: WEB-SHOP-01, connector_guid: 00000000-0000-4000-8000-000000000101,
               os: Windows Server 2022, groups: [Web Servers], ip_addresses: [198.51.100.10],
               isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WEB-SHOP-01
      record: {kind: detection, detection_id: det-legacy-web-03, name: Burst of failed web requests logged,
               verdict: SUSPICIOUS, severity: LOW, endpoint: WEB-SHOP-01, mitre_techniques: [T1595.002], status: active,
               first_seen: "2026-01-15T09:30:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions: [block_ip:192.0.2.77]
  elevated: []
  considered: []
  manual_steps: []
  handoffs: []
  containment: CONTAINED
  controls: 1
