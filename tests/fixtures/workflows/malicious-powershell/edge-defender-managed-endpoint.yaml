  approvers: [analyst]
expect:
  package: true
  actions: ['terminate_process:TH-LT-6604/8800', 'isolate_endpoint:TH-LT-6604', 'block_hash:c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00',
    'block_domain:cdn-update.test']
