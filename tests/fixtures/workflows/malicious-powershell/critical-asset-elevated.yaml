# Suspicious PowerShell workflow scenario; fake lab data only (no real command lines or indicators).
schema: 1
name: critical-asset-elevated
workflow: malicious-powershell
description: >-
  The same malicious PowerShell activity on a domain controller (critical asset). Terminating the
  process and isolating the server need ELEVATED approval with a visible warning; an analyst alone
  cannot approve, the lead does. The hash and network blocks stay STANDARD. Production parity: the
  block_hash and terminate_process recommendations stay UNROUTED (no enabled adapter has a VERIFIED
  write for them; shown for manual handling, never executed); isolate_endpoint through secure_endpoint
  cannot be read back by the real adapter and ends UNABLE_TO_VERIFY, so containment is
  PARTIALLY_CONTAINED.
