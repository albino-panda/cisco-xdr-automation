  - integration: secure_endpoint
    atomic: investigate_endpoint
    subject: TH-LT-4402
    record: {kind: process_event, event_id: evt-sys-1, endpoint: TH-LT-4402, timestamp: '2026-01-15T11:36:00Z',
      event_type: process_start, process_name: powershell.exe, pid: 4242, parent_process_name: winword.exe, parent_pid: 1180,
      user: jsmith@example.com, sha256: a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2}
  - integration: secure_endpoint
    atomic: investigate_endpoint
    subject: TH-LT-4402
    record:
      kind: detection
      detection_id: det-sys-1
      name: Sample.ScriptDownloader.Generic
      verdict: MALICIOUS
      severity: HIGH
      category: Execution
      endpoint: TH-LT-4402
      user: jsmith@example.com
      status: active
      first_seen: '2026-01-15T11:37:00Z'
      process_name: powershell.exe
      sha256: a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2
      mitre_techniques: [T1059.001]
  - integration: secure_endpoint
    atomic: investigate_endpoint
    subject: TH-LT-4402
    record: {kind: process_event, event_id: evt-sys-2, endpoint: TH-LT-4402, timestamp: '2026-01-15T11:37:00Z',
