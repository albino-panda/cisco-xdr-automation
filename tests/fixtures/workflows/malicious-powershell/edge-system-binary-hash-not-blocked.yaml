# Suspicious PowerShell workflow scenario; fake lab data only (no real command lines or indicators).
schema: 1
name: edge-system-binary-hash-not-blocked
workflow: malicious-powershell
description: >-
  Edge case: the endpoint vendor's detection names the PowerShell image hash itself. The process is malicious (it
  retrieved a malicious payload and the vendor flags it), so it is terminated, the endpoint is isolated and the
  payload hash is blocked, but the system binary's own image hash is never proposed for a block (it would break
  legitimate PowerShell across the estate): it is listed as considered with the detection that names it.
tags: [edge_case, true_positive, approve_all]
mode: both
suite:
  secure_endpoint: [endpoint]
  virustotal: [intel]
  umbrella: [network]
  meraki: [network]
incident:
  incident_id: XDR-PS-0011
  title: PowerShell downloaded and ran a payload on TH-LT-4402
  severity: HIGH
  workflow_id: malicious-powershell
  observables:
  - {type: hostname, value: TH-LT-4402}
  - {type: sha256, value: a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2}
  users: [jsmith@example.com]
  trigger:
    source: secure_endpoint
    mitre_techniques: [T1059.001, T1027]
environment:
  reputations:
  - type: sha256
    value: c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00
    verdict: MALICIOUS
    risk_score: 90
    confidence: 85
    integrations: [secure_endpoint, virustotal]
    summary: downloader payload
  - type: domain
    value: cdn-update.test
    verdict: MALICIOUS
    risk_score: 85
    confidence: 80
    integrations: [virustotal, umbrella]
    summary: malware distribution
  records:
  - integration: secure_endpoint
    atomic: investigate_endpoint
    subject: TH-LT-4402
    record:
      kind: endpoint
      hostname: TH-LT-4402
      connector_guid: 00000000-0000-4000-8000-000000004402
      os: Windows 11
      groups: [Workstations]
