# Suspicious PowerShell workflow scenario; fake lab data only (no real command lines or indicators).
schema: 1
name: edge-process-already-ended
workflow: malicious-powershell
description: >-
  Edge case: the malicious PowerShell process already exited before the investigation. Termination is not proposed
  (nothing is running) and is listed as considered; the endpoint is still isolated and the payload hash and download
  domain are still blocked.
tags: [edge_case, true_positive, approve_all]
mode: both
suite:
  secure_endpoint: [endpoint]
  virustotal: [intel]
  umbrella: [network]
  meraki: [network]
incident:
  incident_id: XDR-PS-0014
  title: PowerShell downloaded a payload on TH-LT-7705
  severity: HIGH
  workflow_id: malicious-powershell
  observables:
  - {type: hostname, value: TH-LT-7705}
  users: [jsmith@example.com]
  trigger:
    source: secure_endpoint
    mitre_techniques: [T1059.001, T1027]
environment:
  reputations:
  - type: sha256
    value: c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00
    verdict: MALICIOUS
    risk_score: 90
    confidence: 85
    integrations: [secure_endpoint, virustotal]
    summary: downloader payload
  - type: domain
    value: cdn-update.test
    verdict: MALICIOUS
    risk_score: 85
    confidence: 80
    integrations: [virustotal, umbrella]
    summary: malware distribution
  records:
  - integration: secure_endpoint
    atomic: investigate_endpoint
    subject: TH-LT-7705
    record:
      kind: endpoint
      hostname: TH-LT-7705
      connector_guid: 00000000-0000-4000-8000-000000007705
      os: Windows 11
      groups: [Workstations]
      isolation_capable: true
      isolation_state: not_isolated
  - integration: secure_endpoint
    atomic: investigate_endpoint
    subject: TH-LT-7705
    record: {kind: process_event, event_id: evt-end-1, endpoint: TH-LT-7705, timestamp: '2026-01-15T11:36:00Z',
      event_type: process_start, process_name: powershell.exe, pid: 4242, parent_process_name: winword.exe, parent_pid: 1180,
      user: jsmith@example.com, sha256: a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2a1a1b2b2}
  - integration: secure_endpoint
    atomic: investigate_endpoint
    subject: TH-LT-7705
    record: {kind: process_event, event_id: evt-end-2, endpoint: TH-LT-7705, timestamp: '2026-01-15T11:37:00Z',
      event_type: file_create, process_name: powershell.exe, pid: 4242, sha256: c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00,
