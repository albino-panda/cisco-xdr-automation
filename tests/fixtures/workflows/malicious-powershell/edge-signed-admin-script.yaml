# Suspicious PowerShell workflow scenario; fake lab data only (no real command lines or indicators).
schema: 1
name: edge-signed-admin-script
workflow: malicious-powershell
description: >-
  Edge case: a signed administration script. The endpoint management agent started PowerShell with encoded content
  to run the IT team's signed inventory script; the endpoint vendor raised a LOW, SUSPICIOUS informational detection
  about the encoded content (reported technique T1027). The script hash is signed by the organisation's IT signer,
  clean and common across the fleet, the only destination is the internal inventory service, and no malicious payload
  or malicious detection exists. A suspicious characteristic of the command line is not enough: nothing is proposed,
  and the PowerShell run is listed as considered with the detection and telemetry that were checked.
tags: [edge_case, benign]
mode: dry_run
