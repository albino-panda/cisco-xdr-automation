# Suspicious PowerShell workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-03-protected-host-allowlisted-domain
workflow: malicious-powershell
description: >-
  Migrated legacy scenario 03 (guardrails, aligned with C3). PowerShell on domain controller DC-02 (the vendor reports
  obfuscated content) downloaded a malicious payload from the organisation's own web share files.example.com. The
  suspicious domain is confirmed as the payload host, but it is allow-listed: its block is shown as an excluded
  target, never executed. The domain controller is a critical asset, so its isolation is proposed with ELEVATED
  approval and a visible warning (never skipped) and the lead approves. The payload hash block (new in the brief's
  package) is STANDARD.
tags: [legacy, critical_asset, true_positive, approve_all]
legacy_source: workflows/malicious-powershell/scenarios/03-protected-host-allowlisted-domain.yaml
