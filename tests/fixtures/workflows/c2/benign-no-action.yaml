# c2 workflow scenario; fake lab data only.
schema: 1
name: benign-no-action
workflow: c2
description: >-
  Benign. A beaconing analytic fires on TH-LT-2230: the update agent agent_update.exe checks in
  every 300 seconds with telemetry.saas-vendor.test (198.51.100.20). Umbrella and VirusTotal rate
  the domain CLEAN and there is no endpoint detection, so nothing is proposed and nothing is listed
  as considered: periodicity alone never rates a destination.
tags: [benign]
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], meraki: [network], virustotal: [intel]}
incident:
  incident_id: XDR-C2-0004
  title: Regular 300 second connections from TH-LT-2230 to telemetry.saas-vendor.test
  severity: MEDIUM
  source: secure_cloud_analytics
  workflow_id: c2
  observables:
    - {type: hostname, value: TH-LT-2230}
    - {type: domain, value: telemetry.saas-vendor.test}
    - {type: ip, value: 198.51.100.20}
  trigger: {source: secure_cloud_analytics}
environment:
  reputations:
    - {type: domain, value: telemetry.saas-vendor.test, verdict: CLEAN, risk_score: 5, confidence: 80,
       integrations: [umbrella, virustotal], summary: "software updates"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-2230
      record: {kind: endpoint, hostname: TH-LT-2230, connector_guid: 0f3c2a10-0000-4000-8000-000000002230,
               os: Windows 11, groups: [Workstations], isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-2230
      record: {kind: dns_query, endpoint: TH-LT-2230, domain: telemetry.saas-vendor.test, query_type: A,
               response_ips: [198.51.100.20], count: 12, categories: [Software/Technology], action: allowed,
               first_seen: "2026-01-15T10:00:00Z", last_seen: "2026-01-15T11:00:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-2230
      record: {kind: network_connection, endpoint: TH-LT-2230, remote_ip: 198.51.100.20, remote_port: 443, protocol: tcp,
               direction: outbound, domain: telemetry.saas-vendor.test,
               process_name: agent_update.exe, pid: 2040, count: 12, action: allowed, verdict: UNKNOWN,
               first_seen: "2026-01-15T10:00:00Z", last_seen: "2026-01-15T11:00:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: false
  considered: []
  manual_steps: []
  handoffs: []
  final_state: NOT_STARTED
