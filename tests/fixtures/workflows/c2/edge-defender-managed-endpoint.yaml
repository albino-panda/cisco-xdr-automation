# c2 workflow scenario; fake lab data only.
schema: 1
name: edge-defender-managed-endpoint
workflow: c2
description: >-
  The beaconing endpoint TH-LT-4410 is managed by Defender for Endpoint only (no Secure Endpoint
  connector). Defender reports the beacon detection and the DNS lookups of the C2 domain; the
  isolation is proposed through the Defender builder (machine id) and the domain block through
  Umbrella.
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {defender_endpoint: [endpoint], umbrella: [network], virustotal: [intel]}
incident:
  incident_id: XDR-C2-0013
  title: Beaconing from TH-LT-4410 to relay-node.test
  severity: HIGH
  workflow_id: c2
  observables:
    - {type: hostname, value: TH-LT-4410}
    - {type: domain, value: relay-node.test}
  trigger: {mitre_techniques: [T1071.001]}
environment:
  reputations:
    - {type: domain, value: relay-node.test, verdict: MALICIOUS, risk_score: 90, confidence: 85,
       integrations: [umbrella, virustotal], summary: "command and control"}
  records:
    - integration: defender_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-4410
      record: {kind: endpoint, hostname: TH-LT-4410, mde_machine_id: 4f1a0b2c3d4e5f60718293a4b5c6d7e8f9a0b1c2,
               os: Windows 11, groups: [Workstations], isolation_capable: true, isolation_state: not_isolated}
    - integration: defender_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-4410
      record: {kind: detection, detection_id: det-th-lt-4410, name: Sample.C2.Beacon, verdict: MALICIOUS,
               severity: HIGH, endpoint: TH-LT-4410, status: active, first_seen: "2026-01-15T10:05:00Z"}
    - integration: defender_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-4410
      record: {kind: dns_query, endpoint: TH-LT-4410, domain: relay-node.test, query_type: A,
               response_ips: [], count: 48, categories: [Command and Control], action: allowed,
               first_seen: "2026-01-15T10:00:00Z", last_seen: "2026-01-15T11:00:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions:
    - block_domain:relay-node.test
    - isolate_endpoint:TH-LT-4410
  elevated: []
  containment: CONTAINED
  controls: 2
