# c2 workflow scenario; fake lab data only.
schema: 1
name: edge-shared-cdn-ip
workflow: c2
description: >-
  Shared CDN IP. TH-LT-5520 beacons to static-assets.test, rated MALICIOUS, which resolves to
  198.51.100.80; Secure Endpoint flags the connection. The same endpoint also resolved cdn- portal.test,
  rated CLEAN, to the same address, so the IP is shared hosting: it is not proposed for a block and is
  listed as considered (blocking it would cut legitimate sites; the domain block cuts the channel). The
  domain is blocked and the infected endpoint isolated. Production parity: isolate_endpoint through
  secure_endpoint cannot be read back by the real adapter and ends UNABLE_TO_VERIFY, so containment is
  PARTIALLY_CONTAINED.
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], meraki: [network], virustotal: [intel]}
incident:
  incident_id: XDR-C2-0011
  title: Encrypted beaconing from TH-LT-5520 to static-assets.test behind a CDN
  severity: HIGH
  workflow_id: c2
  observables:
    - {type: hostname, value: TH-LT-5520}
    - {type: domain, value: static-assets.test}
  trigger: {mitre_techniques: [T1573]}
environment:
  reputations:
    - {type: domain, value: static-assets.test, verdict: MALICIOUS, risk_score: 90, confidence: 85,
       integrations: [umbrella, virustotal], summary: "command and control"}
    - {type: domain, value: cdn-portal.test, verdict: CLEAN, risk_score: 5, confidence: 80,
       integrations: [umbrella, virustotal], summary: "content delivery"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-5520
      record: {kind: endpoint, hostname: TH-LT-5520, connector_guid: 0f3c2a10-0000-4000-8000-000000005520,
               os: Windows 11, groups: [Workstations], isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-5520
      record: {kind: detection, detection_id: det-th-lt-5520, name: Sample.C2.Beacon, verdict: MALICIOUS,
               severity: HIGH, endpoint: TH-LT-5520, status: active, first_seen: "2026-01-15T10:05:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-5520
      record: {kind: dns_query, endpoint: TH-LT-5520, domain: static-assets.test, query_type: A,
               response_ips: [198.51.100.80], count: 60, categories: [], action: allowed,
               first_seen: "2026-01-15T10:00:00Z", last_seen: "2026-01-15T11:00:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-5520
      record: {kind: dns_query, endpoint: TH-LT-5520, domain: cdn-portal.test, query_type: A,
               response_ips: [198.51.100.80], count: 3, categories: [], action: allowed,
               first_seen: "2026-01-15T09:30:00Z", last_seen: "2026-01-15T10:30:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-5520
      record: {kind: network_connection, endpoint: TH-LT-5520, remote_ip: 198.51.100.80, remote_port: 443, protocol: tcp,
               direction: outbound, domain: static-assets.test, count: 60, action: allowed, verdict: MALICIOUS,
               first_seen: "2026-01-15T10:00:00Z", last_seen: "2026-01-15T11:00:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions:
    - block_domain:static-assets.test
    - isolate_endpoint:TH-LT-5520
  considered:
    - block_ip:198.51.100.80
  excluded: []
  containment: PARTIALLY_CONTAINED
  controls: 2
