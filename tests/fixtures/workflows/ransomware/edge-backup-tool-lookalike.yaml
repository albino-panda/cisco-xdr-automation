# Ransomware workflow scenario; fake lab data only.
schema: 1
name: edge-backup-tool-lookalike
workflow: ransomware
description: >-
  A binary named like the sanctioned backup agent runs on TH-LT-1088. Unlike the real agent (clean,
  signed, on thousands of endpoints) this one is unsigned, seen on one endpoint and rated malicious,
  and the vendor flags its mass file modification together with a backup-catalog deletion by the
  recovery tool. There is no detection: the encryption-with-recovery-inhibition pattern alone
  marks the host affected. The host is isolated and the look-alike hash blocked; the real agent's
  hash, also listed in the incident, is not.
tags: [edge_case, true_positive]
mode: both
incident:
  incident_id: XDR-RW-0011
  title: Mass file modification by backup agent on TH-LT-1088
  severity: HIGH
  workflow_id: ransomware
  observables:
    - {type: hostname, value: TH-LT-1088}
    - {type: sha256, value: 8c2e4a6b1d3f5e7a8c2e4a6b1d3f5e7a8c2e4a6b1d3f5e7a8c2e4a6b1d3f5e7a}
    - {type: sha256, value: 9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f}
  trigger: {source: secure_endpoint}
