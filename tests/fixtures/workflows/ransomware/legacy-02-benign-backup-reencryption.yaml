# Ransomware workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-02-benign-backup-reencryption
workflow: ransomware
description: >-
  Legacy 02, converted to typed records. A nightly backup job re-encrypts its archive set and
  trips the mass file modification alert. The agent binary is clean and on thousands of endpoints,
  the host has no malicious detection and the service owner shows no risk. Nothing is proposed:
  no isolation, no block, no account action.
tags: [legacy, benign]
legacy_source: workflows/ransomware/scenarios/02-benign-backup-reencryption.yaml
mode: both
incident:
  incident_id: INC-TEST-RW-0002
  title: Mass file modification on backup server
  severity: HIGH
  workflow_id: ransomware
  observables:
    - {type: sha256, value: 9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f}
    - {type: hostname, value: SRV-BKP-02}
    - {type: user, value: backup.operator@example.com}
  users: [backup.operator@example.com]
  trigger: {source: cisco_xdr}
environment:
  reputations:
    - {type: sha256, value: 9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f, verdict: CLEAN,
       risk_score: 0, confidence: 90, integrations: [secure_endpoint, virustotal], summary: signed backup agent}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: SRV-BKP-02
      record: {kind: endpoint, hostname: SRV-BKP-02, connector_guid: 00000000-0000-4000-8000-0000000b0002,
               os: Windows Server 2022, ip_addresses: [198.51.100.102], users: [backup.operator@example.com],
               groups: [Backup Servers], isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: SRV-BKP-02
      record: {kind: detection, detection_id: det-bkp-02-1, name: Mass file modification, verdict: CLEAN,
               severity: LOW, endpoint: SRV-BKP-02,
               sha256: 9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: SRV-BKP-02
      record: {kind: process_event, event_id: evt-bkp-02-mass, endpoint: SRV-BKP-02,
               timestamp: "2026-01-15T02:00:00Z", event_type: file_modify, process_name: backup_agent.exe,
               sha256: 9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f, verdict: CLEAN,
               count: 52000}
    - integration: secure_endpoint
      atomic: search_hash_enterprise
      subject: 9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f
      record: {kind: hash_prevalence, sha256: 9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f9d4b2e7f1a0c6e8d3b5f7a9c1e2d4b6f,
               file_name: backup_agent.exe, verdict: CLEAN, prevalence: 3800, endpoints: [SRV-BKP-02],
               truncated: true}
    - integration: entra
      atomic: investigate_user
      subject: backup.operator@example.com
      record: {kind: user_profile, user: backup.operator@example.com, department: IT Operations,
               groups: [Backup Operators], risk_level: none, risk_state: none, account_enabled: true}
    - integration: entra
      atomic: investigate_authentication
      subject: backup.operator@example.com
      record: {kind: sign_in, sign_in_id: si-bkp-01, user: backup.operator@example.com,
               timestamp: "2026-01-15T01:55:00Z", ip: 198.51.100.15, app: Backup console, result: success}
expect:
  package: false
  actions: []
  below_threshold: []
  unrouted: []
