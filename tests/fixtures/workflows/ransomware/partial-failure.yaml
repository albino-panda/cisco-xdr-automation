# Ransomware workflow scenario; fake lab data only.
schema: 1
name: partial-failure
workflow: ransomware
description: >-
  Everything is approved; the session revocation fails at the identity provider. Containment is partial,
  the failed action is reported (never retried silently) and the isolation stands. The hash block has no
  VERIFIED write on any enabled adapter (the real Secure Endpoint adapter cannot block hashes) and is
  UNROUTED, shown for manual handling. Production parity: the block_hash recommendation stays UNROUTED
  (no enabled adapter has a VERIFIED write for it; shown for manual handling, never executed);
  isolate_endpoint through secure_endpoint cannot be read back by the real adapter and ends
  UNABLE_TO_VERIFY.
