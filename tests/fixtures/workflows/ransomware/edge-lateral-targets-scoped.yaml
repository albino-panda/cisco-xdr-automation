# Ransomware workflow scenario; fake lab data only.
schema: 1
name: edge-lateral-targets-scoped
workflow: ransomware
description: >-
  Lateral scope. TH-LT-1047 encrypts files; the related-endpoint search finds two endpoints it reached.
  TH-LT-1061 has a malicious detection of its own (a fresh payload with no reputation yet), so it is
  isolated too; TH-LT-1060 shows no ransomware activity and is only scoped for the analyst (listed in
  the workflow facts), never isolated on that basis. Production parity: isolate_endpoint through
  secure_endpoint cannot be read back by the real adapter and ends UNABLE_TO_VERIFY, so containment is
  PARTIALLY_CONTAINED.
tags: [edge_case, true_positive]
mode: both
incident:
  incident_id: XDR-RW-0014
  title: Ransomware detected on TH-LT-1047
  severity: CRITICAL
  workflow_id: ransomware
  observables:
    - {type: hostname, value: TH-LT-1047}
  trigger: {source: secure_endpoint, mitre_techniques: [T1486]}
environment:
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: endpoint, hostname: TH-LT-1047, connector_guid: 00000000-0000-4000-8000-000000001047,
               os: Windows 11, ip_addresses: [198.51.100.47], groups: [Workstations], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: detection, detection_id: det-rw-1047-lat, name: Ransomware.Generic, category: Ransomware,
               verdict: MALICIOUS, severity: CRITICAL, endpoint: TH-LT-1047}
    - integration: secure_endpoint
      atomic: search_related_endpoints
      subject: TH-LT-1047
      record: {kind: endpoint, hostname: TH-LT-1060, connector_guid: 00000000-0000-4000-8000-000000001060,
               os: Windows 11, groups: [Workstations]}
    - integration: secure_endpoint
      atomic: search_related_endpoints
      subject: TH-LT-1047
      record: {kind: endpoint, hostname: TH-LT-1061, connector_guid: 00000000-0000-4000-8000-000000001061,
               os: Windows 11, groups: [Workstations]}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1060
      record: {kind: endpoint, hostname: TH-LT-1060, connector_guid: 00000000-0000-4000-8000-000000001060,
               os: Windows 11, ip_addresses: [198.51.100.60], groups: [Workstations], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1061
      record: {kind: endpoint, hostname: TH-LT-1061, connector_guid: 00000000-0000-4000-8000-000000001061,
               os: Windows 11, ip_addresses: [198.51.100.61], groups: [Workstations], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1061
      record: {kind: detection, detection_id: det-rw-1061-1, name: Malicious activity protection,
               category: Ransomware, verdict: MALICIOUS, severity: CRITICAL, endpoint: TH-LT-1061}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: true
  actions:
    - isolate_endpoint:TH-LT-1047
    - isolate_endpoint:TH-LT-1061
  elevated: []
  containment: PARTIALLY_CONTAINED
  controls: 2
