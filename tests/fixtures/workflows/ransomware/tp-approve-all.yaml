# Ransomware workflow scenario; fake lab data only.
schema: 1
name: tp-approve-all
workflow: ransomware
description: >-
  True positive on a finance workstation. Secure Endpoint reports a critical ransomware detection, mass
  file modification and flagged recovery inhibition on TH-LT-1047; the payload (prevalence 2) is also
  staged on TH-LT-1052, which has no detection yet. The workstation contacted a domain and an IP rated
  malicious, and Entra rates the logged-on account high risk with a risk detection. The analyst approves
  everything: both isolations, the hash, domain and IP blocks, the session revocation and the account
  disable execute. Production parity: the block_hash recommendation stays UNROUTED (no enabled adapter
  has a VERIFIED write for it; shown for manual handling, never executed); isolate_endpoint through
  secure_endpoint cannot be read back by the real adapter and ends UNABLE_TO_VERIFY, so containment is
  PARTIALLY_CONTAINED.
tags: [true_positive, approve_all]
mode: both
incident:
  incident_id: XDR-RW-0001
  title: Ransomware detected on finance workstation
  severity: CRITICAL
  workflow_id: ransomware
  observables:
    - {type: hostname, value: TH-LT-1047}
    - {type: sha256, value: 3c7a9e0d5b1f4a6c3c7a9e0d5b1f4a6c3c7a9e0d5b1f4a6c3c7a9e0d5b1f4a6c}
  users: [jsmith@example.com]
  trigger: {source: secure_endpoint, mitre_techniques: [T1486]}
environment:
