# Ransomware workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-04-outbreak-blast-radius
workflow: ransomware
description: >-
  Legacy 04, converted to typed records (C5: over-limit becomes ELEVATED). The same payload encrypts
  seven operations workstations. Seven isolations exceed the endpoint blast-radius cap (5), so every
  isolation stays proposed with ELEVATED approval and a blast-radius warning, and a lead weighs
  segment-level containment. The hash block and the session revocation are outside that cap and need
  standard approval, so spread can still be slowed quickly. Production parity: the block_hash
  recommendation stays UNROUTED (no enabled adapter has a VERIFIED write for it; shown for manual
  handling, never executed).
tags: [legacy, true_positive]
legacy_source: workflows/ransomware/scenarios/04-outbreak-blast-radius.yaml
