# Ransomware workflow scenario; fake lab data only.
schema: 1
name: tp-approve-selected
workflow: ransomware
description: >-
  True positive on one workstation. The analyst approves the isolation and the hash block only:
  the session revocation is recorded as rejected by the analyst and never executed.
tags: [true_positive, approve_selected]
mode: live
incident:
  incident_id: XDR-RW-0002
  title: Ransomware detected on TH-LT-1047
  severity: CRITICAL
  workflow_id: ransomware
  observables:
    - {type: hostname, value: TH-LT-1047}
    - {type: sha256, value: 5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f}
  users: [jsmith@example.com]
  trigger: {source: secure_endpoint, mitre_techniques: [T1486]}
environment:
  reputations:
    - {type: sha256, value: 5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f, verdict: MALICIOUS, risk_score: 95, confidence: 90,
       integrations: [secure_endpoint, virustotal], summary: ransomware payload}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: endpoint, hostname: TH-LT-1047, connector_guid: 00000000-0000-4000-8000-000000001047,
               os: Windows 11, ip_addresses: [198.51.100.47], users: [jsmith@example.com], groups: [Workstations], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: detection, detection_id: det-rw-1047-1, name: Ransomware.Generic, category: Ransomware,
               verdict: MALICIOUS, severity: CRITICAL, endpoint: TH-LT-1047, user: jsmith@example.com, sha256: 5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f,
               first_seen: "2026-01-15T11:40:00Z"}
    - integration: secure_endpoint
      atomic: search_hash_enterprise
      subject: 5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f
      record: {kind: hash_prevalence, sha256: 5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f, file_name: invoice_viewer.exe,
               verdict: MALICIOUS, prevalence: 1, endpoints: [TH-LT-1047]}
    - integration: entra
      atomic: investigate_user
      subject: jsmith@example.com
      record: {kind: user_profile, user: jsmith@example.com, department: Finance, groups: [Finance Users],
               risk_level: low, risk_state: none, account_enabled: true}
analyst:
  decision: APPROVE_SELECTED
  approvers: [analyst]
  select: [isolate_endpoint:TH-LT-1047, "block_hash:5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f"]
expect:
