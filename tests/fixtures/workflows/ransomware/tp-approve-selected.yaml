    - isolate_endpoint:TH-LT-1047
    - block_hash:5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f
    - revoke_sessions:jsmith@example.com
  results:
    isolate_endpoint:TH-LT-1047: SUCCESS
    block_hash:5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f5e8a1c3f: SUCCESS
    revoke_sessions:jsmith@example.com: REJECTED_BY_ANALYST
  containment: CONTAINED
  controls: 2
