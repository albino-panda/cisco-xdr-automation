# Ransomware workflow scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-03-protected-hypervisor-and-admins
workflow: ransomware
description: >-
  Legacy 03, converted to typed records (C3: protected becomes ELEVATED). Encryption is detected on
  HV-ESX-02, DC-01, an OT controller named by its address in the production range and one ordinary
  workstation. The investigation does not mark the infrastructure hosts as protected, so the
  critical-asset policy's own host patterns and address ranges must catch them. The accounts on
  those hosts are a break-glass account and a Domain Admins member; both are high risk with risk
  detections. Every action on the three infrastructure hosts and the two privileged accounts stays
  proposed with ELEVATED approval and a warning; the workstation isolation and the payload block
  need standard approval. A lead approves.
tags: [legacy, true_positive, critical_asset]
legacy_source: workflows/ransomware/scenarios/03-protected-hypervisor-and-admins.yaml
