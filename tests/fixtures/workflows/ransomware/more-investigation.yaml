# Ransomware workflow scenario; fake lab data only.
schema: 1
name: more-investigation
workflow: ransomware
description: >-
  True positive; the analyst asks for more investigation instead of deciding
  (REQUEST_MORE_INVESTIGATION). No token is issued, nothing executes and no control is registered: the
  incident returns to NOT_STARTED, the package can no longer be approved, and a later run proposes a new
  package. Production parity: the block_hash recommendation stays UNROUTED (no enabled adapter has a
  VERIFIED write for it; shown for manual handling, never executed).
tags: [true_positive, more_investigation]
mode: both
