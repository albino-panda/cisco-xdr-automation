# suspicious-authentication workflow scenario; fake lab data only.
schema: 1
name: edge-corporate-vpn-egress
workflow: suspicious-authentication
description: >-
  lpark connects through the corporate VPN, whose exit is in Germany, so Entra sees a country the baseline
  never shows and raises a MEDIUM unfamiliar-location detection. Defender XDR shows three other accounts
  signing in from the same exit: it is a shared corporate egress that no source flags. The unusual country
  and the detection are not counted (a corporate VPN exit is not a new country), nothing is proposed and
  the account is shown as considered with the records that prove the egress is shared.
tags: [edge_case, benign]
mode: both
suite: {entra: [identity], cisco_xdr: [intel], microsoft_cloud: [network], meraki: [network], hibp: [intel],
        virustotal: [intel], intune: [endpoint]}
config:
  allowlists:
    never_block:
      ips: [198.51.100.20]
incident:
  incident_id: XDR-SA-0010
  title: Unusual sign-in location for lpark@example.com
  severity: MEDIUM
  workflow_id: suspicious-authentication
  observables:
    - {type: user, value: lpark@example.com}
  users: [lpark@example.com]
  trigger: {source: entra}
environment:
  records:
    - integration: entra
      atomic: investigate_user
      subject: lpark@example.com
      record: {kind: user_profile, user: lpark@example.com, display_name: L Park, department: Engineering,
               groups: [Engineering], account_enabled: true, risk_level: low, risk_state: none}
    - integration: entra
      atomic: investigate_authentication
      subject: lpark@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0010-1, user: lpark@example.com, timestamp: "2026-01-12T09:10:00Z",
               ip: 198.51.100.10, country: GB, app: Microsoft Teams, device_id: dev-sa-l001, device_compliant: true,
               result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: lpark@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0010-2, user: lpark@example.com, timestamp: "2026-01-13T10:20:00Z",
               ip: 198.51.100.10, country: GB, app: Office 365 Exchange Online, device_id: dev-sa-l001,
               device_compliant: true, result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: lpark@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0010-3, user: lpark@example.com, timestamp: "2026-01-15T09:45:00Z",
               ip: 198.51.100.20, country: DE, city: Frankfurt, app: Office 365 Exchange Online,
               device_id: dev-sa-l001, device_compliant: true, result: success, mfa_result: satisfied,
               risk_level: low}
    - integration: entra
      atomic: investigate_authentication
      subject: lpark@example.com
      record: {kind: anomaly, anomaly_id: rd-sa-0010-1, anomaly_type: unfamiliar_location, severity: MEDIUM,
               user: lpark@example.com, ip: 198.51.100.20, first_seen: "2026-01-15T09:45:00Z"}
    - integration: microsoft_cloud
      atomic: search_ip_enterprise
      subject: 198.51.100.20
      record: {kind: sign_in, sign_in_id: si-sa-0010-x1, user: akim@example.com, timestamp: "2026-01-15T08:05:00Z",
               ip: 198.51.100.20, country: DE, app: Microsoft Teams, result: success, mfa_result: satisfied}
    - integration: microsoft_cloud
      atomic: search_ip_enterprise
      subject: 198.51.100.20
      record: {kind: sign_in, sign_in_id: si-sa-0010-x2, user: rlee@example.com, timestamp: "2026-01-15T08:40:00Z",
               ip: 198.51.100.20, country: DE, app: Office 365 Exchange Online, result: success,
               mfa_result: satisfied}
    - integration: microsoft_cloud
      atomic: search_ip_enterprise
      subject: 198.51.100.20
      record: {kind: sign_in, sign_in_id: si-sa-0010-x3, user: tnguyen@example.com, timestamp: "2026-01-15T09:10:00Z",
               ip: 198.51.100.20, country: DE, app: Microsoft Teams, result: success, mfa_result: satisfied}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: false
  actions: []
  below_threshold: []
  considered: ["revoke_sessions:lpark@example.com"]
  handoffs: []
