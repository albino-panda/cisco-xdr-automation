# suspicious-authentication workflow scenario; fake lab data only.
schema: 1
name: edge-unmanaged-device-leaked-credentials
workflow: suspicious-authentication
description: >-
  cnovak signs in successfully at 03:05 UTC from a residential IP that Cisco XDR rates clean, in the usual
  country, but from an unregistered, non-compliant device; the managed laptop the incident names is
  non-compliant in Intune and Entra reports a leaked-credentials detection. Device (1), hour (1) and
  exposure (1) reach the threshold with two points from the sign-in itself: the revocation is proposed.
  Credential exposure counts only because the sign-in itself is unusual. The clean IP is not blocked.
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {entra: [identity], cisco_xdr: [intel], microsoft_cloud: [network], meraki: [network], hibp: [intel],
        virustotal: [intel], intune: [endpoint]}
incident:
  incident_id: XDR-SA-0014
  title: Sign-in from unmanaged device for cnovak@example.com
  severity: MEDIUM
  workflow_id: suspicious-authentication
  observables:
    - {type: user, value: cnovak@example.com}
    - {type: endpoint_id, value: 00000000-0000-4000-8000-0000000000c1}
  users: [cnovak@example.com]
  trigger: {source: entra}
environment:
  reputations:
    - {type: ip, value: 198.51.100.120, verdict: CLEAN, risk_score: 0, confidence: 60,
       integrations: [cisco_xdr], summary: residential broadband range}
  records:
    - integration: entra
      atomic: investigate_user
      subject: cnovak@example.com
      record: {kind: user_profile, user: cnovak@example.com, display_name: C Novak, department: HR,
               groups: [HR Users], account_enabled: true, risk_level: medium, risk_state: at_risk}
    - integration: entra
      atomic: investigate_authentication
      subject: cnovak@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0014-1, user: cnovak@example.com, timestamp: "2026-01-12T09:20:00Z",
               ip: 198.51.100.10, country: GB, app: Microsoft Teams, device_id: dev-sa-c001, device_compliant: true,
               result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: cnovak@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0014-2, user: cnovak@example.com, timestamp: "2026-01-13T10:10:00Z",
               ip: 198.51.100.10, country: GB, app: Office 365 Exchange Online, device_id: dev-sa-c001,
               device_compliant: true, result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: cnovak@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0014-3, user: cnovak@example.com, timestamp: "2026-01-14T11:00:00Z",
               ip: 198.51.100.10, country: GB, app: Office 365 Exchange Online, device_id: dev-sa-c001,
               device_compliant: true, result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: cnovak@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0014-4, user: cnovak@example.com, timestamp: "2026-01-15T03:05:00Z",
               ip: 198.51.100.120, country: GB, app: Office 365 Exchange Online, device_compliant: false,
               result: success, mfa_result: satisfied, risk_level: low}
    - integration: entra
      atomic: investigate_user
      subject: cnovak@example.com
      record: {kind: anomaly, anomaly_id: rd-sa-0014-1, anomaly_type: leaked_credentials, severity: MEDIUM,
               user: cnovak@example.com, detail: credentials of the account found in a public leak,
               first_seen: "2026-01-15T01:00:00Z"}
    - integration: intune
      atomic: investigate_endpoint
      subject: 00000000-0000-4000-8000-0000000000c1
      record: {kind: endpoint, hostname: TH-LT-2044, intune_device_id: 00000000-0000-4000-8000-0000000000c1,
               os: Windows 11, users: [cnovak@example.com], health_state: noncompliant}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: true
  actions: [revoke_sessions:cnovak@example.com]
  handoffs: ["account-takeover:cnovak@example.com"]
  containment: CONTAINED
  controls: 0
