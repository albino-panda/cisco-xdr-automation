# suspicious-authentication workflow scenario; fake lab data only.
schema: 1
name: partial-failure
workflow: suspicious-authentication
description: >-
  The analyst approves the package (revoke and block) for the sign-in of pchan from a malicious IP in a
  country and on a device the baseline never shows; the Meraki IP block fails at the vendor. The sessions
  are revoked, the block is reported FAILED and the overall result is PARTIALLY_CONTAINED. Nothing is
  retried silently.
tags: [partial_failure, true_positive, approve_all]
mode: live
suite: {entra: [identity], cisco_xdr: [intel], microsoft_cloud: [network], meraki: [network], hibp: [intel],
        virustotal: [intel], intune: [endpoint]}
incident:
  incident_id: XDR-SA-0007
  title: Suspicious sign-in for pchan@example.com from a new device
  severity: HIGH
  workflow_id: suspicious-authentication
  observables:
    - {type: user, value: pchan@example.com}
  users: [pchan@example.com]
  trigger: {source: entra}
environment:
  reputations:
    - {type: ip, value: 198.51.100.150, verdict: MALICIOUS, risk_score: 90, confidence: 80,
       integrations: [cisco_xdr], summary: credential-abuse infrastructure}
  records:
    - integration: entra
      atomic: investigate_user
      subject: pchan@example.com
      record: {kind: user_profile, user: pchan@example.com, display_name: P Chan, department: Operations,
               groups: [Operations], account_enabled: true, risk_level: medium, risk_state: at_risk}
    - integration: entra
      atomic: investigate_authentication
      subject: pchan@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0007-1, user: pchan@example.com, timestamp: "2026-01-13T08:50:00Z",
               ip: 198.51.100.32, country: SG, app: Office 365 Exchange Online, device_id: dev-sa-p001,
               device_compliant: true, result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: pchan@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0007-2, user: pchan@example.com, timestamp: "2026-01-15T10:50:00Z",
               ip: 198.51.100.150, country: VN, app: Office 365 Exchange Online, device_id: dev-sa-x077,
               result: success, mfa_result: satisfied, risk_level: medium}
  faults:
    - {kind: FAIL, integration: meraki, operation: block_ip, times: 10}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions:
    - revoke_sessions:pchan@example.com
    - block_ip:198.51.100.150
  containment: PARTIALLY_CONTAINED
  results:
    revoke_sessions:pchan@example.com: SUCCESS
    block_ip:198.51.100.150: FAILED
  controls: 0
