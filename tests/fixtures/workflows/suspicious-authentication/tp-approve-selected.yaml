# suspicious-authentication workflow scenario; fake lab data only.
schema: 1
name: tp-approve-selected
workflow: suspicious-authentication
description: >-
  The sessions of mwong were revoked at 01:00 UTC after an earlier alert, yet at 04:20 a successful sign-in
  comes from an IP that Cisco XDR rates malicious, in a country and on a device the baseline never shows.
  The package revokes the sessions, disables the account (used again after revocation) and blocks the IP.
  The analyst approves only the revocation and the block: the disable is recorded as rejected by the
  analyst and never runs.
tags: [true_positive, approve_selected]
mode: both
suite: {entra: [identity], cisco_xdr: [intel], microsoft_cloud: [network], meraki: [network], hibp: [intel],
        virustotal: [intel], intune: [endpoint]}
incident:
  incident_id: XDR-SA-0002
  title: Suspicious sign-in for mwong@example.com after session revocation
  severity: HIGH
  workflow_id: suspicious-authentication
  observables:
    - {type: user, value: mwong@example.com}
  users: [mwong@example.com]
  trigger: {source: entra}
environment:
  reputations:
    - {type: ip, value: 198.51.100.161, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr], summary: credential-abuse infrastructure}
  records:
    - integration: entra
      atomic: investigate_user
      subject: mwong@example.com
      record: {kind: user_profile, user: mwong@example.com, display_name: M Wong, department: Sales,
               groups: [Sales], account_enabled: true, risk_level: medium, risk_state: at_risk,
               sessions_valid_from: "2026-01-15T01:00:00Z"}
    - integration: entra
      atomic: investigate_authentication
      subject: mwong@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0002-1, user: mwong@example.com, timestamp: "2026-01-12T14:10:00Z",
               ip: 198.51.100.30, country: US, city: New York, app: Office 365 Exchange Online,
               device_id: dev-sa-m001, device_compliant: true, result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: mwong@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0002-2, user: mwong@example.com, timestamp: "2026-01-13T15:20:00Z",
               ip: 198.51.100.30, country: US, city: New York, app: Microsoft Teams,
               device_id: dev-sa-m001, device_compliant: true, result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: mwong@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0002-3, user: mwong@example.com, timestamp: "2026-01-15T04:20:00Z",
               ip: 198.51.100.161, country: BR, app: Office 365 Exchange Online, device_id: dev-sa-x009,
               device_compliant: false, result: success, mfa_result: satisfied, risk_level: medium}
analyst:
  decision: APPROVE_SELECTED
  approvers: [analyst]
  select: [revoke_sessions:mwong@example.com, block_ip:198.51.100.161]
expect:
  package: true
  actions:
    - revoke_sessions:mwong@example.com
    - disable_user:mwong@example.com
    - block_ip:198.51.100.161
  results:
    revoke_sessions:mwong@example.com: SUCCESS
    block_ip:198.51.100.161: SUCCESS
    disable_user:mwong@example.com: REJECTED_BY_ANALYST
  containment: CONTAINED
  controls: 1
