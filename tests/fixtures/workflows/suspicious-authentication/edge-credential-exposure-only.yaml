# suspicious-authentication workflow scenario; fake lab data only.
schema: 1
name: edge-credential-exposure-only
workflow: suspicious-authentication
description: >-
  An alert reports that the address of hlopez appears in breach data (HIBP), but every recent sign-in comes
  from the usual office, country, registered device and hours. Credential exposure is never contained on
  its own: nothing is proposed, the account is shown as considered, and confirming a password change is a
  manual help-desk step.
tags: [edge_case, benign]
mode: both
suite: {entra: [identity], cisco_xdr: [intel], microsoft_cloud: [network], meraki: [network], hibp: [intel],
        virustotal: [intel], intune: [endpoint]}
incident:
  incident_id: XDR-SA-0012
  title: Credential exposure reported for hlopez@example.com
  severity: LOW
  workflow_id: suspicious-authentication
  observables:
    - {type: user, value: hlopez@example.com}
  users: [hlopez@example.com]
  trigger: {source: cisco_xdr}
environment:
  reputations:
    - {type: email_address, value: hlopez@example.com, verdict: SUSPICIOUS, risk_score: 30, confidence: 90,
       integrations: [hibp], summary: address appears in 1 known breach}
    - {type: ip, value: 198.51.100.10, verdict: CLEAN, risk_score: 0, confidence: 80,
       integrations: [cisco_xdr], summary: corporate office egress}
  records:
    - integration: entra
      atomic: investigate_user
      subject: hlopez@example.com
      record: {kind: user_profile, user: hlopez@example.com, display_name: H Lopez, department: Finance,
               groups: [Finance Users], account_enabled: true, risk_level: low, risk_state: none}
    - integration: entra
      atomic: investigate_authentication
      subject: hlopez@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0012-1, user: hlopez@example.com, timestamp: "2026-01-12T09:00:00Z",
               ip: 198.51.100.10, country: GB, app: Microsoft Teams, device_id: dev-sa-h001, device_compliant: true,
               result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: hlopez@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0012-2, user: hlopez@example.com, timestamp: "2026-01-13T10:30:00Z",
               ip: 198.51.100.10, country: GB, app: Microsoft Teams, device_id: dev-sa-h001, device_compliant: true,
               result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: hlopez@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0012-3, user: hlopez@example.com, timestamp: "2026-01-14T08:45:00Z",
               ip: 198.51.100.10, country: GB, app: Office 365 Exchange Online, device_id: dev-sa-h001,
               device_compliant: true, result: success, mfa_result: satisfied}
    - integration: entra
      atomic: investigate_authentication
      subject: hlopez@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0012-4, user: hlopez@example.com, timestamp: "2026-01-15T09:30:00Z",
               ip: 198.51.100.10, country: GB, app: Office 365 Exchange Online, device_id: dev-sa-h001,
               device_compliant: true, result: success, mfa_result: satisfied}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: false
  actions: []
  considered: ["revoke_sessions:hlopez@example.com"]
  manual_steps: ["password-reset:hlopez@example.com"]
  handoffs: []
