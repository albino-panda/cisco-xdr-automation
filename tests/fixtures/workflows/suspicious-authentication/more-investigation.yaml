# suspicious-authentication workflow scenario; fake lab data only.
schema: 1
name: more-investigation
workflow: suspicious-authentication
description: >-
  True positive; the analyst asks for more investigation instead of deciding (REQUEST_MORE_INVESTIGATION).
  No token is issued, nothing executes and no control is registered: the incident returns to
  NOT_STARTED, the package can no longer be approved, and a later run proposes a new package.
tags: [true_positive, more_investigation]
mode: both
suite: {entra: [identity], cisco_xdr: [intel], microsoft_cloud: [network], meraki: [network], hibp: [intel],
        virustotal: [intel], intune: [endpoint]}
incident:
  incident_id: XDR-SA-0003-MI
  title: Sign-in from Tor exit node for rlee@example.com
  severity: HIGH
  workflow_id: suspicious-authentication
  observables:
    - {type: user, value: rlee@example.com}
    - {type: ip, value: 203.0.113.177}
  users: [rlee@example.com]
  trigger: {source: entra}
environment:
  reputations:
    - {type: ip, value: 203.0.113.177, verdict: MALICIOUS, risk_score: 85, confidence: 75,
       integrations: [cisco_xdr], summary: Tor exit node used for credential abuse}
  records:
    - integration: entra
      atomic: investigate_user
      subject: rlee@example.com
      record: {kind: user_profile, user: rlee@example.com, display_name: R Lee, department: Engineering,
               groups: [Engineering], account_enabled: true, risk_level: medium, risk_state: at_risk}
    - integration: entra
      atomic: investigate_authentication
      subject: rlee@example.com
      record: {kind: sign_in, sign_in_id: si-sa-0003-1, user: rlee@example.com, timestamp: "2026-01-15T10:40:00Z",
               ip: 203.0.113.177, country: DE, app: Azure Portal, result: success, mfa_result: satisfied,
               risk_level: medium}
    - integration: entra
      atomic: investigate_authentication
      subject: rlee@example.com
      record: {kind: anomaly, anomaly_id: rd-sa-0003-1, anomaly_type: anonymous_ip, severity: MEDIUM,
               user: rlee@example.com, ip: 203.0.113.177, detail: sign-in from an anonymous IP address,
               first_seen: "2026-01-15T10:40:00Z"}
analyst: {decision: REQUEST_MORE_INVESTIGATION, approvers: [analyst], comment: check the other endpoints of the user first}
expect:
  actions:
    - revoke_sessions:rlee@example.com
    - block_ip:203.0.113.177
  decision_state: NOT_STARTED
  controls: 0
  final_state: NOT_STARTED
