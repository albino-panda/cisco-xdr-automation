# Unauthorised remote access tool scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-05-helpdesk-campaign-blast-radius
workflow: unauthorized-rmm
description: >-
  Migrated legacy scenario 05 (blast radius, aligned with C5). The same fake help-desk caller reaches
  six users in one morning and each gets an active FictiDesk session to the suspicious relay. The relay
  domain and installer hash blocks are proposed once (duplicates collapse), but the per-host actions
  touch six endpoints, over blast_radius.max_endpoints (5): every isolation and process termination
  stays in the package with ELEVATED approval and a blast-radius warning instead of containing part of
  the group, and the lead approves. Production parity: the block_hash and terminate_process
  recommendations stay UNROUTED (no enabled adapter has a VERIFIED write for them; shown for manual
  handling, never executed); isolate_endpoint through secure_endpoint cannot be read back by the real
  adapter and ends UNABLE_TO_VERIFY, so containment is PARTIALLY_CONTAINED.
