# Unauthorised remote access tool scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-01-unapproved-tool-fake-helpdesk
workflow: unauthorized-rmm
description: >-
  Migrated legacy scenario 01. After a mail-bombing wave, a caller posing as the IT help desk talks a
  finance user into installing the unapproved tool FictiDesk and opens a live session. Secure Endpoint
  flags the tool (T1219), Umbrella rates its relay domain suspicious, and the session is still active on
  WS-FIN-014. The package blocks the tool's two relay domains and its installer hash, terminates the
  running tool (new in the runtime) and isolates the one host with the active session. The internal
  domain, the unrelated document hash and the second investigated host (no session) are left alone;
  the unrated relay IP is shared vendor infrastructure and is listed as considered.
tags: [legacy, true_positive, approve_all]
legacy_source: workflows/unauthorized-rmm/scenarios/01-unapproved-tool-fake-helpdesk.yaml
