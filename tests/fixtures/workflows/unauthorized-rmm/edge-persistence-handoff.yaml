# Unauthorised remote access tool scenario; fake lab data only.
schema: 1
name: edge-persistence-handoff
workflow: unauthorized-rmm
description: >-
  Edge case: an Atera agent the tenant does not use was installed as a service on a workstation and
  Secure Endpoint flags it. No session is open (its last connection was blocked by the proxy), so
  isolation is not proposed. Terminating the running agent and blocking its binary are recommended but
  UNROUTED: the real Secure Endpoint adapter has no VERIFIED write for either and no other enabled
  adapter has one, so both are shown for manual handling. Removing the service has no VERIFIED write
  either: the run hands the endpoint off to the persistence workflow. The workstation's user shows a
  high identity risk in Entra, so the account is handed off to account-takeover. Hand-offs are
  suggestions only; the analyst approves the selected relay-domain block. Production parity: the
  block_hash and terminate_process recommendations stay UNROUTED (no enabled adapter has a VERIFIED
  write for them; shown for manual handling, never executed).
tags: [edge_case, true_positive, approve_selected]
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], virustotal: [intel], meraki: [network], entra: [identity]}
incident:
  incident_id: XDR-RMM-0015
  title: Remote access tool Atera installed on TH-LT-5120
  severity: HIGH
  workflow_id: unauthorized-rmm
  observables:
    - {type: hostname, value: TH-LT-5120}
  users: [mlopez@example.com]
  trigger: {source: secure_endpoint, mitre_techniques: [T1219]}
environment:
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-5120
      record: {kind: endpoint, hostname: TH-LT-5120, connector_guid: 00000000-0000-4000-8000-000000005120,
               os: Windows 11, groups: [Workstations], users: [mlopez@example.com], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-5120
      record: {kind: detection, detection_id: det-rmm-5120-1, name: PUA.RemoteAccess.Atera, category: RemoteAccessTool,
               verdict: SUSPICIOUS, severity: HIGH, endpoint: TH-LT-5120, user: mlopez@example.com, status: active,
               sha256: a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2,
               process_name: AteraAgent.exe, mitre_techniques: [T1219], first_seen: "2026-01-15T07:55:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-5120
      record: {kind: process_event, event_id: evt-rmm-5120-1, endpoint: TH-LT-5120, timestamp: "2026-01-15T07:55:00Z",
               event_type: process_start, process_name: AteraAgent.exe, pid: 5120, parent_process_name: services.exe,
               sha256: a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2}
    - integration: secure_endpoint
