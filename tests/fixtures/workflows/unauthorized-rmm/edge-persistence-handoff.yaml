               sha256: a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2a7e2,
               created_at: "2026-01-15T07:54:00Z", verdict: SUSPICIOUS}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-5120
      record: {kind: network_connection, endpoint: TH-LT-5120, domain: agent-api.atera-relay.test,
