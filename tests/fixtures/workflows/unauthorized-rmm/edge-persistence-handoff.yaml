  considered: [block_ip:198.51.100.150]
  manual_steps: [uninstall Atera on TH-LT-5120]
  handoffs: ["persistence:TH-LT-5120", "account-takeover:mlopez@example.com"]
  results:
    block_domain:agent-api.atera-relay.test: SUCCESS
  containment: CONTAINED
  controls: 1
