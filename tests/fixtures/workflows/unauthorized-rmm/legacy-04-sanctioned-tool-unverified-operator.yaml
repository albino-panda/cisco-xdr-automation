# Unauthorised remote access tool scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-04-sanctioned-tool-unverified-operator
workflow: unauthorized-rmm
description: >-
  Migrated legacy scenario 04 (RMM-specific edge case). A caller posing as the help desk has the user
  join a session of the sanctioned tool ExampleRMM from an account outside IT, with no matching service
  desk ticket; Secure Endpoint rates the session MALICIOUS. Blocking the relay domain or the binary
  would break IT's own remote support fleet-wide, so both are shown as excluded targets
  (allowlists.approved_rmm) and terminating the approved binary is withheld (ALLOWLISTED). The live
  session by an unverified operator is what matters, so the host is isolated anyway.
tags: [legacy, true_positive, approve_all]
legacy_source: workflows/unauthorized-rmm/scenarios/04-sanctioned-tool-unverified-operator.yaml
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], virustotal: [intel], meraki: [network], entra: [identity]}
config:
  allowlists:
    approved_rmm:
      - name: ExampleRMM
        hashes: [e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1]
        domains: [relay.examplermm.example]
incident:
