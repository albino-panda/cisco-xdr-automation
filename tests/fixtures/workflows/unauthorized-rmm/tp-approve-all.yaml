# Unauthorised remote access tool scenario; fake lab data only.
schema: 1
name: tp-approve-all
workflow: unauthorized-rmm
description: >-
  True positive on one workstation. After a call from someone posing as the IT help desk, the user
  downloaded AnyDesk from a lure site and a remote session opened to a relay whose IP is rated
  malicious. The tool is not sanctioned (no approved_rmm entry) and Secure Endpoint flags it. The
  package terminates the running tool, blocks its binary, its relay domain, the lure download domain and
  the rated peer IP, and isolates the workstation. The analyst approves everything; every routed action
  executes and the reversible ones are registered as controls. Uninstalling the tool stays a manual
  step. Production parity: the block_hash and terminate_process recommendations stay UNROUTED (no
  enabled adapter has a VERIFIED write for them; shown for manual handling, never executed);
  isolate_endpoint through secure_endpoint cannot be read back by the real adapter and ends
  UNABLE_TO_VERIFY, so containment is PARTIALLY_CONTAINED.
tags: [true_positive, approve_all]
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], virustotal: [intel], meraki: [network], entra: [identity]}
