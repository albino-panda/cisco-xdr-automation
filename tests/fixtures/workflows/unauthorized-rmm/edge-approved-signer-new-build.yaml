      record: {kind: process_event, event_id: evt-rmm-3220-1, endpoint: TH-LT-3220, timestamp: "2026-01-15T08:30:00Z",
               event_type: process_start, process_name: ExampleRmmAgent.exe, pid: 3220, parent_process_name: services.exe,
               sha256: e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-3220
