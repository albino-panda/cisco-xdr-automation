# Unauthorised remote access tool scenario; fake lab data only.
schema: 1
name: edge-approved-signer-new-build
workflow: unauthorized-rmm
description: >-
  Edge case: a new build of the sanctioned Example RMM agent whose hash is not listed yet. Secure
  Endpoint flags the unknown build as a potentially unwanted remote access tool (SUSPICIOUS), but the
  hash prevalence record reports the approved signer (allowlists.approved_rmm signers). The hash block
  and the process termination are withheld as ALLOWLISTED and listed as considered, the relay domain
  block is excluded by the approved domain, and the session shows no untrusted operator, so isolation
  is not proposed either. Nothing remains to approve: no package, everything visible in the notes.
tags: [edge_case, benign]
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], virustotal: [intel], meraki: [network], entra: [identity]}
incident:
  incident_id: XDR-RMM-0012
  title: Remote access tool detected on TH-LT-3220
  severity: MEDIUM
  workflow_id: unauthorized-rmm
  observables:
    - {type: hostname, value: TH-LT-3220}
  trigger: {source: secure_endpoint, mitre_techniques: [T1219]}
environment:
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-3220
      record: {kind: endpoint, hostname: TH-LT-3220, connector_guid: 00000000-0000-4000-8000-000000003220,
               os: Windows 11, groups: [Workstations], isolation_capable: true, isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-3220
      record: {kind: detection, detection_id: det-rmm-3220-1, name: PUA.RemoteAccess.Unknown, category: RemoteAccessTool,
               verdict: SUSPICIOUS, severity: MEDIUM, endpoint: TH-LT-3220, status: active,
               sha256: e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1,
               process_name: ExampleRmmAgent.exe, mitre_techniques: [T1219], first_seen: "2026-01-15T08:30:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
