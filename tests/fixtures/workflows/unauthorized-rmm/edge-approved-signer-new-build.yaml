               first_seen: "2026-01-15T08:31:00Z", last_seen: "2026-01-15T11:00:00Z", count: 90, action: allowed}
    - integration: secure_endpoint
      atomic: search_hash_enterprise
      subject: e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1
      record: {kind: hash_prevalence, sha256: e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1,
