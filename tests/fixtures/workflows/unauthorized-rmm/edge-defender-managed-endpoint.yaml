# Unauthorised remote access tool scenario; fake lab data only.
schema: 1
name: edge-defender-managed-endpoint
workflow: unauthorized-rmm
description: >-
  Edge case: the endpoint is managed by Defender for Endpoint only (machine id, no Secure Endpoint
  connector), and the RustDesk client talks directly to a self-hosted relay IP that Defender's own
  network telemetry rates MALICIOUS (no relay domain). Isolation is proposed through Defender (the
  Secure Endpoint rule does not apply); the process termination, the binary block and the peer IP
  block land on Defender too. Secure Endpoint and Umbrella (both required) are not enabled in this
  tenant: the run notes it and confidence drops, but the recommendation stands on the other evidence.
tags: [edge_case, true_positive, approve_all]
