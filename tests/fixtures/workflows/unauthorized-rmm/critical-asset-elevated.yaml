# Unauthorised remote access tool scenario; fake lab data only.
schema: 1
name: critical-asset-elevated
workflow: unauthorized-rmm
description: >-
  The tool runs on a production application server (critical asset). The process termination and the
  isolation on it need ELEVATED approval with a visible warning; an analyst alone cannot approve, the
  lead does. The hash, domain and IP blocks stay STANDARD. Production parity: the block_hash and
  terminate_process recommendations stay UNROUTED (no enabled adapter has a VERIFIED write for them;
  shown for manual handling, never executed); isolate_endpoint through secure_endpoint cannot be read
  back by the real adapter and ends UNABLE_TO_VERIFY, so containment is PARTIALLY_CONTAINED.
tags: [critical_asset, true_positive, approve_all]
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], virustotal: [intel], meraki: [network], entra: [identity]}
