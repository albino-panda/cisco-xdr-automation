# Unauthorised remote access tool scenario; fake lab data only. Migrated from the legacy spec scenario.
schema: 1
name: legacy-02-sanctioned-examplermm
workflow: unauthorized-rmm
description: >-
  Migrated legacy scenario 02. The detection fires on ExampleRMM, which is in allowlists.approved_rmm
  (scenario config: its hash and relay domain). The endpoint product reports it as allowed by policy
  (CLEAN, INFO), the binary and the relay are rated clean, the binary runs on 1480 endpoints, and the
  session was opened by a help-desk engineer from the internal IT network against an existing ticket.
  Nothing flags the tool and no session reaches outside the organisation, so nothing is blocked or
  isolated: no package. The tool is listed as considered with its records.
tags: [legacy, benign]
legacy_source: workflows/unauthorized-rmm/scenarios/02-sanctioned-examplermm.yaml
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], virustotal: [intel], meraki: [network], entra: [identity]}
config:
  allowlists:
    approved_rmm:
      - name: ExampleRMM
        hashes: [e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1]
        domains: [relay.examplermm.example]
incident:
  incident_id: INC-TEST-RMM-0002
  title: Remote access tool ExampleRMM session on ws-hr-007
  severity: HIGH
  workflow_id: unauthorized-rmm
  source: Cisco Secure Endpoint
  observables:
    - {type: domain, value: relay.examplermm.example}
    - {type: sha256, value: e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1}
    - {type: hostname, value: WS-HR-007}
  users: [user02@example.com]
  trigger: {source: secure_endpoint, mitre_techniques: [T1219],
            initial_contact: User-raised service desk ticket for a printer driver issue}
environment:
