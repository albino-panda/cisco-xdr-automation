       risk_score: 0, confidence: 80, integrations: [virustotal], summary: "signed remote management agent"}
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WS-HR-007
      record: {kind: endpoint, hostname: WS-HR-007, connector_guid: 00000000-0000-4000-8000-00000000a007,
               groups: [HR Workstations], users: [user02@example.com], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WS-HR-007
      record: {kind: detection, detection_id: det-rmm-a007-1, name: RemoteAccess.ExampleRMM.Observed,
               category: RemoteAccessTool, verdict: CLEAN, severity: INFO, endpoint: WS-HR-007, status: active,
               process_name: ExampleRMM.exe,
               sha256: e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1,
               mitre_techniques: [T1219], first_seen: "2026-01-15T09:30:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WS-HR-007
      record: {kind: process_event, event_id: evt-rmm-a007-1, endpoint: WS-HR-007, timestamp: "2026-01-15T09:30:00Z",
               event_type: process_start, process_name: ExampleRMM.exe, pid: 7007, parent_process_name: services.exe,
               sha256: e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: WS-HR-007
      record: {kind: network_connection, endpoint: WS-HR-007, remote_ip: 10.20.0.15, remote_port: 5938, protocol: tcp,
               direction: inbound, process_name: ExampleRMM.exe,
               sha256: e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1,
               first_seen: "2026-01-15T09:31:00Z", last_seen: "2026-01-15T09:55:00Z", count: 6, action: allowed}
    - integration: secure_endpoint
      atomic: search_hash_enterprise
      subject: e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1
      record: {kind: hash_prevalence, sha256: e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1e8a1,
