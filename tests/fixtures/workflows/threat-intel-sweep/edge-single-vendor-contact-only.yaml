# threat-intel-sweep workflow scenario; fake lab data only.
schema: 1
name: edge-single-vendor-contact-only
workflow: threat-intel-sweep
description: 'Two feed indicators that only one vendor rates MALICIOUS (the domain) or every source rates SUSPICIOUS
  (the IP). TH-LT-1047 resolved the domain and connected to the IP. Nothing is blocked or contained on a single
  vendor''s word: both indicators are shown as considered with their hits, and nothing changes.'
tags: [edge_case, benign]
mode: both
suite:
  cisco_xdr: [intel]
  secure_endpoint: [endpoint]
  secure_email: [email]
  microsoft_cloud: [network]
  umbrella: [network]
  meraki: [network]
  entra: [identity]
  virustotal: [intel]
incident:
  incident_id: XDR-TIS-0012
  title: 'IOC sweep: high-confidence indicators from the threat intelligence feed'
  severity: HIGH
  workflow_id: threat-intel-sweep
  source: threat_intel
  observables:
  - {type: domain, value: cdn-mirror.test}
  - {type: ip, value: 198.51.100.90}
  trigger: {source: threat_intel, feed: partner-feed.example, feed_confidence: high}
environment:
  reputations:
  - type: domain
    value: cdn-mirror.test
    verdict: MALICIOUS
    risk_score: 80
    confidence: 70
    integrations: [cisco_xdr]
    summary: feed only
  - type: ip
    value: 198.51.100.90
    verdict: SUSPICIOUS
    risk_score: 55
    confidence: 60
    integrations: [cisco_xdr, umbrella]
    summary: scanning reports
  records:
  - integration: microsoft_cloud
    atomic: search_domain_enterprise
    subject: cdn-mirror.test
    record: {kind: dns_query, endpoint: TH-LT-1047, domain: cdn-mirror.test, query_type: A, count: 4, action: allowed,
      first_seen: '2026-01-15T08:00:00Z', last_seen: '2026-01-15T08:10:00Z'}
  - integration: microsoft_cloud
    atomic: search_ip_enterprise
    subject: 198.51.100.90
    record: {kind: network_connection, endpoint: TH-LT-1047, remote_ip: 198.51.100.90, remote_port: 443, protocol: tcp,
      direction: outbound, count: 4, action: allowed, first_seen: '2026-01-15T08:00:00Z', last_seen: '2026-01-15T08:10:00Z'}
  - integration: secure_endpoint
    atomic: investigate_endpoint
    subject: TH-LT-1047
    record:
      kind: endpoint
      hostname: TH-LT-1047
      connector_guid: 00000000-0000-4000-8000-000000001047
      os: Windows 11
      groups: [Workstations]
      users: [jsmith@example.com]
      isolation_capable: true
      isolation_state: not_isolated
analyst:
  decision: APPROVE_ALL
  approvers: [analyst]
expect:
  package: false
  considered: ['block_domain:cdn-mirror.test', 'block_ip:198.51.100.90']
  manual_steps: []
  handoffs: []
