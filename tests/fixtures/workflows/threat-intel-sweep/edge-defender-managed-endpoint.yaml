    - block_hash:7e3a91c57e3a91c57e3a91c57e3a91c57e3a91c57e3a91c57e3a91c57e3a91c5
    - isolate_endpoint:TH-LT-4402
  elevated: []
  unrouted: [quarantine_file:TH-LT-4402/7e3a91c57e3a91c57e3a91c57e3a91c57e3a91c57e3a91c57e3a91c57e3a91c5]
  considered: []
  manual_steps: []
  handoffs: ['malware:7e3a91c57e3a91c57e3a91c57e3a91c57e3a91c57e3a91c57e3a91c57e3a91c5']
  containment: PARTIALLY_CONTAINED
