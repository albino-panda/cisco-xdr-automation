# DNS tunneling scenario; fake lab data only.
schema: 1
name: legacy-03-protected-host
workflow: dns-tunneling
description: >-
  Migrated legacy 03. The same malicious parent domain is queried by a workstation and by the hypervisor
  management host HV-03 (critical asset class hypervisor). Both isolations are proposed; the
  hypervisor's needs ELEVATED approval with a warning, so the lead approves. KIOSK-07 reports that it
  cannot be isolated: no isolation is proposed and it is listed as considered (the legacy plan dropped
  it silently).
tags: [legacy, critical_asset, true_positive, approve_all]
legacy_source: workflows/dns-tunneling/scenarios/03-protected-host.yaml
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], splunk: [network], virustotal: [intel]}
