# DNS tunneling scenario; fake lab data only.
schema: 1
name: edge-approved-dns-tool
workflow: dns-tunneling
description: >-
  Approved DNS tool. The IT team's DNS diagnostics tool (allowlists.approved_dns_tools: Example DNS
  diagnostics) encodes long probe labels under its vendor domain dnstools.example.net, which Umbrella
  puts in the DNS Tunneling VPN category with high volume. One endpoint runs the listed build (approved
  hash), another a new build known only by the approved signer. In the same incident a real tunnel
  client queries q9-relay.test. The vendor domain is built and shown as excluded (never executed); the
  isolations and terminations that rest only on the approved tool are withheld and shown as considered;
  the real tunnel is contained.
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], splunk: [network], virustotal: [intel]}
incident:
