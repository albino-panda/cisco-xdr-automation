# DNS tunneling scenario; fake lab data only.
schema: 1
name: edge-defender-managed-endpoint
workflow: dns-tunneling
description: >-
  Behaviour profile on an endpoint managed by Defender for Endpoint only. node-sync.test is new: no
  source rates it and it is not in the DNS tunneling category, but the DNS activity shows all five
  tunnel indicators (volume, subdomain variation, labels up to 57 characters, random-looking labels and
  TXT answers). The behaviour profile confirms the tunnel; the isolation goes through the Defender
  builder and the termination through Defender, the block through Umbrella. Production parity: the
  terminate_process recommendation stays UNROUTED (no enabled adapter has a VERIFIED write for it; shown
  for manual handling, never executed).
tags: [edge_case, true_positive, approve_all]
mode: both
suite: {defender_endpoint: [endpoint, network], umbrella: [network], virustotal: [intel]}
incident:
  incident_id: XDR-DNS-0012
  title: DNS tunneling to node-sync.test from TH-LT-3300
  severity: HIGH
  workflow_id: dns-tunneling
  observables:
    - {type: domain, value: node-sync.test}
    - {type: hostname, value: TH-LT-3300}
  trigger: {source: defender_endpoint, mitre_techniques: [T1572]}
