# DNS tunneling scenario; fake lab data only.
schema: 1
name: benign-no-action
workflow: dns-tunneling
description: >-
  Benign: Umbrella reports a high query volume to cdn-assets.example with many subdomains, but the
  labels are short image-server names answered with A records, no source rates the domain and it is not
  in the DNS tunneling category. Two of the five tunnel indicators are not a tunnel: nothing is proposed
  and the domain is listed as considered.
tags: [benign]
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], splunk: [network], virustotal: [intel]}
incident:
  incident_id: XDR-DNS-0009
  title: High DNS query volume to cdn-assets.example
  severity: MEDIUM
  workflow_id: dns-tunneling
  observables:
    - {type: domain, value: cdn-assets.example}
    - {type: hostname, value: TH-LT-1047}
  trigger: {source: umbrella}
environment:
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: endpoint, hostname: TH-LT-1047, connector_guid: 00000000-0000-4000-8000-000000001047,
               os: Windows 11, groups: [Workstations], tags: [], users: [jsmith@example.com], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: process_event, event_id: evt-cdn-1047-1, endpoint: TH-LT-1047, timestamp: "2026-01-15T10:06:00Z",
               event_type: network, process_name: browser.exe, pid: 2210,
               domain: img01.cdn-assets.example, count: 5200}
    - integration: splunk
      atomic: search_domain_enterprise
      subject: cdn-assets.example
      record: {kind: dns_query, endpoint: TH-LT-1047, domain: cdn-assets.example, query_type: A, count: 5200,
               unique_subdomains: 640, max_label_length: 8, action: allowed,
               first_seen: "2026-01-15T10:06:00Z", last_seen: "2026-01-15T11:42:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: false
  actions: []
  unrouted: []
  below_threshold: []
  degraded_sources: []
  considered: [block_domain:cdn-assets.example]
  manual_steps: []
  handoffs: []
  notifications: [incident_note]
