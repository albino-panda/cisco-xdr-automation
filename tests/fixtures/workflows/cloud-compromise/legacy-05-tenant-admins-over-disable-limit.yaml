# cloud-compromise workflow scenario; fake lab data only.
# Migrated from the legacy spec scenario 05. Changes: typed records instead of legacy result items; the
# risky delegated consent of the incident context becomes an application record in the first admin's
# cloud activity (a manual consent revocation). Every account holds a privileged-account role, so
# PackageBuilder makes both its revocation and its disable ELEVATED (C3), and four users also exceed the
# blast-radius cap of 3 (C5): stricter than the legacy plan (which elevated only the disables), never
# weaker. The legacy escalation is the ELEVATED approval by the lead.
schema: 1
name: legacy-05-tenant-admins-over-disable-limit
workflow: cloud-compromise
description: >-
  Consent phishing hits the cloud admin team: four privileged accounts sign in successfully from the same
  malicious IP. Revocation and disable are proposed for all four, every account action needs ELEVATED
  approval (privileged accounts, and four users exceed the blast-radius cap) and a lead approves. The IP
  block is unaffected.
tags: [legacy, critical_asset, true_positive, approve_all]
legacy_source: workflows/cloud-compromise/scenarios/05-tenant-admins-over-disable-limit.yaml
mode: both
suite: {entra: [identity], microsoft_cloud: [identity], cisco_xdr: [intel], meraki: [network]}
incident:
  incident_id: INC-TEST-0305
  title: Risky OAuth consent and admin sign-ins from one unfamiliar IP
  severity: CRITICAL
  source: Cisco XDR
  workflow_id: cloud-compromise
  observables:
    - {type: ip, value: 198.51.100.120}
    - {type: user, value: cloud-admin-01@example.com}
    - {type: user, value: cloud-admin-02@example.com}
    - {type: user, value: cloud-admin-03@example.com}
    - {type: user, value: cloud-admin-04@example.com}
  users: [cloud-admin-01@example.com, cloud-admin-02@example.com, cloud-admin-03@example.com,
          cloud-admin-04@example.com]
  trigger: {source: cisco_xdr, mitre_techniques: [T1528], app_display_name: Document Viewer Plus (test),
            consent_type: delegated}
environment:
