# cloud-compromise workflow scenario; fake lab data only.
# Migrated from the legacy spec scenario 04. Changes: typed records instead of legacy result items; the
# legacy internal (non-documentation) address becomes the documentation address 198.51.100.8 (test-data rule). The service
# principal is an application record that Defender XDR rates suspicious (app-only sign-ins are not a
# typed record kind). Removing the secret and disabling the service principal are manual steps (no
# VERIFIED write), and the owner who added the secret is shown as considered, not disabled.
schema: 1
name: legacy-04-service-principal-secret-used-from-attacker-ip
workflow: cloud-compromise
description: >-
  Cloud-specific edge case. A client secret on a service principal is used for app-only token requests from
  a malicious IP; no human session is involved. The app owner had one failed sign-in from the same IP but no
  successful one, low risk and no detections, so the owner is neither revoked nor disabled even though the
  owner holds a privileged role. Only the IP is blocked. Revoking user sessions would not stop app-only
  tokens, so removing the secret and disabling the service principal are manual steps.
tags: [legacy, true_positive, approve_all]
legacy_source: workflows/cloud-compromise/scenarios/04-service-principal-secret-used-from-attacker-ip.yaml
mode: both
suite: {entra: [identity], microsoft_cloud: [identity], cisco_xdr: [intel], meraki: [network]}
incident:
  incident_id: INC-TEST-0304
  title: Service principal sign-in from unfamiliar IP after new client secret
  severity: HIGH
  source: Microsoft Entra service principal sign-in logs via Splunk
  workflow_id: cloud-compromise
  observables:
    - {type: user, value: app-owner-05@example.com}
    - {type: ip, value: 203.0.113.80}
    - {type: ip, value: 198.51.100.8}
  users: [app-owner-05@example.com]
  trigger: {source: splunk, mitre_techniques: [T1098.001], service_principal: reporting-connector-sp,
            sign_in_type: service_principal, credential_type: client_secret}
environment:
  reputations:
    - {type: ip, value: 203.0.113.80, verdict: MALICIOUS, risk_score: 90, confidence: 80,
       integrations: [cisco_xdr], summary: attacker infrastructure}
    - {type: ip, value: 198.51.100.8, verdict: CLEAN, risk_score: 0, confidence: 80,
       integrations: [cisco_xdr], summary: head office egress}
  records:
    - integration: entra
      atomic: investigate_user
      subject: app-owner-05@example.com
      record: {kind: user_profile, user: app-owner-05@example.com, department: IT, groups: [Application Owners],
               roles: [Application Administrator], account_enabled: true, risk_level: low, risk_state: none}
    - integration: entra
      atomic: investigate_authentication
      subject: app-owner-05@example.com
      record: {kind: sign_in, sign_in_id: si-legacy-0304-1, user: app-owner-05@example.com,
               timestamp: "2026-01-15T08:00:00Z", ip: 203.0.113.80, country: unfamiliar, app: Azure Portal,
               result: failure, failure_reason: invalid password, mfa_result: unknown, risk_level: medium}
    - integration: entra
      atomic: investigate_authentication
      subject: app-owner-05@example.com
      record: {kind: sign_in, sign_in_id: si-legacy-0304-2, user: app-owner-05@example.com,
               timestamp: "2026-01-15T09:00:00Z", ip: 198.51.100.8, country: GB,
               app: Microsoft Entra admin center, result: success, mfa_result: satisfied, risk_level: none}
    - integration: microsoft_cloud
      atomic: search_user_activity
      subject: app-owner-05@example.com
      record: {kind: cloud_app, app_id: 00000000-0000-4000-8000-0000000c0304, display_name: reporting-connector-sp,
               publisher_verified: false, permissions: [Files.Read.All], consent_type: unknown,
               created_at: "2025-04-01T09:00:00Z", credential_added_at: "2026-01-14T16:00:00Z",
               verdict: SUSPICIOUS}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions: [block_ip:203.0.113.80]
  elevated: []
  considered: [disable_user:app-owner-05@example.com]
  manual_steps:
    - remove-app-credentials:00000000-0000-4000-8000-0000000c0304
    - disable-service-principal:00000000-0000-4000-8000-0000000c0304
  handoffs: []
  containment: CONTAINED
  controls: 1
