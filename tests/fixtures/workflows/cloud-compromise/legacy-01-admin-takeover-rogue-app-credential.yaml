# cloud-compromise workflow scenario; fake lab data only.
# Migrated from the legacy spec scenario 01. Changes: typed records instead of legacy result items (the
# legacy incident context becomes an application record in each account's cloud activity: the client
# secret the administrator added and the consent the analyst granted); the attacker IP 203.0.113.45 lies in
# the lab production-server CIDR 203.0.113.0/26 of config/critical-assets.yaml and becomes 203.0.113.245.
# The administrator holds Application Administrator, a privileged-account role, so PackageBuilder makes its
# revocation and disable ELEVATED (C3: stricter than the legacy plan, never weaker) and a lead approves.
# Removing the secret and the consent are manual steps (no VERIFIED write), as in the legacy ticket.
schema: 1
name: legacy-01-admin-takeover-rogue-app-credential
workflow: cloud-compromise
description: >-
  An Application Administrator signs in from a malicious IP and a suspicious IP, then adds a client secret
  to an app registration; a second, non-privileged user granted consent to the same app and shows a
  new-device detection with medium risk. The package revokes both users, disables only the privileged
  admin, and blocks the malicious IP plus the suspicious IP the high-risk admin signed in from. The clean
  IP used by the second user is not blocked.
tags: [legacy, true_positive, approve_all]
legacy_source: workflows/cloud-compromise/scenarios/01-admin-takeover-rogue-app-credential.yaml
mode: both
suite: {entra: [identity], microsoft_cloud: [identity], cisco_xdr: [intel], meraki: [network]}
incident:
  incident_id: INC-TEST-0301
  title: New client secret on app registration after unfamiliar admin sign-in
  severity: HIGH
  source: Microsoft Entra ID Protection
  workflow_id: cloud-compromise
  observables:
    - {type: user, value: cloud-admin-07@example.com}
    - {type: user, value: sales-analyst-14@example.com}
    - {type: ip, value: 203.0.113.245}
    - {type: ip, value: 198.51.100.77}
    - {type: ip, value: 192.0.2.10}
  users: [cloud-admin-07@example.com, sales-analyst-14@example.com]
  trigger: {source: entra, mitre_techniques: [T1098.001], app_display_name: Reporting Connector (test),
            credential_type: client_secret}
environment:
  reputations:
    - {type: ip, value: 203.0.113.245, verdict: MALICIOUS, risk_score: 90, confidence: 80,
       integrations: [cisco_xdr], summary: attacker infrastructure}
    - {type: ip, value: 198.51.100.77, verdict: SUSPICIOUS, risk_score: 60, confidence: 60,
       integrations: [cisco_xdr], summary: anonymising VPN exit}
    - {type: ip, value: 192.0.2.10, verdict: CLEAN, risk_score: 0, confidence: 80,
       integrations: [cisco_xdr], summary: branch office egress}
  records:
    - integration: entra
      atomic: investigate_user
      subject: cloud-admin-07@example.com
      record: {kind: user_profile, user: cloud-admin-07@example.com, department: IT, groups: [Cloud Operations],
               roles: [Application Administrator], account_enabled: true, risk_level: high, risk_state: at_risk}
    - integration: entra
      atomic: investigate_authentication
      subject: cloud-admin-07@example.com
      record: {kind: sign_in, sign_in_id: si-legacy-0301-1, user: cloud-admin-07@example.com,
               timestamp: "2026-01-15T09:00:00Z", ip: 203.0.113.245, country: unfamiliar, app: Azure Portal,
               result: success, mfa_result: satisfied, risk_level: medium}
    - integration: entra
      atomic: investigate_authentication
      subject: cloud-admin-07@example.com
      record: {kind: sign_in, sign_in_id: si-legacy-0301-2, user: cloud-admin-07@example.com,
               timestamp: "2026-01-15T09:20:00Z", ip: 198.51.100.77, country: unfamiliar, app: Microsoft Graph,
               result: success, mfa_result: satisfied, risk_level: medium}
    - integration: entra
      atomic: investigate_authentication
      subject: cloud-admin-07@example.com
      record: {kind: anomaly, anomaly_id: rd-legacy-0301-1, anomaly_type: unfamiliar_location, severity: MEDIUM,
               user: cloud-admin-07@example.com, ip: 203.0.113.245, first_seen: "2026-01-15T09:00:00Z"}
    - integration: entra
      atomic: investigate_authentication
      subject: cloud-admin-07@example.com
      record: {kind: anomaly, anomaly_id: rd-legacy-0301-2, anomaly_type: impossible_travel, severity: MEDIUM,
               user: cloud-admin-07@example.com, ip: 198.51.100.77, first_seen: "2026-01-15T09:20:00Z"}
    - integration: entra
      atomic: search_user_activity
      subject: cloud-admin-07@example.com
      record: {kind: cloud_app, app_id: 00000000-0000-4000-8000-0000000c0301, display_name: Reporting Connector (test),
               publisher_verified: false, permissions: [Files.Read.All, Mail.Read], consent_type: unknown,
               created_at: "2025-05-01T09:00:00Z", credential_added_at: "2026-01-15T09:30:00Z"}
    - integration: entra
      atomic: investigate_user
      subject: sales-analyst-14@example.com
      record: {kind: user_profile, user: sales-analyst-14@example.com, department: Sales, groups: [Sales],
               roles: [], account_enabled: true, risk_level: medium, risk_state: at_risk}
    - integration: entra
      atomic: investigate_authentication
      subject: sales-analyst-14@example.com
      record: {kind: sign_in, sign_in_id: si-legacy-0301-3, user: sales-analyst-14@example.com,
               timestamp: "2026-01-15T10:00:00Z", ip: 192.0.2.10, country: GB, app: Office 365,
               result: success, mfa_result: satisfied, risk_level: low}
    - integration: entra
      atomic: investigate_authentication
      subject: sales-analyst-14@example.com
      record: {kind: anomaly, anomaly_id: rd-legacy-0301-3, anomaly_type: new_device, severity: MEDIUM,
               user: sales-analyst-14@example.com, ip: 192.0.2.10, first_seen: "2026-01-15T10:00:00Z"}
    - integration: entra
      atomic: search_user_activity
      subject: sales-analyst-14@example.com
      record: {kind: cloud_app, app_id: 00000000-0000-4000-8000-0000000c0301, display_name: Reporting Connector (test),
               publisher_verified: false, permissions: [Files.Read.All, Mail.Read], consent_type: user,
               consented_by: sales-analyst-14@example.com, created_at: "2026-01-15T10:05:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [lead]}
expect:
  actions:
    - revoke_sessions:cloud-admin-07@example.com
    - revoke_sessions:sales-analyst-14@example.com
    - disable_user:cloud-admin-07@example.com
    - block_ip:203.0.113.245
    - block_ip:198.51.100.77
  elevated:
    - revoke_sessions:cloud-admin-07@example.com
    - disable_user:cloud-admin-07@example.com
  warnings: [ELEVATED APPROVAL REQUIRED, Privileged account]
  considered: []
  manual_steps:
    - remove-app-credentials:00000000-0000-4000-8000-0000000c0301
    - revoke-oauth-consent:00000000-0000-4000-8000-0000000c0301
    - disable-service-principal:00000000-0000-4000-8000-0000000c0301
  handoffs: [account-takeover:cloud-admin-07@example.com, account-takeover:sales-analyst-14@example.com]
  containment: CONTAINED
  controls: 3
