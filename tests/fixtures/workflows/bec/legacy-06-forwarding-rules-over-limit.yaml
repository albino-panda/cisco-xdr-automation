# Migrated from the legacy bec spec; fake lab data only (example.com, *.example, documentation IPs).
# Changes from the legacy file: the legacy cap max_users_disabled: 1 became the runtime cap
# thresholds.blast_radius.max_users: 1 (C5: over the cap the actions stay proposed with ELEVATED
# approval). The runtime cap counts every user an action touches, revocations included, so it is
# stricter than the legacy cap: all four identity actions are ELEVATED (allowed, 14.9.1).
schema: 1
name: legacy-06-forwarding-rules-over-limit
workflow: bec
description: >-
  Tenant-wide BEC campaign. Two finance mailboxes signed in from an IP rated malicious and each
  gained an external forwarding rule (T1114.003), but neither sent fraud yet. Revocation and disable
  are proposed for both; with the user cap lowered to 1 every identity action needs ELEVATED approval
  and the package shows the blast-radius warning. Nothing is quarantined.
tags: [legacy, true_positive]
legacy_source: workflows/bec/scenarios/06-forwarding-rules-over-limit.yaml
mode: both
suite: {entra: [identity], secure_email: [email], secure_endpoint: [endpoint], umbrella: [network],
        cisco_xdr: [intel], virustotal: [intel]}
config:
  thresholds:
    blast_radius: {max_users: 1}
incident:
  incident_id: INC-TEST-BEC-0006
  title: External forwarding rules created on multiple finance mailboxes
  severity: HIGH
  workflow_id: bec
  source: splunk
  observables:
    - {type: email_address, value: ap-clerk-04@example.com}
    - {type: email_address, value: ap-clerk-05@example.com}
    - {type: ip, value: 203.0.113.60}
  users: [ap-clerk-04@example.com, ap-clerk-05@example.com]
  trigger: {source: splunk, mitre_techniques: [T1114.003]}
environment:
  reputations:
    - {type: ip, value: 203.0.113.60, verdict: MALICIOUS, risk_score: 85, confidence: 80,
       integrations: [cisco_xdr], summary: malicious sign-in source}
  records:
    - integration: entra
      atomic: investigate_user
      subject: ap-clerk-04@example.com
      record: {kind: user_profile, user: ap-clerk-04@example.com, department: Finance, groups: [Finance-AP],
               risk_level: medium, account_enabled: true}
    - integration: entra
      atomic: investigate_user
      subject: ap-clerk-04@example.com
      record: {kind: mailbox_rule, mailbox: ap-clerk-04@example.com, rule_id: rule-bec-l061, name: Archive,
               enabled: true, forward_to: [archive@remit-desk.example], created_at: "2026-01-15T09:10:00Z"}
    - integration: entra
      atomic: investigate_authentication
      subject: ap-clerk-04@example.com
      record: {kind: sign_in, sign_in_id: si-bec-l061, user: ap-clerk-04@example.com,
               timestamp: "2026-01-15T09:00:00Z", ip: 203.0.113.60, country: Unknown, app: Exchange Online,
               result: success}
    - integration: entra
      atomic: investigate_user
      subject: ap-clerk-05@example.com
      record: {kind: user_profile, user: ap-clerk-05@example.com, department: Finance, groups: [Finance-AP],
               risk_level: medium, account_enabled: true}
    - integration: entra
      atomic: investigate_user
      subject: ap-clerk-05@example.com
      record: {kind: mailbox_rule, mailbox: ap-clerk-05@example.com, rule_id: rule-bec-l062, name: Archive,
               enabled: true, forward_to: [archive@remit-desk.example], created_at: "2026-01-15T09:12:00Z"}
    - integration: entra
      atomic: investigate_authentication
      subject: ap-clerk-05@example.com
      record: {kind: sign_in, sign_in_id: si-bec-l062, user: ap-clerk-05@example.com,
               timestamp: "2026-01-15T09:02:00Z", ip: 203.0.113.60, country: Unknown, app: Exchange Online,
               result: success}
expect:
  manual_steps: ["mailbox rule rule-bec-l061 of ap-clerk-04@example.com", "mailbox rule rule-bec-l062 of ap-clerk-05@example.com"]
  handoffs: ["account-takeover:ap-clerk-04@example.com", "account-takeover:ap-clerk-05@example.com"]
  package: true
  actions:
    - revoke_sessions:ap-clerk-04@example.com
    - revoke_sessions:ap-clerk-05@example.com
    - disable_user:ap-clerk-04@example.com
    - disable_user:ap-clerk-05@example.com
  elevated:
    - revoke_sessions:ap-clerk-04@example.com
    - revoke_sessions:ap-clerk-05@example.com
    - disable_user:ap-clerk-04@example.com
    - disable_user:ap-clerk-05@example.com
  unrouted: []
