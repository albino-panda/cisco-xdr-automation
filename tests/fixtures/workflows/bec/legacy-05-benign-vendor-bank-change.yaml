# Migrated from the legacy bec spec; fake lab data only (example.com, *.example, documentation IPs).
# Changes from the legacy file: the reported message became a typed record the gateway rates clean;
# the office sign-in IP moved to a documentation range.
schema: 1
name: legacy-05-benign-vendor-bank-change
workflow: bec
description: >-
  Benign. A user reports a bank-detail change from a long-established vendor domain. The domain is
  clean and no look-alike, the reporting user has no risky sign-ins and no forwarding rules exist.
  Nothing is proposed; finance still verifies the change by phone.
tags: [legacy, benign]
legacy_source: workflows/bec/scenarios/05-benign-vendor-bank-change.yaml
mode: both
suite: {entra: [identity], secure_email: [email], secure_endpoint: [endpoint], umbrella: [network],
        cisco_xdr: [intel], virustotal: [intel]}
incident:
  incident_id: INC-TEST-BEC-0005
  title: User-reported payment change request from vendor
  severity: MEDIUM
  workflow_id: bec
  source: user_report
  observables:
    - {type: email_address, value: billing@vendor-supplies.example}
    - {type: domain, value: vendor-supplies.example}
    - {type: ip, value: 198.51.100.80}
    - {type: email_message_id, value: etd-msg-bec-l05}
  users: [ap-clerk-03@example.com]
  trigger: {source: user_report}
environment:
  reputations:
    - {type: domain, value: vendor-supplies.example, verdict: CLEAN, risk_score: 0, confidence: 80,
       integrations: [umbrella], summary: established business domain}
    - {type: ip, value: 198.51.100.80, verdict: CLEAN, risk_score: 0, confidence: 70,
       integrations: [cisco_xdr], summary: vendor mail server}
  records:
    - integration: secure_email
      atomic: investigate_email
      subject: etd-msg-bec-l05
      record: {kind: email_message, message_id: etd-msg-bec-l05, sender: billing@vendor-supplies.example,
               sender_domain: vendor-supplies.example, recipients: [ap-clerk-03@example.com], recipient_count: 1,
               subject_line: Updated remittance details, received_at: "2026-01-15T08:10:00Z", direction: inbound,
               verdict: CLEAN, spf: pass, dkim: pass, dmarc: pass, delivery_location: inbox}
    - integration: entra
      atomic: investigate_user
      subject: ap-clerk-03@example.com
      record: {kind: user_profile, user: ap-clerk-03@example.com, department: Finance, groups: [Finance-AP],
               risk_level: none, account_enabled: true}
    - integration: entra
      atomic: investigate_authentication
      subject: ap-clerk-03@example.com
      record: {kind: sign_in, sign_in_id: si-bec-l051, user: ap-clerk-03@example.com,
               timestamp: "2026-01-15T07:50:00Z", ip: 198.51.100.42, country: Office, app: Outlook, result: success}
expect:
  package: false
  actions: []
  below_threshold: []
  unrouted: []
