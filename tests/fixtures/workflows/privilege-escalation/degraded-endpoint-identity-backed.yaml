# privilege-escalation workflow scenario; fake lab data only.
schema: 1
name: degraded-endpoint-identity-backed
workflow: privilege-escalation
description: >-
  Owner rule (architecture 14.14): a failed source never blocks what other evidence backs. Secure
  Endpoint is unavailable, so the exploit detection on TH-LT-1047 and its payload rating are missing
  and the endpoint cannot be isolated. The Entra records still show jsmith (named by the incident)
  assigning User Administrator to svc-sync-temp, an account with no sign-in before the grant. The grant
  is treated as suspicious, not confirmed: the role removal, both revocations and the disable of the
  staged account are still proposed with the failed source in their rationale; the isolation rests on
  endpoint evidence only and is not invented. Secure Endpoint is listed as degraded.
tags: [degraded_source, true_positive, approve_all]
mode: both
