# privilege-escalation workflow scenario; fake lab data only.
schema: 1
name: legacy-05-mass-account-creation
workflow: privilege-escalation
legacy_source: workflows/privilege-escalation/scenarios/05-mass-account-creation.yaml
description: >-
  Migrated legacy scenario 05 (blast radius). A compromised identity administrator (Entra high risk,
  impossible travel) assigns the Application Administrator role to four accounts with no sign-in
  history (the legacy account_created entries have no VERIFIED source). As in the legacy plan the
  administrator and the four accounts are revoked and the four accounts disabled; more users than the
  blast-radius cap (max_users 3) are touched, so every account action is ELEVATED (C5), never dropped.
  The administrator's workstation holds a file rated malicious but its connector policy forbids
  isolation, so no isolation is proposed and the endpoint is shown as considered. Stricter than the
  legacy plan: the four role assignments are removed and the compromised administrator is disabled.
tags: [legacy, critical_asset, true_positive, approve_all]
mode: both
