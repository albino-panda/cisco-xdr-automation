# Password spray workflow scenario; fake lab data only.
schema: 1
name: tp-approve-all
workflow: password-spray
description: >-
  True positive. One external address sprays three accounts; one of them signs in successfully
  and a new device is registered right after. The workflow recommends blocking the source,
  revoking the sessions of the sprayed account and disabling it; the analyst approves everything
  and the actions execute and verify.
tags: [true_positive, approve_all]
mode: both
suite: {cisco_xdr: [intel, network], entra: [identity], meraki: [network]}
incident:
  incident_id: XDR-PS-0001
  title: Password spray against Microsoft 365 accounts
  severity: MEDIUM
  workflow_id: password-spray
  observables:
    - {type: ip, value: 198.51.100.77}
    - {type: user, value: jsmith@example.com}
    - {type: user, value: akim@example.com}
    - {type: user, value: rlopez@example.com}
  trigger: {source: cisco_xdr, mitre_techniques: [T1110.003]}
environment:
  reputations:
    - {type: ip, value: 198.51.100.77, verdict: SUSPICIOUS, risk_score: 70, confidence: 70,
       integrations: [cisco_xdr], summary: "anonymising proxy address"}
  records:
    - integration: entra
      atomic: investigate_user
      subject: jsmith@example.com
      record: {kind: user_profile, user: jsmith@example.com, department: Sales, groups: [Sales],
               account_enabled: true, risk_level: medium}
    - integration: entra
      atomic: investigate_user
      subject: jsmith@example.com
      record: {kind: anomaly, anomaly_id: anom-ps-0001-1, anomaly_type: new_device, severity: HIGH,
               user: jsmith@example.com, ip: 198.51.100.77, detail: Device registered right after the sign-in,
               first_seen: "2026-01-15T11:31:00Z"}
    - integration: entra
      atomic: investigate_user
      subject: akim@example.com
      record: {kind: user_profile, user: akim@example.com, department: Finance, groups: [Finance],
               account_enabled: true, risk_level: low}
    - integration: entra
      atomic: investigate_user
      subject: rlopez@example.com
      record: {kind: user_profile, user: rlopez@example.com, department: Engineering, groups: [Engineering],
               account_enabled: true, risk_level: none}
    - integration: entra
      atomic: investigate_authentication
      subject: jsmith@example.com
      record: {kind: sign_in, sign_in_id: si-ps-0001-1, user: jsmith@example.com, timestamp: "2026-01-15T11:20:00Z",
               ip: 198.51.100.77, country: NL, app: Office 365 Exchange Online, result: failure,
               failure_reason: Invalid username or password}
    - integration: entra
      atomic: investigate_authentication
      subject: jsmith@example.com
      record: {kind: sign_in, sign_in_id: si-ps-0001-2, user: jsmith@example.com, timestamp: "2026-01-15T11:29:00Z",
               ip: 198.51.100.77, country: NL, app: Office 365 Exchange Online, result: success,
               risk_level: medium}
    - integration: entra
      atomic: investigate_authentication
      subject: akim@example.com
      record: {kind: sign_in, sign_in_id: si-ps-0001-3, user: akim@example.com, timestamp: "2026-01-15T11:21:00Z",
               ip: 198.51.100.77, country: NL, app: Office 365 Exchange Online, result: failure,
               failure_reason: Invalid username or password}
    - integration: entra
      atomic: investigate_authentication
      subject: rlopez@example.com
      record: {kind: sign_in, sign_in_id: si-ps-0001-4, user: rlopez@example.com, timestamp: "2026-01-15T11:22:00Z",
               ip: 198.51.100.77, country: NL, app: Office 365 Exchange Online, result: failure,
               failure_reason: Invalid username or password}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  handoffs: ["account-takeover:jsmith@example.com"]
  package: true
  actions:
    - block_ip:198.51.100.77
    - revoke_sessions:jsmith@example.com
    - disable_user:jsmith@example.com
  elevated: []
  excluded: []
  unrouted: []
  below_threshold: []
  risk: {min: 60, max: 100}
  confidence: {min: 1, max: 100}
  degraded_sources: []
  evidence_min: 2
  containment: CONTAINED
  controls: 2
  notifications: [incident_note, soc_notification, analyst_summary]
