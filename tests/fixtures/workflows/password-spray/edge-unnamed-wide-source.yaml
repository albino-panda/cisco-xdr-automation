    atomic: investigate_user
    subject: wpark@example.com
    record:
      kind: user_profile
      user: wpark@example.com
      account_enabled: true
      groups: [Staff]
      risk_level: low
  - integration: entra
    atomic: investigate_authentication
    subject: tbrandt@example.com
    record: {kind: sign_in, sign_in_id: si-ps-0012-1, user: tbrandt@example.com, timestamp: '2026-01-15T07:11:00Z',
