# Password spray workflow scenario; fake lab data only.
schema: 1
name: edge-unnamed-wide-source
workflow: password-spray
description: >-
  The incident names one source address, but the sign-in logs show a second address failing against three of the
  targeted accounts. The workflow recognises it as a spray source from the records alone, enriches it and recommends
  blocking both.
tags: [edge_case, true_positive, approve_all]
mode: both
suite:
  cisco_xdr: [intel, network]
  entra: [identity]
  meraki: [network]
incident:
  incident_id: XDR-PS-0012
  title: Password spray against Microsoft 365 accounts
  severity: MEDIUM
  workflow_id: password-spray
  observables:
  - {type: ip, value: 198.51.100.95}
  - {type: user, value: tbrandt@example.com}
  - {type: user, value: ucole@example.com}
  - {type: user, value: vmeyer@example.com}
  - {type: user, value: wpark@example.com}
  trigger:
    source: cisco_xdr
    mitre_techniques: [T1110.003]
environment:
  reputations:
  - type: ip
    value: 198.51.100.95
    verdict: SUSPICIOUS
    risk_score: 70
    confidence: 70
    integrations: [cisco_xdr]
    summary: anonymising proxy address
  - type: ip
    value: 203.0.113.150
    verdict: SUSPICIOUS
    risk_score: 60
    confidence: 60
    integrations: [cisco_xdr]
    summary: hosting provider address
  records:
  - integration: entra
    atomic: investigate_user
    subject: tbrandt@example.com
    record:
      kind: user_profile
      user: tbrandt@example.com
      account_enabled: true
      groups: [Staff]
      risk_level: low
