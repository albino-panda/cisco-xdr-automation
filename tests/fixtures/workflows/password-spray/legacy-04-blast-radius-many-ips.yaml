# Password spray workflow scenario; fake lab data only.
schema: 1
name: legacy-04-blast-radius-many-ips
workflow: password-spray
description: >-
  Migrated from the legacy spec. A distributed spray from twelve residential proxy addresses. Eight carry a reputation
  verdict and are recommended for a block; three have neither a verdict nor a sign-in record and are reported as
  not proposed (no evidence), and one has a single failed sign-in only, so it is listed below threshold. The legacy
  file capped indicators at 10 for twelve planned blocks; with eight evidence-backed blocks the lab cap is 6, so
  every IP block stays proposed with ELEVATED approval (blast radius) and a lead approves. Session revocation for
  the account that signed in from a spray source is a standard approval.
tags: [legacy, true_positive, approve_all]
