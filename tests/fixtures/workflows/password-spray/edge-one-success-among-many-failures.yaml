# Password spray workflow scenario; fake lab data only.
schema: 1
name: edge-one-success-among-many-failures
workflow: password-spray
description: >-
  One address sprays six accounts and one attempt succeeds. Only that account's sessions are revoked; an unfamiliar
  location alone is not suspicious follow-on activity, so it is not disabled. The wide pattern (six accounts) backs
  the block even without a reputation verdict.
tags: [edge_case, true_positive, approve_all]
mode: both
suite:
  cisco_xdr: [intel, network]
  entra: [identity]
  meraki: [network]
incident:
  incident_id: XDR-PS-0010
  title: Password spray against Microsoft 365 accounts
  severity: MEDIUM
  workflow_id: password-spray
  observables:
  - {type: ip, value: 203.0.113.140}
  - {type: user, value: mfranco@example.com}
  - {type: user, value: oadeyemi@example.com}
  - {type: user, value: pchen@example.com}
  - {type: user, value: qhall@example.com}
  - {type: user, value: rdiaz@example.com}
  - {type: user, value: sward@example.com}
  trigger:
    source: cisco_xdr
    mitre_techniques: [T1110.003]
environment:
