# Phishing workflow scenario; fake lab data only (example.com, *.example, documentation IPs, fake hashes).
# Migrated from the legacy spec scenario; expectations aligned with C1-C5 (every action needs human approval).
schema: 1
name: legacy-01-credential-link-and-attachment
workflow: phishing
description: >-
  Legacy 01. Secure Email flags a delivered message as malicious after delivery; the link points to
  a malicious look-alike domain and the attachment is malicious. Every delivered copy (two in this
  lab, fourteen in the legacy narrative) is quarantined, the domain and the attachment hash are
  blocked; the URL is not blocked separately because the domain block covers it. The recipient's
  identity risk is low and nobody clicked, so no account action is proposed.
tags: [legacy, true_positive]
legacy_source: workflows/phishing/scenarios/01-credential-link-and-attachment.yaml
mode: both
suite: {secure_email: [email], entra: [identity], umbrella: [network], virustotal: [intel], secure_endpoint: [endpoint],
        microsoft_cloud: [network]}
incident:
  incident_id: INC-TEST-PH-0001
  title: Credential phishing link and attachment delivered to finance
  severity: MEDIUM
  source: Secure Email Threat Defense
  workflow_id: phishing
  observables:
    - {type: email_message_id, value: "<20260115.0800.4471@invoice-portal.example>"}
    - {type: email_address, value: billing@invoice-portal.example}
    - {type: url, value: "https://invoice-portal.example/login/verify"}
    - {type: domain, value: invoice-portal.example}
    - {type: ip, value: 203.0.113.25}
    - {type: sha256, value: 1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b}
    - {type: user, value: ap-clerk-01@example.com}
  users: [ap-clerk-01@example.com]
  trigger: {source: Secure Email Threat Defense, mitre_techniques: [T1566.001, T1566.002]}
environment:
  reputations:
    - {type: domain, value: invoice-portal.example, verdict: MALICIOUS, risk_score: 90, confidence: 85,
       integrations: [umbrella, virustotal], summary: "Phishing (legacy enrich-domain)"}
    - {type: sha256, value: 1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b, verdict: MALICIOUS,
       risk_score: 90, confidence: 85, integrations: [secure_endpoint, virustotal], summary: "malicious attachment"}
    - {type: ip, value: 203.0.113.25, verdict: SUSPICIOUS, risk_score: 55, confidence: 60, integrations: [umbrella],
       summary: "sending infrastructure (legacy enrich-ip suspicious)"}
  records:
    - integration: secure_email
      atomic: investigate_email
      subject: "<20260115.0800.4471@invoice-portal.example>"
      record: {kind: email_message, message_id: "<20260115.0800.4471@invoice-portal.example>",
               sender: billing@invoice-portal.example, sender_domain: invoice-portal.example,
               recipients: [ap-clerk-01@example.com], recipient_count: 1,
               subject_line: "Overdue invoice 4471 - action required", received_at: "2026-01-15T08:00:00Z",
               direction: inbound, verdict: MALICIOUS, threat_types: [phish],
               urls: ["https://invoice-portal.example/login/verify"], domains: [invoice-portal.example],
               attachment_hashes: [1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b],
               delivery_location: inbox, campaign_id: CMP-LEGACY-01}
    - integration: secure_email
      atomic: search_email_campaign
      subject: "<20260115.0800.4471@invoice-portal.example>"
      record: {kind: email_message, message_id: "<20260115.0801.4472@invoice-portal.example>",
               sender: billing@invoice-portal.example, sender_domain: invoice-portal.example,
               recipients: [ap-clerk-03@example.com], recipient_count: 1,
               subject_line: "Overdue invoice 4471 - action required", received_at: "2026-01-15T08:01:00Z",
               direction: inbound, verdict: MALICIOUS, urls: ["https://invoice-portal.example/login/verify"],
               domains: [invoice-portal.example],
               attachment_hashes: [1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b],
               delivery_location: inbox, campaign_id: CMP-LEGACY-01}
    - integration: entra
      atomic: investigate_user
      subject: ap-clerk-01@example.com
      record: {kind: user_profile, user: ap-clerk-01@example.com, department: Finance, groups: [Finance],
               account_enabled: true, risk_level: low, risk_state: none}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: true
  actions:
    - "quarantine_email:<20260115.0800.4471@invoice-portal.example>"
    - "quarantine_email:<20260115.0801.4472@invoice-portal.example>"
    - block_domain:invoice-portal.example
    - block_hash:1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b
  elevated: []
  excluded: []
  unrouted: []
  containment: CONTAINED
  controls: 4
