# account-takeover workflow scenario; fake lab data only.
schema: 1
name: release-restoration
workflow: account-takeover
description: >-
  A privileged-free account that the attacker used again after an earlier revocation: the analyst
  approves revoke, disable and block; all execute and verify. After the help desk reset the password
  and re-registered MFA, a separate human release decision re-enables the account and removes the IP
  block. Session revocation is not reversible and has no control to release.
tags: [release, true_positive, approve_all]
mode: live
suite: {entra: [identity], cisco_xdr: [intel], microsoft_cloud: [network], secure_endpoint: [endpoint],
        meraki: [network]}
incident:
  incident_id: XDR-ATO-0009
  title: Repeat risky sign-in for bdiaz@example.com after session revocation
  severity: HIGH
  workflow_id: account-takeover
  observables:
    - {type: user, value: bdiaz@example.com}
  users: [bdiaz@example.com]
  trigger: {source: entra, mitre_techniques: [T1078.004]}
environment:
  reputations:
    - {type: ip, value: 198.51.100.199, verdict: MALICIOUS, risk_score: 90, confidence: 80,
       integrations: [cisco_xdr], summary: credential-abuse infrastructure}
  records:
    - integration: entra
      atomic: investigate_user
      subject: bdiaz@example.com
      record: {kind: user_profile, user: bdiaz@example.com, display_name: B Diaz, department: Procurement,
               groups: [Procurement], account_enabled: true, risk_level: medium, risk_state: at_risk,
               sessions_valid_from: "2026-01-15T08:00:00Z"}
    - integration: entra
      atomic: investigate_authentication
      subject: bdiaz@example.com
      record: {kind: sign_in, sign_in_id: si-ato-0009-1, user: bdiaz@example.com,
               timestamp: "2026-01-15T10:15:00Z", ip: 198.51.100.199, country: NG, app: Office 365 Exchange Online,
               result: success, mfa_result: satisfied, risk_level: medium}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
release: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  actions:
    - revoke_sessions:bdiaz@example.com
    - disable_user:bdiaz@example.com
    - block_ip:198.51.100.199
  containment: CONTAINED
  controls: 2
  restoration: RESTORED
  final_state: RESTORED
