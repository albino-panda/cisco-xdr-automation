# account-takeover workflow scenario; fake lab data only.
# Migrated from the legacy spec scenario 03. Changes: typed records instead of legacy result items; the
# legacy is_protected flag becomes the critical-asset policy (privileged_account: user pattern
# breakglass* and the Global Administrator role), so PackageBuilder decides ELEVATED (C3).
schema: 1
name: legacy-03-breakglass-protected
workflow: account-takeover
description: >-
  A break-glass account with the Global Administrator role signs in from a malicious IP. The account
  meets the revoke and privileged-disable conditions and is a privileged account, so both actions stay
  in the package with ELEVATED approval and a warning. A lead approves after weighing the loss of the
  emergency access path against the attacker sign-in; an analyst alone is refused. The attacker IP
  block is a standard action.
tags: [legacy, critical_asset, true_positive, approve_all]
legacy_source: workflows/account-takeover/scenarios/03-breakglass-protected.yaml
mode: both
suite: {entra: [identity], cisco_xdr: [intel], microsoft_cloud: [network], secure_endpoint: [endpoint],
        meraki: [network]}
incident:
  incident_id: INC-TEST-ATO-0003
  title: High-risk sign-in to emergency access account
  severity: CRITICAL
  source: Microsoft Entra ID Protection
  workflow_id: account-takeover
  observables:
    - {type: user, value: breakglass-01@example.com}
    - {type: ip, value: 203.0.113.99}
  users: [breakglass-01@example.com]
  trigger: {source: entra, mitre_techniques: [T1078.004], detection: riskySignIn}
environment:
  reputations:
    - {type: ip, value: 203.0.113.99, verdict: MALICIOUS, risk_score: 90, confidence: 80,
       integrations: [cisco_xdr], summary: attacker infrastructure}
  records:
    - integration: entra
      atomic: investigate_user
      subject: breakglass-01@example.com
      record: {kind: user_profile, user: breakglass-01@example.com, department: IT, manager: it-lead@example.com,
               groups: [Emergency Access], roles: [Global Administrator], privileged: true,
               account_enabled: true, risk_level: high, risk_state: at_risk}
    - integration: entra
      atomic: investigate_authentication
      subject: breakglass-01@example.com
      record: {kind: sign_in, sign_in_id: si-legacy-03-1, user: breakglass-01@example.com,
               timestamp: "2026-01-15T04:20:00Z", ip: 203.0.113.99, country: unfamiliar, app: Azure Portal,
               result: success, mfa_result: satisfied, risk_level: high}
    - integration: entra
      atomic: investigate_authentication
      subject: breakglass-01@example.com
      record: {kind: anomaly, anomaly_id: rd-legacy-03-1, anomaly_type: unfamiliar_location, severity: MEDIUM,
               user: breakglass-01@example.com, ip: 203.0.113.99, first_seen: "2026-01-15T04:20:00Z"}
    - integration: entra
      atomic: investigate_authentication
      subject: breakglass-01@example.com
      record: {kind: anomaly, anomaly_id: rd-legacy-03-2, anomaly_type: new_device, severity: MEDIUM,
               user: breakglass-01@example.com, ip: 203.0.113.99, first_seen: "2026-01-15T04:20:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [lead]}
expect:
  actions:
    - revoke_sessions:breakglass-01@example.com
    - disable_user:breakglass-01@example.com
    - block_ip:203.0.113.99
  elevated:
    - revoke_sessions:breakglass-01@example.com
    - disable_user:breakglass-01@example.com
  warnings: [ELEVATED APPROVAL REQUIRED, Privileged account]
  containment: CONTAINED
  controls: 2
