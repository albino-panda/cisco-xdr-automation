# account-takeover workflow scenario; fake lab data only.
schema: 1
name: benign-no-action
workflow: account-takeover
description: >-
  An unfamiliar-sign-in alert for tnguyen: two failed password attempts from an IP that Cisco XDR only
  rates suspicious, no successful sign-in from it, Entra rates the user low risk and the only success
  is from the clean office egress. No account shows a compromise indicator and no source rates the IP
  malicious, so nothing is proposed and the incident stays NOT_STARTED for the analyst to close.
tags: [benign]
mode: both
suite: {entra: [identity], cisco_xdr: [intel], microsoft_cloud: [network], secure_endpoint: [endpoint],
        meraki: [network]}
incident:
  incident_id: XDR-ATO-0004
  title: Unfamiliar sign-in properties for tnguyen@example.com
  severity: MEDIUM
  workflow_id: account-takeover
  observables:
    - {type: user, value: tnguyen@example.com}
    - {type: ip, value: 192.0.2.200}
  users: [tnguyen@example.com]
  trigger: {source: entra, mitre_techniques: [T1078.004]}
environment:
  reputations:
    - {type: ip, value: 192.0.2.200, verdict: SUSPICIOUS, risk_score: 45, confidence: 50,
       integrations: [cisco_xdr], summary: residential proxy range}
    - {type: ip, value: 198.51.100.10, verdict: CLEAN, risk_score: 0, confidence: 80,
       integrations: [cisco_xdr], summary: corporate office egress}
  records:
    - integration: entra
      atomic: investigate_user
      subject: tnguyen@example.com
      record: {kind: user_profile, user: tnguyen@example.com, display_name: T Nguyen, department: Finance,
               groups: [Finance Users], account_enabled: true, risk_level: low, risk_state: none}
    - integration: entra
      atomic: investigate_authentication
      subject: tnguyen@example.com
      record: {kind: sign_in, sign_in_id: si-ato-0004-1, user: tnguyen@example.com,
               timestamp: "2026-01-15T07:58:00Z", ip: 192.0.2.200, country: FR, app: Office 365 Exchange Online,
               result: failure, failure_reason: invalid username or password, mfa_result: unknown, risk_level: low}
    - integration: entra
      atomic: investigate_authentication
      subject: tnguyen@example.com
      record: {kind: sign_in, sign_in_id: si-ato-0004-2, user: tnguyen@example.com,
               timestamp: "2026-01-15T08:01:00Z", ip: 192.0.2.200, country: FR, app: Office 365 Exchange Online,
               result: failure, failure_reason: invalid username or password, mfa_result: unknown, risk_level: low}
    - integration: entra
      atomic: investigate_authentication
      subject: tnguyen@example.com
      record: {kind: sign_in, sign_in_id: si-ato-0004-3, user: tnguyen@example.com,
               timestamp: "2026-01-15T08:45:00Z", ip: 198.51.100.10, country: GB, app: Microsoft Teams,
               result: success, mfa_result: satisfied, risk_level: none}
    - integration: entra
      atomic: investigate_authentication
      subject: tnguyen@example.com
      record: {kind: anomaly, anomaly_id: rd-ato-0004-1, anomaly_type: unfamiliar_location, severity: LOW,
               user: tnguyen@example.com, ip: 192.0.2.200, first_seen: "2026-01-15T07:58:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: false
  actions: []
  below_threshold: []
  unrouted: []
  degraded_sources: []
