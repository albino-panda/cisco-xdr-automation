# Data exfiltration scenario; fake lab data only.
schema: 1
name: tp-approve-all
workflow: exfiltration
description: >-
  True positive on one finance laptop. An archive of invoices is written and then uploaded, still
  running, to a file drop that no reputation source knows yet (4.5 GiB over two hours). The account
  signed in has identity risk high with an unfamiliar-location anomaly. The package blocks the drop
  domain and its IP, isolates the laptop while the upload runs, and revokes the sessions of and disables
  the compromised account. The analyst approves everything; every routed action executes, and the
  reversible ones are registered as controls. The data impact assessment stays a manual step and the
  account is handed off to account-takeover. Production parity: isolate_endpoint through secure_endpoint
  cannot be read back by the real adapter and ends UNABLE_TO_VERIFY, so containment is
  PARTIALLY_CONTAINED.
tags: [true_positive, approve_all]
mode: both
suite: {secure_endpoint: [endpoint], umbrella: [network], meraki: [network], virustotal: [intel], entra: [identity],
        microsoft_cloud: [network]}
incident:
  incident_id: XDR-EXF-0001
  title: Large outbound transfer to an unknown file drop from TH-LT-1047
  severity: CRITICAL
  workflow_id: exfiltration
  observables:
    - {type: hostname, value: TH-LT-1047}
    - {type: domain, value: files-drop.test}
    - {type: ip, value: 203.0.113.145}
  users: [jsmith@example.com]
  trigger: {source: secure_endpoint, mitre_techniques: [T1567.002]}
environment:
  records:
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: endpoint, hostname: TH-LT-1047, connector_guid: 00000000-0000-4000-8000-000000001047,
               os: Windows 11, groups: [Finance Workstations], users: [jsmith@example.com], isolation_capable: true,
               isolation_state: not_isolated}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: process_event, event_id: evt-exf-1047-1, endpoint: TH-LT-1047, timestamp: "2026-01-15T09:58:00Z",
               event_type: file_create, process_name: archiver.exe, pid: 4410,
               file_path: "C:\\Users\\jsmith\\AppData\\Local\\Temp\\q4-invoices.zip", user: jsmith@example.com}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: network_connection, endpoint: TH-LT-1047, user: jsmith@example.com, domain: files-drop.test,
               remote_ip: 203.0.113.145, remote_port: 443, protocol: tcp, direction: outbound, process_name: browser.exe,
               bytes_out: 4831838208, count: 1260, action: allowed, first_seen: "2026-01-15T10:02:00Z",
               last_seen: "2026-01-15T11:52:00Z"}
    - integration: secure_endpoint
      atomic: investigate_endpoint
      subject: TH-LT-1047
      record: {kind: dns_query, endpoint: TH-LT-1047, domain: files-drop.test, query_type: A, count: 4,
               categories: [Newly Seen Domains], action: allowed, first_seen: "2026-01-15T10:01:00Z"}
    - integration: entra
      atomic: investigate_user
      subject: jsmith@example.com
      record: {kind: user_profile, user: jsmith@example.com, department: Finance, groups: [Finance],
               risk_level: high, risk_state: at_risk, account_enabled: true}
    - integration: entra
      atomic: investigate_user
      subject: jsmith@example.com
      record: {kind: sign_in, sign_in_id: si-exf-0001, user: jsmith@example.com, timestamp: "2026-01-15T09:40:00Z",
               ip: 198.51.100.77, country: BR, app: Office 365, result: success, risk_level: high}
    - integration: entra
      atomic: investigate_user
      subject: jsmith@example.com
      record: {kind: anomaly, anomaly_id: an-exf-0001, anomaly_type: unfamiliar_location, severity: MEDIUM,
               user: jsmith@example.com, ip: 198.51.100.77, first_seen: "2026-01-15T09:40:00Z"}
analyst: {decision: APPROVE_ALL, approvers: [analyst]}
expect:
  package: true
  actions:
    - block_domain:files-drop.test
    - block_ip:203.0.113.145
    - isolate_endpoint:TH-LT-1047
    - revoke_sessions:jsmith@example.com
    - disable_user:jsmith@example.com
  elevated: []
  excluded: []
  unrouted: []
  below_threshold: []
  degraded_sources: []
  considered: []
  manual_steps: [assess data exposure from TH-LT-1047]
  handoffs: ["account-takeover:jsmith@example.com"]
  risk: {min: 60, max: 100}
  confidence: {min: 50, max: 100}
  evidence_min: 1
  containment: PARTIALLY_CONTAINED
  controls: 4
  notifications: [incident_note, soc_notification, analyst_summary]
