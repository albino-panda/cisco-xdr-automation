# Data exfiltration scenario; fake lab data only. Migrated from the legacy plan-rule spec.
schema: 1
name: legacy-06-spread-destinations-over-limit
workflow: exfiltration
description: >-
  Legacy 06, blast radius and shared infrastructure. A running transfer is split across three unrated
  external IPs and one shared CDN address that five endpoints of the estate reach. The CDN address is
  not blocked (more than three endpoints: listed as considered). The three IP blocks exceed the lab's
  indicator cap (2 in this override), so they stay proposed and need ELEVATED approval with a
  blast-radius warning (C5). The isolation and the compromised account (identity risk medium with two
  anomalies) stay proposed. The SOC lead approves. The destination IPs moved from 203.0.113.10-12 to
  203.0.113.70-72, outside the lab's production_server range, so only the cap elevates them.
tags: [legacy, true_positive, approve_all]
legacy_source: workflows/exfiltration/scenarios/06-spread-destinations-over-limit.yaml
mode: both
