schema_version: 1
id: notify-soc
name: Notify SOC
category: notification
description: Send a concise alert to the SOC channel through an XDR Automation target.
side_effects: true
requires_approval: false
reversible: false
rollback: Not applicable.
idempotent: true
supports_dry_run: false
integrations:
- cisco-xdr
inputs:
- name: message
  type: string
  required: true
  description: Short summary with incident and ticket links.
- name: severity
  type: string
  required: true
  description: Controls channel and mention policy.
- name: channel
  type: string
  required: false
  description: Override the default target.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: delivered
  type: boolean
  description: Whether the target accepted the message.
- name: error
  type: string
  description: Empty on success.
used_by:
- ransomware
- phishing
- mail-bombing
- bec
- account-takeover
- malware
- powershell
- lateral-movement
- c2
- dns-tunneling
- password-spray
- credential-dumping
- privilege-escalation
- persistence
- rmm
- exfiltration
- vulnerability-exploitation
- cloud-compromise
- web-attacks
