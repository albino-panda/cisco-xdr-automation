schema_version: 1
id: block-url
name: Block URL
category: containment
description: Block a specific URL in Umbrella and/or Cloudflare without blocking the whole domain.
side_effects: true
requires_approval: true
reversible: true
rollback: Remove the URL from the list.
idempotent: true
supports_dry_run: true
integrations:
- umbrella
- cloudflare
inputs:
- name: url
  type: string
  required: true
  description: Full URL.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: status
  type: string
  description: blocked | already_blocked | skipped_allowlisted | planned
- name: error
  type: string
  description: Empty on success.
used_by:
- vulnerability-exploitation
- web-attacks
