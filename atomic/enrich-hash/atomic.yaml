schema_version: 1
id: enrich-hash
name: Enrich file hash
category: enrichment
description: Disposition and prevalence of a SHA-256 across threat intel and the endpoint fleet.
side_effects: false
requires_approval: false
reversible: true
rollback: Not applicable (read-only).
idempotent: true
supports_dry_run: false
integrations:
- cisco-xdr
- secure-endpoint
inputs:
- name: sha256
  type: string
  required: true
  description: SHA-256 of the file.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: disposition
  type: string
  description: malicious | clean | unknown
- name: prevalence
  type: integer
  description: Number of endpoints that have seen the file.
- name: hosts
  type: list
  description: Up to 50 endpoint GUIDs and hostnames.
- name: error
  type: string
  description: Empty on success.
used_by:
- privilege-escalation
