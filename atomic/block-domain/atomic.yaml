schema_version: 1
id: block-domain
name: Block domain
category: containment
description: Add a domain to the automation block list in Umbrella and, optionally, Cloudflare Gateway.
side_effects: true
requires_approval: true
reversible: true
rollback: Remove the destination from the list.
idempotent: true
supports_dry_run: true
integrations:
- umbrella
- cloudflare
inputs:
- name: domain
  type: string
  required: true
  description: Domain to block.
- name: expires_hours
  type: integer
  required: false
  description: Release-review reminder in hours (never an automatic release; removal needs a separate human release approval); default 720 (30 days).
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: status
  type: string
  description: blocked | already_blocked | skipped_allowlisted | planned
- name: error
  type: string
  description: Empty on success.
used_by:
- c2
- dns-tunneling
- exfiltration
