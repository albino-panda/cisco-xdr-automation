schema_version: 1
id: block-ip
name: Block IP
category: containment
description: Block an external IP at the perimeter (Meraki MX) and/or edge (Cloudflare IP list).
side_effects: true
requires_approval: true
reversible: true
rollback: Remove the rule or list item; Meraki restores from the saved rule set.
idempotent: true
supports_dry_run: true
integrations:
- meraki
- cloudflare
inputs:
- name: ip
  type: string
  required: true
  description: External IP address.
- name: expires_hours
  type: integer
  required: false
  description: Release-review reminder in hours (never an automatic release; removal needs a separate human release approval); default 168 (7 days).
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: status
  type: string
  description: blocked | already_blocked | skipped_internal | planned
- name: error
  type: string
  description: Empty on success.
used_by:
- account-takeover
- c2
- password-spray
- exfiltration
- vulnerability-exploitation
- cloud-compromise
- web-attacks
