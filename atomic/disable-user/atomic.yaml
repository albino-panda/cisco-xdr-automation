schema_version: 1
id: disable-user
name: Disable user
category: containment
description: Disable an Entra ID account so no new sign-ins succeed.
side_effects: true
requires_approval: true
reversible: true
rollback: Set accountEnabled back to true.
idempotent: true
supports_dry_run: true
integrations:
- microsoft-entra
inputs:
- name: user
  type: string
  required: true
  description: UPN or object ID.
- name: reason
  type: string
  required: true
  description: Recorded in the incident note.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: status
  type: string
  description: disabled | already_disabled | planned
- name: error
  type: string
  description: Empty on success.
used_by:
- ransomware
- bec
- account-takeover
- lateral-movement
- password-spray
- credential-dumping
- privilege-escalation
- exfiltration
- cloud-compromise
