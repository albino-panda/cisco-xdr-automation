schema_version: 1
id: quarantine-email
name: Quarantine email
category: containment
description: Find delivered messages matching sender, subject or URL and move them to quarantine.
side_effects: true
requires_approval: true
reversible: true
rollback: Move messages back to the inbox.
idempotent: true
supports_dry_run: true
integrations:
- secure-email
inputs:
- name: search
  type: object
  required: true
  description: Sender, recipient, subject, URL or time-window filters.
- name: max_messages
  type: integer
  required: false
  description: Safety cap; default 500.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: matched
  type: integer
  description: Messages found.
- name: moved
  type: integer
  description: Messages moved.
- name: status
  type: string
  description: quarantined | partial | planned
- name: error
  type: string
  description: Empty on success.
used_by:
- phishing
- mail-bombing
- bec
