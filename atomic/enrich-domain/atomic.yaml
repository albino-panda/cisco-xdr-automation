schema_version: 1
id: enrich-domain
name: Enrich domain
category: enrichment
description: Reputation, categorisation, age and internal DNS activity for a domain.
side_effects: false
requires_approval: false
reversible: true
rollback: Not applicable (read-only).
idempotent: true
supports_dry_run: false
integrations:
- cisco-xdr
- umbrella
inputs:
- name: domain
  type: string
  required: true
  description: Fully qualified domain name.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: verdict
  type: string
  description: malicious | suspicious | clean | unknown
- name: categories
  type: list
  description: Security and content categories.
- name: first_seen
  type: string
  description: First-seen date when available.
- name: internal_queries
  type: integer
  description: Internal DNS queries in the lookback window.
- name: error
  type: string
  description: Empty on success.
used_by:
- ransomware
- phishing
- mail-bombing
- bec
- malware
- malicious-powershell
- c2
- dns-tunneling
- persistence
- unauthorized-rmm
- exfiltration
- web-attacks
