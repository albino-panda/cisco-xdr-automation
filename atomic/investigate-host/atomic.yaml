schema_version: 1
id: investigate-host
name: Investigate host
category: investigation
description: 'Endpoint context: owner, OS, recent detections, process and network trajectory, network
  location.'
side_effects: false
requires_approval: false
reversible: true
rollback: Not applicable (read-only).
idempotent: true
supports_dry_run: false
integrations:
- secure-endpoint
- cisco-xdr
- meraki
- splunk
inputs:
- name: host
  type: string
  required: true
  description: Hostname, connector GUID or IP.
- name: lookback_hours
  type: integer
  required: false
  description: Default 24.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: connector_guid
  type: string
  description: Secure Endpoint connector GUID.
- name: detections
  type: list
  description: Recent detections and their dispositions.
- name: trajectory
  type: list
  description: Summarised process and network events.
- name: isolation_capable
  type: boolean
  description: Whether the connector policy allows isolation.
- name: is_protected
  type: boolean
  description: True when the host is in the guardrails protected list.
- name: error
  type: string
  description: Empty on success.
used_by:
- privilege-escalation
- vulnerability-exploitation
- web-attacks
