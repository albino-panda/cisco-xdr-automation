schema_version: 1
id: revoke-session
name: Revoke sessions
category: containment
description: Invalidate refresh tokens and browser sessions for a user.
side_effects: true
requires_approval: true
reversible: false
rollback: Not reversible; the user signs in again.
idempotent: true
supports_dry_run: true
integrations:
- microsoft-entra
inputs:
- name: user
  type: string
  required: true
  description: UPN or object ID.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: status
  type: string
  description: revoked | planned
- name: error
  type: string
  description: Empty on success.
used_by:
- ransomware
- mail-bombing
- bec
- account-takeover
- lateral-movement
- password-spray
- credential-dumping
- privilege-escalation
- cloud-compromise
