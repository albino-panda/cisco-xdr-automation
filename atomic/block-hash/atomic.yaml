schema_version: 1
id: block-hash
name: Block file hash
category: containment
description: Add a SHA-256 to the Secure Endpoint simple custom detection list.
side_effects: true
requires_approval: true
reversible: true
rollback: Delete the hash from the file list.
idempotent: true
supports_dry_run: true
integrations:
- secure-endpoint
inputs:
- name: sha256
  type: string
  required: true
  description: SHA-256 to block.
- name: description
  type: string
  required: false
  description: Shown in the Secure Endpoint console.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: status
  type: string
  description: blocked | already_blocked | skipped_allowlisted | planned
- name: error
  type: string
  description: Empty on success.
used_by:
- ransomware
- phishing
- malware
- persistence
- rmm
