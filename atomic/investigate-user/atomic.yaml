schema_version: 1
id: investigate-user
name: Investigate user
category: investigation
description: 'Identity context for an account: profile, risk state, recent sign-ins, MFA events and mailbox
  rules.'
side_effects: false
requires_approval: false
reversible: true
rollback: Not applicable (read-only).
idempotent: true
supports_dry_run: false
integrations:
- microsoft-entra
- splunk
- cisco-xdr
inputs:
- name: user
  type: string
  required: true
  description: UPN or email address.
- name: lookback_hours
  type: integer
  required: false
  description: Default 72.
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
outputs:
- name: profile
  type: object
  description: Department, manager, privileged role membership.
- name: risk_level
  type: string
  description: Entra risk level when available.
- name: signins
  type: list
  description: Recent sign-ins with IP, location, app and result.
- name: anomalies
  type: list
  description: Impossible travel, new device, unfamiliar location, MFA fatigue patterns.
- name: is_protected
  type: boolean
  description: True when the user is in the guardrails protected list.
- name: error
  type: string
  description: Empty on success.
used_by:
- ransomware
- phishing
- mail-bombing
- bec
- account-takeover
- powershell
- lateral-movement
- password-spray
- credential-dumping
- privilege-escalation
- rmm
- exfiltration
- cloud-compromise
