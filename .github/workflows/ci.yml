name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: PYTHONPATH=engine python -m xdr_plan check
      - run: |
          for scenario in ransomware phishing account_takeover ransomware_domain_controller; do
            python tools/simulator/simulate.py "$scenario" --live --check > /dev/null
            python tools/simulator/simulate.py "$scenario" --check > /dev/null
          done
