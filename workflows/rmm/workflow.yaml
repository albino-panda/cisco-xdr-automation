schema_version: 1
id: rmm
name: Unauthorised remote access tool
status: specification
description: Detect and remove remote monitoring and management tools that are not sanctioned by IT.
default_severity: high
mitre_attack:
- id: T1219
  name: Remote Access Tools
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1219
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Installation or execution of an RMM tool not on the approved list
- DNS queries to RMM vendor relay domains from unexpected hosts
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident, plus the RMM facts
    the detection provides in incident.context (rmm_tool, rmm_relay_domains, rmm_installer_sha256,
    rmm_sessions).
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists (including allowlist.approved_rmm) and blast-radius limits
    (docs/deployment/guardrails.example.yaml).
  on_error: stop
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
  on_error: continue
- id: enrich_hash
  phase: enrich
  atomic: enrich-hash
  for_each: sha256
  on_error: continue
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
  on_error: continue
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
  on_error: continue
- id: build_plan
  phase: decide
  note: Build the containment plan from the plan rules below, enrichment verdicts, investigation results
    and guardrails. A tool named in guardrails.allowlist.approved_rmm is never blocked. Drop any target
    that is protected, allow-listed or over the blast-radius limit.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
  on_error: escalate
- id: block_domain
  phase: contain
  atomic: block-domain
  when: Enriched domain is listed in incident.context.rmm_relay_domains, and the detected tool
    (incident.context.rmm_tool) is named and not in guardrails.allowlist.approved_rmm.
  requires_approval: true
  on_error: continue
- id: block_hash
  phase: contain
  atomic: block-hash
  when: Enriched SHA-256 is listed in incident.context.rmm_installer_sha256, and the detected tool is
    named and not in guardrails.allowlist.approved_rmm.
  requires_approval: true
  on_error: continue
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: Investigated host is isolation-capable and has an active session in incident.context.rmm_sessions
    whose remote operator is not verified as IT staff. Applies to sanctioned tools too.
  requires_approval: true
  on_error: escalate
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results and the rollback for every
    containment action. The isolation unlock code is stored only here.
  on_error: escalate
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: continue
plan:
- id: block_unapproved_rmm_relay_domain
  description: Relay or broker domain that the detection attributes to the RMM tool, when that tool is
    named and not sanctioned in guardrails.allowlist.approved_rmm.
  atomic: block-domain
  for_each: "results['enrich-domain']"
  when: >-
    get(incident.context, 'rmm_tool', '') != ''
    and lower(incident.context.rmm_tool) not in [lower(t) for t in get(guardrails.allowlist, 'approved_rmm', [])]
    and lower(item.domain) in [lower(d) for d in get(incident.context, 'rmm_relay_domains', [])]
  target: item.domain
  args:
    expires_hours: "get(guardrails.expiry_hours, 'block-domain', 720)"
    incident_id: "get(incident, 'id', '')"
- id: block_unapproved_rmm_installer
  description: Installer SHA-256 of the RMM tool, when that tool is named and not sanctioned in
    guardrails.allowlist.approved_rmm.
  atomic: block-hash
  for_each: "results['enrich-hash']"
  when: >-
    get(incident.context, 'rmm_tool', '') != ''
    and lower(incident.context.rmm_tool) not in [lower(t) for t in get(guardrails.allowlist, 'approved_rmm', [])]
    and lower(item.sha256) in [lower(h) for h in get(incident.context, 'rmm_installer_sha256', [])]
  target: item.sha256
  args:
    description: "'Unapproved RMM installer (' + incident.context.rmm_tool + '), incident ' + get(incident, 'id', 'n/a')"
    incident_id: "get(incident, 'id', '')"
- id: isolate_host_with_unverified_rmm_session
  description: Isolation-capable host with an active RMM session whose remote operator is not verified
    as IT staff, whether or not the tool itself is sanctioned.
  atomic: isolate-endpoint
  for_each: "results['investigate-host']"
  when: >-
    item.isolation_capable
    and any(s.active and not s.operator_verified and lower(s.host) in [lower(item.host), lower(item.connector_guid)]
    for s in get(incident.context, 'rmm_sessions', []))
  target: item.connector_guid
  args:
    reason: "'Active remote access session by an unverified operator (' + get(incident.context, 'rmm_tool', 'unknown tool') + '): ' + incident.title"
    incident_id: "get(incident, 'id', '')"
templates:
  approval: |-
    {workflow.name}: approval needed for incident {incident.id} ({incident.severity}).
    Detected tool: {incident.context.rmm_tool}. Either it is not on the approved RMM list, or a session
    was opened by a remote operator that IT has not verified.
    Planned actions:
    {plan.actions}
    Skipped by guardrails: {plan.skipped}
    Escalation: {plan.escalate} {plan.reasons}
    Every action is reversible: domain and hash blocks are removed from their lists, and isolation is
    stopped with the unlock code recorded in the incident note. Approve or reject.
  incident_note: |-
    {workflow.name} ({workflow.id}) ran on incident {incident.id}: {incident.title}
    Detected tool: {incident.context.rmm_tool}. Approved RMM list read from the guardrails file.
    Enrichment and investigation summary:
    {plan.summary}
    Containment plan (dry_run {plan.dry_run}):
    {plan.actions}
    Approval: {approver.name} at {approver.decided_at}, decision {approver.decision}.
    Per-action results: {plan.results}
    Escalation: {plan.escalate} {plan.reasons}
    Rollback:
    - block-domain: remove the domain from the automation block list in Umbrella (and Cloudflare Gateway
      if used). Blocks also expire after the configured expiry_hours.
    - block-hash: delete the SHA-256 from the Secure Endpoint simple custom detection list.
    - isolate-endpoint: stop isolation for the connector GUID in Secure Endpoint.
      Unlock code: {plan.unlock_codes}
    Ticket: {ticket.id} {ticket.url}
  ticket_title: '[{incident.severity}] Unauthorised remote access tool {incident.context.rmm_tool} - {incident.id}'
  ticket_body: |-
    ## Unauthorised remote access tool
    Incident: {incident.id} - {incident.title} (source {incident.source})
    Detected tool: {incident.context.rmm_tool}
    ### Findings
    {plan.summary}
    ### Containment
    {plan.actions}
    Approved by: {approver.name}
    Escalation: {plan.escalate} {plan.reasons}
    ### Rollback
    Remove domain blocks from the automation block list, delete hash blocks from the Secure Endpoint
    custom detection list, and stop isolation with the unlock code in the XDR incident note.
    ### Follow-up
    Uninstall the tool on affected hosts, confirm with the user how the help-desk contact happened, and
    check the hosts for persistence (persistence workflow).
  notification: '{workflow.name}: {incident.context.rmm_tool} on incident {incident.id} ({incident.severity}).
    {plan.action_count} actions planned, escalate {plan.escalate}. Ticket {ticket.id} {ticket.url}'
integrations:
- cisco-xdr
- umbrella
- secure-endpoint
- meraki
- splunk
- microsoft-entra
- cloudflare
- servicenow
related_workflows:
- mail-bombing
- persistence
