  investigate-host:
    - {host: ws-sales-031, connector_guid: 00000000-0000-4000-8000-00000000c031, detections: [], trajectory: [], isolation_capable: true, is_protected: false}
  investigate-user:
    - {user: user03@example.com, profile: {department: Sales}, risk_level: medium, signins: [], anomalies: [], is_protected: false}
expect:
