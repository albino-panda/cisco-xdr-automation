name: Attacker signs in again after sessions were revoked
description: >
  An earlier run for this incident revoked the user's sessions (recorded in
  incident.context.previously_revoked_users), and the user still shows a successful sign-in from a
  malicious IP. The attacker holds working credentials, so revocation alone is not enough: sessions are
  revoked again and the account is disabled with approval until the help desk has reset the password
  and re-registered MFA. The attacker IP is blocked with approval.
incident:
  id: INC-TEST-ATO-0006
  title: Repeat attacker sign-in after session revocation
  severity: high
  source: Microsoft Entra ID Protection
  observables:
    - {type: user, value: hr-ops-03@example.com}
    - {type: ip, value: 198.51.100.150}
  targets:
    - {type: user, value: hr-ops-03@example.com}
  context:
    detection: riskySignIn
    previously_revoked_users: [hr-ops-03@example.com]
results:
  enrich-ip:
    - {ip: 198.51.100.150, verdict: malicious, sources: [{source: Cisco XDR, verdict: malicious}], internal_sightings: 0, is_internal: false, error: ""}
  investigate-user:
    - user: hr-ops-03@example.com
      profile: {department: Human Resources, manager: hr-lead@example.com, groups: [HR Users], privileged_roles: []}
      risk_level: medium
      signins:
        - {ip: 198.51.100.150, location: Unfamiliar country, app: Office 365 Exchange Online, result: success}
      anomalies: [unfamiliar_location]
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: revoke-session, target: hr-ops-03@example.com, status: planned, requires_approval: true}
    - {atomic: disable-user, target: hr-ops-03@example.com, status: planned, requires_approval: true}
    - {atomic: block-ip, target: 198.51.100.150, status: planned, requires_approval: true}
