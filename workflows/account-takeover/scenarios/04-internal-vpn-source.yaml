name: Attacker sign-in through the corporate VPN address pool
description: >
  The attacker connected to the corporate VPN with the stolen credentials, so the cloud sign-in comes
  from an internal VPN pool address that XDR rates malicious. The session is revoked, but block-ip is
  skipped_internal: a perimeter block cannot act on an internal address and could cut off a legitimate
  user who gets the same lease later. The VPN session itself is handled by the analyst from the note.
incident:
  id: INC-TEST-ATO-0004
  title: Risky sign-in from corporate VPN address
  severity: high
  source: Cisco XDR
  observables:
    - {type: user, value: eng-dev-11@example.com}
    - {type: ip, value: 10.20.30.40}
  targets:
    - {type: user, value: eng-dev-11@example.com}
  context:
    detection: riskySignIn
    vpn_pool: 10.20.30.0/24
results:
  enrich-ip:
    - {ip: 10.20.30.40, verdict: malicious, sources: [{source: Cisco XDR, verdict: malicious}], internal_sightings: 0, is_internal: true, error: ""}
  investigate-user:
    - user: eng-dev-11@example.com
      profile: {department: Engineering, manager: eng-lead@example.com, groups: [Engineering], privileged_roles: []}
      risk_level: medium
      signins:
        - {ip: 10.20.30.40, location: Corporate VPN, app: Office 365 SharePoint Online, result: success}
      anomalies: [new_device]
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: revoke-session, target: eng-dev-11@example.com, status: planned, requires_approval: true}
    - {atomic: block-ip, target: 10.20.30.40, status: skipped_internal, requires_approval: true}
