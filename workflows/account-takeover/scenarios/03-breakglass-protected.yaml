name: Attacker sign-in to a protected break-glass account
description: >-
  A break-glass account with the Global Administrator role signs in from a malicious IP. The account
  meets the revoke and privileged-disable conditions and is in protected.users, so both actions stay
  planned with elevated: true. They need ELEVATED approval by a lead, who weighs locking out the
  emergency access path against the attacker sign-in. The attacker IP block is planned behind normal
  approval.
incident:
  id: INC-TEST-ATO-0003
  title: High-risk sign-in to emergency access account
  severity: critical
  source: Microsoft Entra ID Protection
  observables:
    - {type: user, value: breakglass-01@example.com}
    - {type: ip, value: 203.0.113.99}
  targets:
    - {type: user, value: breakglass-01@example.com}
  context:
    detection: riskySignIn
results:
  enrich-ip:
    - {ip: 203.0.113.99, verdict: malicious, sources: [{source: Cisco XDR, verdict: malicious}], internal_sightings: 0, is_internal: false, error: ""}
  investigate-user:
    - user: breakglass-01@example.com
      profile: {department: IT, manager: it-lead@example.com, groups: [Emergency Access], privileged_roles: [Global Administrator]}
      risk_level: high
      signins:
        - {ip: 203.0.113.99, location: Unfamiliar country, app: Azure Portal, result: success}
      anomalies: [unfamiliar_location, new_device]
      is_protected: true
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: revoke-session, target: breakglass-01@example.com, status: planned, elevated: true, requires_approval: true}
    - {atomic: disable-user, target: breakglass-01@example.com, status: planned, elevated: true, requires_approval: true}
    - {atomic: block-ip, target: 203.0.113.99, status: planned, requires_approval: true}
