name: Impossible travel explained by a business trip
description: >
  Entra raises an impossible-travel alert for a user who is on an approved business trip. The new
  location's IP is clean, Entra rates the risk medium, MFA was satisfied on the registered device and
  there is no MFA fatigue pattern. No containment action is planned; the run only records the
  enrichment so an analyst can close the incident.
incident:
  id: INC-TEST-ATO-0002
  title: Impossible travel for a sales user
  severity: medium
  source: Microsoft Entra ID Protection
  observables:
    - {type: user, value: sales-rep-09@example.com}
    - {type: ip, value: 198.51.100.77}
  targets:
    - {type: user, value: sales-rep-09@example.com}
  context:
    detection: impossibleTravel
    travel_request: approved travel on file for the sign-in dates
results:
  enrich-ip:
    - {ip: 198.51.100.77, verdict: clean, sources: [{source: Cisco XDR, verdict: clean}], internal_sightings: 0, is_internal: false, error: ""}
  investigate-user:
    - user: sales-rep-09@example.com
      profile: {department: Sales, manager: sales-lead@example.com, groups: [Sales Users], privileged_roles: []}
      risk_level: medium
      signins:
        - {ip: 198.51.100.77, location: Conference hotel, app: Microsoft Teams, result: success}
      anomalies: [impossible_travel, unfamiliar_location]
      is_protected: false
      error: ""
expect:
  escalate: false
  actions: []
