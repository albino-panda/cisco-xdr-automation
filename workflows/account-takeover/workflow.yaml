schema_version: 1
id: account-takeover
name: Account takeover
status: specification
description: Respond to a sign-in by an attacker using valid credentials or a stolen session.
default_severity: high
mitre_attack:
- id: T1078.004
  name: 'Valid Accounts: Cloud Accounts'
- id: T1621
  name: Multi-Factor Authentication Request Generation
- id: T1539
  name: Steal Web Session Cookie
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1078.004
    - T1621
    - T1539
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Entra risky sign-in or impossible travel
- MFA fatigue pattern
- Sign-in from anonymising infrastructure
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
    Without guardrails nothing may be contained, so a failure stops the run.
  on_error: stop
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
  on_error: continue
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
  on_error: continue
- id: build_plan
  phase: decide
  note: Build the containment plan from enrichment verdicts, investigation results and guardrails. Drop
    any target that is protected, allow-listed or over the blast-radius limit.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded). Actions
    auto-approved in the guardrails file (auto_approve.account-takeover) are listed for information only.
  skip_if: dry_run == true
  on_error: escalate
- id: revoke_session
  phase: contain
  atomic: revoke-session
  when: The investigated user has Entra risk level high, a successful sign-in from an IP enriched as malicious
    or suspicious, or an MFA fatigue anomaly followed by a successful sign-in.
  requires_approval: false
  on_error: escalate
- id: disable_user
  phase: contain
  atomic: disable-user
  when: The user meets the revoke_session condition and holds a privileged role (profile.privileged_roles),
    or the user's sessions were already revoked earlier for this incident (incident.context.previously_revoked_users)
    and a successful sign-in from a malicious or suspicious IP is still present.
  requires_approval: true
  on_error: escalate
- id: block_ip
  phase: contain
  atomic: block-ip
  when: An enriched IP that is not shared infrastructure (internal_sightings is 0) and either has verdict
    malicious and appears in an investigated user's sign-ins, or is not clean and is the source of 3 or
    more denied MFA prompts against a user with an MFA fatigue anomaly.
  requires_approval: true
  on_error: escalate
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results and the rollback for every action.
  on_error: continue
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: continue
plan:
- id: revoke_compromised_sessions
  description: Users with a high-risk or confirmed attacker sign-in. Entra risk level high, a successful
    sign-in from an IP enriched as malicious or suspicious, or an MFA fatigue anomaly followed by a successful
    sign-in (an approved push).
  atomic: revoke-session
  for_each: "results['investigate-user']"
  when: "get(item, 'risk_level', 'none') == 'high' or any(s.result == 'success' and s.ip in [e.ip for e in results['enrich-ip'] if e.verdict in ['malicious', 'suspicious']] for s in item.signins) or ('mfa_fatigue' in item.anomalies and any(s.result == 'success' for s in item.signins))"
  target: "item.user"
- id: disable_privileged_compromised_user
  description: A compromised user (same test as revoke_compromised_sessions) who holds a privileged role.
    Revocation alone leaves a privileged account reachable with the stolen credentials.
  atomic: disable-user
  for_each: "results['investigate-user']"
  when: "len(get(item.profile, 'privileged_roles', [])) > 0 and (get(item, 'risk_level', 'none') == 'high' or any(s.result == 'success' and s.ip in [e.ip for e in results['enrich-ip'] if e.verdict in ['malicious', 'suspicious']] for s in item.signins) or ('mfa_fatigue' in item.anomalies and any(s.result == 'success' for s in item.signins)))"
  target: "item.user"
  args:
    reason: "'Account takeover ' + get(incident, 'id', 'no incident id') + ': privileged account with attacker sign-in'"
- id: disable_user_active_after_revocation
  description: Sessions for this user were already revoked earlier for this incident, and a successful
    sign-in from a malicious or suspicious IP is still present, so the attacker holds working credentials.
  atomic: disable-user
  for_each: "results['investigate-user']"
  when: "item.user in get(incident.context, 'previously_revoked_users', []) and any(s.result == 'success' and s.ip in [e.ip for e in results['enrich-ip'] if e.verdict in ['malicious', 'suspicious']] for s in item.signins)"
  target: "item.user"
  args:
    reason: "'Account takeover ' + get(incident, 'id', 'no incident id') + ': attacker sign-in after session revocation'"
- id: block_malicious_signin_ips
  description: IPs enriched as malicious that appear in an investigated user's sign-ins and are not shared
    infrastructure (no internal hosts talk to them).
  atomic: block-ip
  for_each: "results['enrich-ip']"
  when: "item.verdict == 'malicious' and item.internal_sightings == 0 and any(item.ip in [s.ip for s in u.signins] for u in results['investigate-user'])"
  target: "item.ip"
  args:
    expires_hours: "guardrails.expiry_hours['block-ip']"
- id: block_mfa_fatigue_sources
  description: IPs that are not clean, not shared infrastructure, and sent 3 or more denied MFA prompts
    to a user with an MFA fatigue anomaly. Fresh attacker infrastructure often has no reputation yet.
  atomic: block-ip
  for_each: "results['enrich-ip']"
  when: "item.verdict != 'clean' and item.internal_sightings == 0 and any('mfa_fatigue' in u.anomalies and len([s for s in u.signins if s.ip == item.ip and s.result == 'mfa_denied']) >= 3 for u in results['investigate-user'])"
  target: "item.ip"
  args:
    expires_hours: "guardrails.expiry_hours['block-ip']"
templates:
  approval: |
    Approve account takeover containment for {incident.id}: {incident.title} (severity {incident.severity}).
    Workflow {workflow.name}, dry run {plan.dry_run}.
    Planned actions:
    {plan.actions}
    Skipped by guardrails:
    {plan.skipped}
    Escalation: {plan.escalate} {plan.reasons}
    revoke-session is auto-approved for this workflow in the guardrails file and is listed for information.
    It is not reversible: the user signs in again. disable-user and block-ip are reversible; the rollback
    for each is written to the incident note.
  incident_note: |
    Workflow {workflow.name} ({workflow.id}) ran for {incident.id}. Dry run: {plan.dry_run}.
    Enrichment and sign-in summary:
    {plan.enrichment_summary}
    Plan and results:
    {plan.action_results}
    Skipped: {plan.skipped}
    Escalation: {plan.escalate} {plan.reasons}
    Approval: {approver.decision} by {approver.name} at {approver.time}.
    Rollback:
    - revoke-session: not reversible. The user signs in again after the password reset below.
    - disable-user: set accountEnabled back to true in Entra ID, only after the help desk has completed
      the password reset and MFA re-registration below.
    - block-ip: remove the Meraki MX rule or Cloudflare IP list item; Meraki restores from the saved
      rule set. Blocks auto-expire after the planned expires_hours.
    Required follow-up (help desk): reset the password and re-register MFA for every affected user, after
    identity verification out of band (call back on a number from the HR record, not one from the
    incident). Remove MFA methods and devices the user does not recognise.
    Ticket: {ticket.id} {ticket.url}
  ticket_title: "[Account takeover] {incident.title} ({incident.id})"
  ticket_body: |
    Account takeover for {incident.id}: {incident.title}.
    Severity: {incident.severity}. Workflow: {workflow.name}. Dry run: {plan.dry_run}.
    Enrichment and sign-in summary:
    {plan.enrichment_summary}
    Containment actions and status:
    {plan.action_results}
    Skipped by guardrails: {plan.skipped}
    Escalation required: {plan.escalate} {plan.reasons}
    Approved by: {approver.name}
    Help desk task: reset the password and re-register MFA for each affected user after identity
    verification out of band. Remove unrecognised MFA methods and devices. Re-enable a disabled account
    only after both are done.
    Rollback steps are in the XDR incident note.
  notification: "Account takeover {incident.severity}: {incident.title} ({incident.id}). {plan.summary} Escalate: {plan.escalate}. Help desk password reset and MFA re-registration required. Ticket {ticket.id} {ticket.url}"
integrations:
- cisco-xdr
- umbrella
- splunk
- microsoft-entra
- meraki
- cloudflare
- servicenow
related_workflows:
- bec
- cloud-compromise
- password-spray
