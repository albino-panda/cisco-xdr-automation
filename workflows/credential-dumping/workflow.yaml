schema_version: 1
id: credential-dumping
name: Credential dumping
status: specification
description: Contain a host where credential material was accessed and treat exposed accounts as compromised.
default_severity: critical
mitre_attack:
- id: T1003.001
  name: 'OS Credential Dumping: LSASS Memory'
- id: T1003.002
  name: Security Account Manager
- id: T1003.003
  name: NTDS
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1003.001
    - T1003.002
    - T1003.003
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Secure Endpoint detection of credential-theft tooling or LSASS access
- XDR incident tagged T1003
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
- id: enrich_hash
  phase: enrich
  atomic: enrich-hash
  for_each: sha256
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
- id: build_plan
  phase: decide
  note: Build the containment plan from enrichment verdicts, investigation results and guardrails. Drop
    any target that is protected, allow-listed or over the blast-radius limit.
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: Source host.
  requires_approval: true
- id: revoke_session
  phase: contain
  atomic: revoke-session
  when: Accounts logged on to the host in the lookback window.
  requires_approval: false
- id: disable_user
  phase: contain
  atomic: disable-user
  when: Privileged accounts exposed on the host, after approver review.
  requires_approval: true
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals and per-action results.
- id: create_ticket
  phase: record
  atomic: create-ticket
- id: notify_soc
  phase: notify
  atomic: notify-soc
integrations:
- cisco-xdr
- secure-endpoint
- meraki
- splunk
- microsoft-entra
- servicenow
related_workflows:
- lateral-movement
- privilege-escalation
