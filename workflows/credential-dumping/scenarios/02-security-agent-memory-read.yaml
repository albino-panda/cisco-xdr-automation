name: Endpoint security agent reads LSASS memory
description: >-
  Benign. The organisation's approved endpoint security agent scans LSASS memory as part of normal
  protection. The detection and the file hash are both clean and the binary is common across the fleet,
  so no host is isolated and no account is touched even though a user is logged on.
incident:
  id: INC-TEST-0302
  title: LSASS access on ws-0207.example.com
  severity: high
  source: Cisco XDR
  observables:
    - {type: hostname, value: ws-0207.example.com}
    - {type: sha256, value: 9e8d7c6b5a4f30211f2e3d4c5b6a79880f1e2d3c4b5a69788796a5b4c3d2e1f0}
    - {type: user, value: carol.diaz@example.com}
  context:
    logged_on_users: [carol.diaz@example.com]
results:
  enrich-hash:
    - sha256: 9e8d7c6b5a4f30211f2e3d4c5b6a79880f1e2d3c4b5a69788796a5b4c3d2e1f0
      disposition: clean
      prevalence: 4200
      hosts: [00000000-0000-4000-8000-000000000207, ws-0207.example.com]
  investigate-host:
    - host: ws-0207.example.com
      connector_guid: 00000000-0000-4000-8000-000000000207
      detections:
        - {name: LSASS memory read by approved endpoint security agent, disposition: clean}
      trajectory: []
      isolation_capable: true
      is_protected: false
  investigate-user:
    - user: carol.diaz@example.com
      profile: {department: Sales, groups: [Sales Users], privileged_roles: []}
      risk_level: none
      signins: []
      anomalies: []
      is_protected: false
expect:
  escalate: false
  actions: []
