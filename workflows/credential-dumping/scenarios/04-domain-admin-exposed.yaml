name: Domain Admins member logged on to a compromised workstation
description: >-
  Guardrail. Credential access is confirmed on a workstation where a member of the protected group
  Domain Admins was logged on. The workstation is isolated, but session revocation and disabling of the
  Domain Admins member are skipped as protected and left to a human. The standard user on the same host
  is still revoked.
incident:
  id: INC-TEST-0304
  title: Credential theft behaviour on ws-0388.example.com
  severity: critical
  source: Cisco Secure Endpoint
  observables:
    - {type: hostname, value: ws-0388.example.com}
    - {type: user, value: da-ops01@example.com}
    - {type: user, value: dan.okafor@example.com}
  context:
    logged_on_users: [da-ops01@example.com, dan.okafor@example.com]
results:
  investigate-host:
    - host: ws-0388.example.com
      connector_guid: 00000000-0000-4000-8000-000000000388
      detections:
        - {name: Suspicious read of LSASS process memory, disposition: malicious}
      trajectory: []
      isolation_capable: true
      is_protected: false
  investigate-user:
    - user: da-ops01@example.com
      profile: {department: IT, groups: [Domain Admins], privileged_roles: [Privileged Role Administrator]}
      risk_level: high
      signins: []
      anomalies: []
      is_protected: false
    - user: dan.okafor@example.com
      profile: {department: Operations, groups: [Operations Users], privileged_roles: []}
      risk_level: low
      signins: []
      anomalies: []
      is_protected: false
expect:
  escalate: false
  actions:
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000388, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: da-ops01@example.com, status: skipped_protected, requires_approval: false}
    - {atomic: disable-user, target: da-ops01@example.com, status: skipped_protected, requires_approval: true}
    - {atomic: revoke-session, target: dan.okafor@example.com, status: planned, requires_approval: false}
