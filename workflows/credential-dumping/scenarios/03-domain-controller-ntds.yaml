name: Directory database accessed on a domain controller
description: >-
  Guardrail. Credential access is confirmed on dc-01.example.com, which matches the protected host
  pattern dc-*. Isolation is skipped as protected, and because a protected host is confirmed no account
  action is planned either. The privileged administrator logged on to the DC is left to the incident
  commander, who owns the domain-wide credential reset.
incident:
  id: INC-TEST-0303
  title: Directory database access on dc-01.example.com
  severity: critical
  source: Cisco Secure Endpoint
  observables:
    - {type: hostname, value: dc-01.example.com}
    - {type: user, value: server-admin02@example.com}
  context:
    logged_on_users: [server-admin02@example.com]
results:
  investigate-host:
    - host: dc-01.example.com
      connector_guid: 00000000-0000-4000-8000-0000000000d1
      detections:
        - {name: Unexpected copy of the directory database, disposition: malicious}
      trajectory: []
      isolation_capable: true
      is_protected: true
  investigate-user:
    - user: server-admin02@example.com
      profile: {department: IT, groups: [Server Operators], privileged_roles: [Exchange Administrator]}
      risk_level: high
      signins: []
      anomalies: []
      is_protected: false
expect:
  escalate: false
  actions:
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-0000000000d1, status: skipped_protected, requires_approval: true}
