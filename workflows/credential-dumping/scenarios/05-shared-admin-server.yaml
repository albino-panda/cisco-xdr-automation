name: Many privileged accounts cached on a shared admin server
description: >-
  Edge case specific to credential dumping. A shared administration server holds cached logons of
  four privileged accounts. The Secure Endpoint detection is still unknown, but the malicious hash
  is seen on the server, which confirms credential access. Isolation of the server and revocation of
  all four sessions are planned, but four account disables exceed max_users_disabled (3), so every
  disable stays planned with elevated: true and the plan escalates to a lead.
incident:
  id: INC-TEST-0305
  title: Credential theft behaviour on adm-jump01.example.com
  severity: critical
  source: Cisco XDR
  observables:
    - {type: hostname, value: adm-jump01.example.com}
    - {type: sha256, value: 0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9}
  context:
    logged_on_users:
      - net-admin01@example.com
      - net-admin02@example.com
      - sys-admin03@example.com
      - sys-admin04@example.com
results:
  enrich-hash:
    - sha256: 0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9
      disposition: malicious
      prevalence: 1
      hosts: [adm-jump01.example.com]
  investigate-host:
    - host: adm-jump01.example.com
      connector_guid: 00000000-0000-4000-8000-0000000000a1
      detections:
        - {name: Unsigned process opened a handle to LSASS, disposition: unknown}
      trajectory: []
      isolation_capable: true
      is_protected: false
  investigate-user:
    - user: net-admin01@example.com
      profile: {department: IT, groups: [Network Ops], privileged_roles: [Network Administrator]}
      risk_level: medium
      signins: []
      anomalies: []
      is_protected: false
    - user: net-admin02@example.com
      profile: {department: IT, groups: [Network Ops], privileged_roles: [Network Administrator]}
      risk_level: medium
      signins: []
      anomalies: []
      is_protected: false
    - user: sys-admin03@example.com
      profile: {department: IT, groups: [Server Ops], privileged_roles: [Intune Administrator]}
      risk_level: medium
      signins: []
      anomalies: []
      is_protected: false
    - user: sys-admin04@example.com
      profile: {department: IT, groups: [Server Ops], privileged_roles: [Security Administrator]}
      risk_level: medium
      signins: []
      anomalies: []
      is_protected: false
expect:
  escalate: true
  actions:
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-0000000000a1, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: net-admin01@example.com, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: net-admin02@example.com, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: sys-admin03@example.com, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: sys-admin04@example.com, status: planned, requires_approval: true}
    - {atomic: disable-user, target: net-admin01@example.com, status: planned, elevated: true, requires_approval: true}
    - {atomic: disable-user, target: net-admin02@example.com, status: planned, elevated: true, requires_approval: true}
    - {atomic: disable-user, target: sys-admin03@example.com, status: planned, elevated: true, requires_approval: true}
    - {atomic: disable-user, target: sys-admin04@example.com, status: planned, elevated: true, requires_approval: true}
