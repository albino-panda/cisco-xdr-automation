name: Credential material accessed on a workstation
description: >-
  True positive on a standard workstation. Secure Endpoint flags a malicious read of LSASS memory and the
  file hash is malicious. The host is isolated, sessions of the two accounts logged on to it are revoked,
  and the privileged helpdesk account is also disabled after approval. A third user named in the
  incident never logged on to the host and is not actioned.
incident:
  id: INC-TEST-0301
  title: Credential theft behaviour on ws-0142.example.com
  severity: critical
  source: Cisco Secure Endpoint
  observables:
    - {type: hostname, value: ws-0142.example.com}
    - {type: sha256, value: 3b1f0c2d4e5a6978b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d}
    - {type: user, value: alice.nguyen@example.com}
    - {type: user, value: helpdesk-admin07@example.com}
    - {type: user, value: bob.martin@example.com}
  context:
    logged_on_users: [alice.nguyen@example.com, helpdesk-admin07@example.com]
results:
  enrich-hash:
    - sha256: 3b1f0c2d4e5a6978b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d
      disposition: malicious
      prevalence: 1
      hosts: [00000000-0000-4000-8000-000000000142, ws-0142.example.com]
  investigate-host:
    - host: ws-0142.example.com
      connector_guid: 00000000-0000-4000-8000-000000000142
      detections:
        - {name: Suspicious read of LSASS process memory, disposition: malicious}
      trajectory: []
      isolation_capable: true
      is_protected: false
  investigate-user:
    - user: alice.nguyen@example.com
      profile: {department: Finance, groups: [Finance Users], privileged_roles: []}
      risk_level: low
      signins: []
      anomalies: []
      is_protected: false
    - user: helpdesk-admin07@example.com
      profile: {department: IT, groups: [Helpdesk], privileged_roles: [Helpdesk Administrator]}
      risk_level: medium
      signins: []
      anomalies: []
      is_protected: false
    - user: bob.martin@example.com
      profile: {department: Finance, groups: [Finance Users], privileged_roles: []}
      risk_level: none
      signins: []
      anomalies: []
      is_protected: false
expect:
  escalate: false
  actions:
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000142, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: alice.nguyen@example.com, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: helpdesk-admin07@example.com, status: planned, requires_approval: true}
    - {atomic: disable-user, target: helpdesk-admin07@example.com, status: planned, requires_approval: true}
