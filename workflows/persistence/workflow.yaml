schema_version: 1
id: persistence
name: Persistence
status: specification
description: Find and remove attacker footholds such as run keys, scheduled tasks, services and new accounts.
default_severity: medium
mitre_attack:
- id: T1547.001
  name: Registry Run Keys / Startup Folder
- id: T1053.005
  name: Scheduled Task
- id: T1543.003
  name: Windows Service
- id: T1136
  name: Create Account
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1547.001
    - T1053.005
    - T1543.003
    - T1136
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- New autorun entry or service from an unknown binary
- New local or cloud account outside change windows
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
- id: enrich_hash
  phase: enrich
  atomic: enrich-hash
  for_each: sha256
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
- id: build_plan
  phase: decide
  note: Build the containment plan from enrichment verdicts, investigation results and guardrails. Drop
    any target that is protected, allow-listed or over the blast-radius limit.
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
- id: block_hash
  phase: contain
  atomic: block-hash
  when: Persisted binary with malicious disposition.
  requires_approval: true
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: Persistence linked to active malicious execution.
  requires_approval: true
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals and per-action results.
- id: create_ticket
  phase: record
  atomic: create-ticket
- id: notify_soc
  phase: notify
  atomic: notify-soc
integrations:
- cisco-xdr
- secure-endpoint
- umbrella
- meraki
- splunk
- servicenow
related_workflows:
- malware
- privilege-escalation
