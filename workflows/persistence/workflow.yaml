schema_version: 1
id: persistence
name: Persistence
status: specification
description: Find and remove attacker footholds such as run keys, scheduled tasks, services and new accounts.
default_severity: medium
mitre_attack:
- id: T1547.001
  name: Registry Run Keys / Startup Folder
- id: T1053.005
  name: Scheduled Task
- id: T1543.003
  name: Windows Service
- id: T1136
  name: Create Account
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1547.001
    - T1053.005
    - T1543.003
    - T1136
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- New autorun entry or service from an unknown binary
- New local or cloud account outside change windows
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
  on_error: stop
- id: enrich_hash
  phase: enrich
  atomic: enrich-hash
  for_each: sha256
  note: Disposition and fleet prevalence of each persisted binary (run key, task, service or startup
    item target).
  on_error: continue
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
  note: Context only for the note and ticket. No plan rule acts on domain verdicts; C2 blocking belongs
    to the c2 workflow.
  on_error: continue
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
  note: Detections, trajectory and isolation capability of each host carrying a persistence item.
  on_error: continue
- id: build_plan
  phase: decide
  note: Build the containment plan from the plan rules below, enrichment verdicts, investigation results
    and guardrails. Drop any target that is protected, allow-listed or over the blast-radius limit.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded). A failed or
    expired approval runs no containment and hands the incident to a human.
  skip_if: dry_run == true
  on_error: escalate
- id: block_hash
  phase: contain
  atomic: block-hash
  when: enrich-hash returned disposition malicious without an error for the persisted binary (rule block_malicious_persisted_binary).
  requires_approval: true
  on_error: escalate
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: investigate-host returned at least one detection with disposition malicious in the lookback window,
    the connector is isolation capable and the lookup had no error (rule isolate_hosts_with_active_execution).
  requires_approval: true
  on_error: escalate
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results, rollback steps and the manual
    removal checklist (templates.incident_note).
  on_error: continue
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: continue
plan:
- id: block_malicious_persisted_binary
  description: Block the SHA-256 of a persisted binary (run key, startup folder, scheduled task or service
    target) that enrichment rates malicious. Unknown or clean binaries are left for the analyst.
  atomic: block-hash
  for_each: "results['enrich-hash']"
  when: "item.disposition == 'malicious' and not get(item, 'error', '')"
  target: "item.sha256"
  args:
    description: "'Persisted binary, XDR incident ' + get(incident, 'id', 'unknown')"
- id: isolate_hosts_with_active_execution
  description: Isolate a host whose persistence is backed by active malicious execution, meaning at least
    one malicious detection in the lookback window. Hosts where the item is present but dormant are not
    isolated.
  atomic: isolate-endpoint
  for_each: "results['investigate-host']"
  when: "item.isolation_capable and not get(item, 'error', '') and any(get(d, 'disposition', '') == 'malicious'
    for d in item.detections)"
  target: "item.connector_guid"
  args:
    reason: "'Persistence with active malicious execution: ' + incident.title"
templates:
  approval: |
    {workflow.name}: containment approval for {incident.id} ({incident.severity})
    {incident.title}

    Planned actions:
    {plan.actions}

    Skipped by guardrails: {plan.skipped}
    Escalated (blast radius exceeded): {plan.escalate}
    Dry run: {workflow.dry_run}

    Approving blocks the listed hashes in Secure Endpoint and network-isolates the listed hosts.
    Both are reversible; rollback steps go into the incident note. Removing the persistence items
    themselves stays a manual or EDR-assisted step and is not part of this approval.
  incident_note: |
    ## {workflow.name} run for {incident.id}
    Dry run: {workflow.dry_run}. Approver: {approver.name} at {approver.time}.

    ### Enrichment and investigation
    {plan.enrichment_summary}

    ### Containment results
    {plan.results}
    Escalated: {plan.escalate} {plan.reasons}

    ### Rollback
    - block-hash: delete each blocked SHA-256 from the Secure Endpoint simple custom detection list ({plan.blocked_hashes}).
    - isolate-endpoint: stop isolation for each isolated connector GUID in Secure Endpoint ({plan.isolated_hosts}). Unlock codes: {plan.unlock_codes}.

    ### Manual removal checklist (record who removed what and when)
    - [ ] Registry Run / RunOnce value removed (T1547.001): {plan.run_keys}
    - [ ] Startup folder item removed (T1547.001): {plan.startup_items}
    - [ ] Scheduled task disabled and deleted (T1053.005): {plan.scheduled_tasks}
    - [ ] Service stopped, disabled and removed (T1543.003): {plan.services}
    - [ ] Unauthorised account disabled, then removed after review (T1136): {plan.accounts}
    - [ ] Persisted binary quarantined or deleted on every host in enrich-hash hosts: {plan.persisted_files}
    - [ ] Re-scan of affected hosts shows no persistence item returning after reboot
  ticket_title: "[{incident.severity}] Persistence: {incident.title} ({incident.id})"
  ticket_body: |
    XDR incident: {incident.id} - {incident.title}
    Severity: {incident.severity}. Source: {incident.source}. Dry run: {workflow.dry_run}.

    Findings:
    {plan.enrichment_summary}

    Containment (approved by {approver.name}):
    {plan.results}
    Escalated to a human: {plan.escalate} {plan.reasons}

    Manual removal checklist:
    - [ ] Registry Run / RunOnce value removed: {plan.run_keys}
    - [ ] Startup folder item removed: {plan.startup_items}
    - [ ] Scheduled task disabled and deleted: {plan.scheduled_tasks}
    - [ ] Service stopped, disabled and removed: {plan.services}
    - [ ] Unauthorised account disabled, then removed after review: {plan.accounts}
    - [ ] Persisted binary quarantined or deleted on every affected host: {plan.persisted_files}
    - [ ] Hosts re-scanned after reboot with no persistence returning

    Rollback is in the XDR incident note.
  notification: "{workflow.name} | {incident.severity} | {incident.id} {incident.title} | planned: {plan.planned_count},
    skipped: {plan.skipped_count}, escalate: {plan.escalate} | ticket {ticket.id} {ticket.url}"
integrations:
- cisco-xdr
- secure-endpoint
- umbrella
- meraki
- splunk
- servicenow
related_workflows:
- malware
- privilege-escalation
