name: Allow-listed admin tool hash on a protected domain controller
description: >-
  Guardrails. A scheduled task on a domain controller runs an internal admin tool that one intel
  source rates malicious (a known false positive), and the host shows a malicious detection for it.
  The hash is in allowlist.hashes, so its block is recorded as skipped. dc-* hosts are protected, so
  the isolation stays planned with elevated: true and a lead decides. The analyst still reviews the
  task through the manual checklist.
incident:
  id: INC-TEST-3003
  title: Scheduled task created on dc-01 running unsigned binary
  severity: high
  source: Cisco Secure Endpoint
  observables:
    - {type: sha256, value: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3}
    - {type: host, value: dc-01}
  context:
    persistence_items:
      - {type: scheduled_task, host: dc-01, name: Example-NightlyInventory, sha256: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3}
results:
  enrich-hash:
    - {sha256: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3, disposition: malicious, prevalence: 3, hosts: [dc-01, dc-02, ws-it-007], error: ""}
  investigate-host:
    - host: dc-01
      connector_guid: 00000000-0000-4000-8000-000000000d01
      detections:
        - {name: HackTool.InventoryAgent, disposition: malicious, sha256: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3}
      trajectory:
        - {event: scheduled_task_run, name: Example-NightlyInventory}
      isolation_capable: true
      is_protected: true
      error: ""
guardrails:
  allowlist:
    hashes:
      - 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3
expect:
  escalate: false
  actions:
    - {atomic: block-hash, target: 3c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a33c4d5e6f708192a3, status: skipped_allowlisted, requires_approval: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000d01, status: planned, elevated: true, requires_approval: true}
