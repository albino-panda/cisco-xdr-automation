name: Malicious service installed on many hosts at once
description: >
  Persistence edge case with a blast-radius guardrail. The same malicious service binary was installed
  and is running on six workstations within minutes, which points at a compromised deployment channel.
  Isolating six hosts exceeds max_hosts_isolated (5), so every isolation becomes skipped_limit and the
  plan escalates to a human. The single hash block is still planned.
incident:
  id: INC-TEST-3005
  title: Same new service installed on six workstations within ten minutes
  severity: critical
  source: Cisco XDR
  observables:
    - {type: sha256, value: 6f708192a3b4c5d66f708192a3b4c5d66f708192a3b4c5d66f708192a3b4c5d6}
  targets:
    - {type: endpoint, value: ws-ops-101}
    - {type: endpoint, value: ws-ops-102}
    - {type: endpoint, value: ws-ops-103}
    - {type: endpoint, value: ws-ops-104}
    - {type: endpoint, value: ws-ops-105}
    - {type: endpoint, value: ws-ops-106}
  context:
    persistence_items:
      - {type: service, host: ws-ops-101 to ws-ops-106, name: WinTelemetryHost, sha256: 6f708192a3b4c5d66f708192a3b4c5d66f708192a3b4c5d66f708192a3b4c5d6}
