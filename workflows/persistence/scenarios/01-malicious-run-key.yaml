name: Run key launching a malicious binary that is executing
description: >
  True positive. A new HKCU Run value on one workstation points at a binary that enrichment rates
  malicious, and Secure Endpoint shows it executing and beaconing to an attacker domain. The plan
  blocks the hash and isolates the host, both behind approval.
incident:
  id: INC-TEST-3001
  title: New Run key value launching unknown binary on ws-fin-014
  severity: high
  source: Cisco Secure Endpoint
  observables:
    - {type: sha256, value: 1f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a7980}
    - {type: domain, value: cdn-update.test}
    - {type: host, value: ws-fin-014}
  targets:
    - {type: endpoint, value: ws-fin-014}
  context:
    persistence_items:
      - {type: run_key, host: ws-fin-014, name: "HKCU Run value OneDriveSync", sha256: 1f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a7980}
results:
  enrich-hash:
    - {sha256: 1f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a7980, disposition: malicious, prevalence: 1, hosts: [ws-fin-014], error: ""}
  enrich-domain:
    - {domain: cdn-update.test, verdict: malicious, categories: [Command and Control], first_seen: "2026-10-02", internal_queries: 42, error: ""}
  investigate-host:
    - host: ws-fin-014
      connector_guid: 00000000-0000-4000-8000-000000003014
      detections:
        - {name: W32.GenericKD.Persist, disposition: malicious, sha256: 1f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a7980}
      trajectory:
        - {event: process_start, file: odsync.exe}
        - {event: network_connect, domain: cdn-update.test}
      isolation_capable: true
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: block-hash, target: 1f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a79801f2e3d4c5b6a7980, status: planned, requires_approval: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000003014, status: planned, requires_approval: true}
