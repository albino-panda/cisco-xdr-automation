name: Dormant scheduled task pointing at a malicious binary
description: >
  Persistence edge case. A malicious binary was dropped and registered as a weekly scheduled task but
  has not run yet, so the host has only a suspicious detection. A second binary in the incident has
  unknown disposition and an enrichment error. The plan blocks only the malicious hash so the task
  cannot launch it, does not isolate a host without active malicious execution, and leaves the unknown
  binary to the analyst.
incident:
  id: INC-TEST-3004
  title: Scheduled task registered with binary in user temp folder on ws-hr-033
  severity: medium
  source: Cisco XDR
  observables:
    - {type: sha256, value: 4d5e6f708192a3b44d5e6f708192a3b44d5e6f708192a3b44d5e6f708192a3b4}
    - {type: sha256, value: 5e6f708192a3b4c55e6f708192a3b4c55e6f708192a3b4c55e6f708192a3b4c5}
    - {type: host, value: ws-hr-033}
  context:
    persistence_items:
      - {type: scheduled_task, host: ws-hr-033, name: UpdateCheckWeekly, next_run: "2026-10-09T03:00:00Z", sha256: 4d5e6f708192a3b44d5e6f708192a3b44d5e6f708192a3b44d5e6f708192a3b4}
results:
  enrich-hash:
    - {sha256: 4d5e6f708192a3b44d5e6f708192a3b44d5e6f708192a3b44d5e6f708192a3b4, disposition: malicious, prevalence: 1, hosts: [ws-hr-033], error: ""}
    - {sha256: 5e6f708192a3b4c55e6f708192a3b4c55e6f708192a3b4c55e6f708192a3b4c5, disposition: unknown, prevalence: 0, hosts: [], error: "lookup timed out"}
  investigate-host:
    - host: ws-hr-033
      connector_guid: 00000000-0000-4000-8000-000000003033
      detections:
        - {name: Suspicious scheduled task created, disposition: suspicious}
      trajectory:
        - {event: scheduled_task_created, name: UpdateCheckWeekly}
      isolation_capable: true
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: block-hash, target: 4d5e6f708192a3b44d5e6f708192a3b44d5e6f708192a3b44d5e6f708192a3b4, status: planned, requires_approval: true}
