name: Admin-share movement to a domain controller with a Domain Admins account
description: >-
  Guardrails. A compromised HR workstation copies a binary to a domain controller over the ADMIN$
  share and starts it as a service, using an account in Domain Admins. The workstation isolation is
  planned. The domain controller matches the protected host pattern dc-* and the account is in the
  protected Domain Admins group, so isolation of the controller, session revocation and disabling
  stay planned with elevated: true and need ELEVATED approval.
incident:
  id: INC-TEST-LM-0003
  title: Remote service created on dc-01 from ws-hr-03 over admin share
  severity: critical
  source: Cisco XDR
  observables:
    - {type: hostname, value: ws-hr-03}
    - {type: hostname, value: dc-01}
    - {type: user, value: adm.r.lee@example.com}
    - {type: sha256, value: c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00}
  context:
    protocol: SMB
    share: ADMIN$
    source_hosts: [ws-hr-03]
results:
  enrich-hash:
    - sha256: c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00c0ffee00
      disposition: malicious
      prevalence: 2
      hosts: [ws-hr-03, dc-01]
      error: ""
  investigate-host:
    - host: ws-hr-03
      connector_guid: 00000000-0000-4000-8000-000000000301
      detections:
        - {name: Malicious binary written to remote ADMIN$ share, disposition: malicious}
      trajectory:
        - {event: SMB write, destination: dc-01}
      isolation_capable: true
      is_protected: false
      error: ""
    - host: dc-01
      connector_guid: 00000000-0000-4000-8000-000000000302
      detections:
        - {name: Service created from file dropped over SMB, disposition: malicious}
      trajectory:
        - {event: service install, source: ws-hr-03}
      isolation_capable: true
      is_protected: true
      error: ""
  investigate-user:
    - user: adm.r.lee@example.com
      profile: {department: IT Operations, groups: [Domain Admins]}
      risk_level: high
      signins:
        - {ip: 10.20.3.33, location: Head office, app: Windows Sign In, result: success}
      anomalies:
        - {type: unfamiliar_host, detail: First interactive logon from ws-hr-03}
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000301, status: planned, requires_approval: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000302, status: planned, elevated: true}
    - {atomic: revoke-session, target: adm.r.lee@example.com, status: planned, elevated: true}
    - {atomic: disable-user, target: adm.r.lee@example.com, status: planned, elevated: true}
