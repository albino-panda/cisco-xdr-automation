name: Confirmed RDP pivot from a workstation to an application server
description: >
  True positive. A finance workstation with a credential theft detection opens RDP sessions to an
  application server, where a malicious service is then created. Both the source and the destination are
  isolated (with approval), the account used for the movement loses its sessions, and because Entra also
  rates it high risk with anomalies it is disabled (with approval).
incident:
  id: INC-TEST-LM-0001
  title: Remote logons from ws-fin-07 to srv-app-02 followed by service creation
  severity: high
  source: Cisco Secure Endpoint
  observables:
    - {type: hostname, value: ws-fin-07}
    - {type: hostname, value: srv-app-02}
    - {type: user, value: j.doe@example.com}
    - {type: ip, value: 10.20.1.15}
    - {type: sha256, value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  context:
    protocol: RDP
    source_hosts: [ws-fin-07]
results:
  enrich-ip:
    - {ip: 10.20.1.15, verdict: unknown, sources: [], internal_sightings: 2, is_internal: true, error: ""}
  enrich-hash:
    - sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      disposition: malicious
      prevalence: 2
      hosts: [ws-fin-07, srv-app-02]
      error: ""
  investigate-host:
    - host: ws-fin-07
      connector_guid: 00000000-0000-4000-8000-000000000101
      detections:
        - {name: Credential theft tool detected, disposition: malicious}
      trajectory:
        - {event: outbound RDP, destination: srv-app-02}
      isolation_capable: true
      is_protected: false
      error: ""
    - host: srv-app-02
      connector_guid: 00000000-0000-4000-8000-000000000102
      detections:
        - {name: Service created from a remote session runs unsigned binary, disposition: malicious}
      trajectory:
        - {event: inbound RDP, source: ws-fin-07}
      isolation_capable: true
      is_protected: false
      error: ""
  investigate-user:
    - user: j.doe@example.com
      profile: {department: Finance, groups: [Finance Users]}
      risk_level: high
      signins:
        - {ip: 10.20.1.15, location: Head office, app: Windows Sign In, result: success}
      anomalies:
        - {type: new_device, detail: First remote logon to srv-app-02}
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000101, status: planned, requires_approval: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000102, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: j.doe@example.com, status: planned, requires_approval: true}
    - {atomic: disable-user, target: j.doe@example.com, status: planned, requires_approval: true}
