name: One account fans out over admin shares to many hosts
description: >
  Blast radius. An account signed in from a malicious external IP and used SMB admin shares to reach six
  operations workstations from one engineering workstation; all seven hosts carry malicious detections.
  Seven isolations exceed max_hosts_isolated (5), so every isolation becomes skipped_limit and the plan
  escalates to a human. The account is still contained: sessions are revoked and, because of the successful
  sign-in from a malicious IP (no Entra risk or anomalies are needed for this branch), it is disabled.
incident:
  id: INC-TEST-LM-0004
  title: m.ortiz@example.com authenticated to seven hosts over SMB in ten minutes
  severity: critical
  source: Cisco XDR
  observables:
    - {type: user, value: m.ortiz@example.com}
    - {type: ip, value: 203.0.113.45}
    - {type: hostname, value: ws-eng-04}
    - {type: hostname, value: ws-ops-01}
    - {type: hostname, value: ws-ops-02}
    - {type: hostname, value: ws-ops-03}
    - {type: hostname, value: ws-ops-04}
    - {type: hostname, value: ws-ops-05}
    - {type: hostname, value: ws-ops-06}
  context:
    protocol: SMB
    source_hosts: [ws-eng-04]
results:
  enrich-ip:
    - {ip: 203.0.113.45, verdict: malicious, sources: [{name: Talos, verdict: malicious}], internal_sightings: 1, is_internal: false, error: ""}
  investigate-host:
    - {host: ws-eng-04, connector_guid: 00000000-0000-4000-8000-000000000400, detections: [{name: Remote service creation burst, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-01, connector_guid: 00000000-0000-4000-8000-000000000401, detections: [{name: Service created from file dropped over SMB, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-02, connector_guid: 00000000-0000-4000-8000-000000000402, detections: [{name: Service created from file dropped over SMB, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-03, connector_guid: 00000000-0000-4000-8000-000000000403, detections: [{name: Service created from file dropped over SMB, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-04, connector_guid: 00000000-0000-4000-8000-000000000404, detections: [{name: Service created from file dropped over SMB, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-05, connector_guid: 00000000-0000-4000-8000-000000000405, detections: [{name: Service created from file dropped over SMB, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-06, connector_guid: 00000000-0000-4000-8000-000000000406, detections: [{name: Service created from file dropped over SMB, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
  investigate-user:
    - user: m.ortiz@example.com
      profile: {department: Engineering, groups: [Engineering Users]}
      risk_level: none
      signins:
        - {ip: 203.0.113.45, location: Unknown, app: VPN, result: success}
      anomalies: []
      is_protected: false
      error: ""
expect:
  escalate: true
  actions:
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000400, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000401, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000402, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000403, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000404, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000405, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000406, status: skipped_limit}
    - {atomic: revoke-session, target: m.ortiz@example.com, status: planned, requires_approval: false}
    - {atomic: disable-user, target: m.ortiz@example.com, status: planned, requires_approval: true}
