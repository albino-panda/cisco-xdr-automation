name: Tunnel client on more hosts than the isolation cap
description: >-
  Six workstations run the same unknown process that tunnels through one malicious parent domain, more than
  blast_radius.max_hosts_isolated (5). The domain block is still planned, every isolation becomes
  skipped_limit and the plan escalates to a human instead of isolating a large group automatically.
incident:
  id: INC-TEST-DNS-0004
  title: DNS tunneling to relay-ns.test from six workstations
  severity: critical
  source: Cisco XDR
  observables:
    - {type: domain, value: relay-ns.test}
  context:
    querying_hosts: 6
results:
  enrich-domain:
    - domain: relay-ns.test
      verdict: malicious
      categories: [DNS Tunneling VPN, Command and Control]
      first_seen: "2026-10-04"
      internal_queries: 61000
      error: ""
  investigate-host:
    - host: ws-0501
      connector_guid: 3f6c1a2e-0000-4000-8000-000000000501
      detections: []
      trajectory: [{event: dns_query, process: printhelper.exe, domain: a1.relay-ns.test, count: 10100}]
      isolation_capable: true
      is_protected: false
      error: ""
    - host: ws-0502
      connector_guid: 3f6c1a2e-0000-4000-8000-000000000502
      detections: []
