name: Confirmed DNS tunnel from one workstation
description: >-
  Umbrella flags thousands of unique high-entropy subdomains under one parent domain that enrichment rates
  malicious and categorises as DNS Tunneling VPN. The workstation trajectory shows an unknown process making
  the queries. The plan blocks the parent domain once and isolates the host, both waiting for approval.
incident:
  id: INC-TEST-DNS-0001
  title: DNS tunneling to cdn-update.test from a finance workstation
  severity: high
  source: Cisco Umbrella
  observables:
    - {type: domain, value: cdn-update.test}
    - {type: hostname, value: ws-fin-0142}
  targets:
    - {type: endpoint, value: ws-fin-0142}
  context:
    unique_subdomains_24h: 18432
    mean_label_entropy: 4.6
results:
  enrich-domain:
    - domain: cdn-update.test
      verdict: malicious
      categories: [DNS Tunneling VPN, Command and Control]
      first_seen: "2026-10-03"
      internal_queries: 18432
      error: ""
  investigate-host:
    - host: ws-fin-0142
      connector_guid: 3f6c1a2e-0000-4000-8000-000000000142
      detections: []
      trajectory:
        - {event: dns_query, process: updsvc.exe, domain: 4f2a9c1e7b0d.a81c.cdn-update.test, count: 18432}
        - {event: dns_query, process: chrome.exe, domain: intranet.example.com, count: 210}
      isolation_capable: true
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: block-domain, target: cdn-update.test, status: planned, requires_approval: true}
    - {atomic: isolate-endpoint, target: 3f6c1a2e-0000-4000-8000-000000000142, status: planned, requires_approval: true}
