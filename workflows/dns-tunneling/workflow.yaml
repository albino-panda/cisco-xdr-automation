schema_version: 1
id: dns-tunneling
name: DNS tunneling
status: specification
description: Respond to data or command traffic hidden in DNS queries.
default_severity: high
mitre_attack:
- id: T1071.004
  name: 'Application Layer Protocol: DNS'
- id: T1572
  name: Protocol Tunneling
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1071.004
    - T1572
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Umbrella DNS tunneling category hit
- High-entropy or high-volume subdomain queries to one parent domain
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
  on_error: stop
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
  note: Enrich the tunneling parent domain named by the detection (for example cdn-update.test), not each
    unique high-entropy subdomain, so one parent gives one record and at most one block.
  on_error: continue
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
  note: Every host that queried the parent domain, including clients found in internal resolver logs (Splunk)
    when Umbrella only sees the forwarding resolver. The trajectory must list DNS events with the querying
    process and the queried domain.
  on_error: continue
- id: build_plan
  phase: decide
  note: Build the containment plan from enrichment verdicts, investigation results and guardrails. Allow-listed and internal targets are skipped; protected targets and targets over a blast-radius cap stay in the plan with ELEVATED approval and a warning, never dropped.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
  on_error: escalate
- id: block_domain
  phase: contain
  atomic: block-domain
  when: The parent domain is a confirmed tunnel. Enrichment rates it malicious, or rates it suspicious or
    unknown while Umbrella puts it in the DNS Tunneling VPN category with at least 1000 internal queries in
    the lookback window. Clean domains and failed enrichments are never blocked.
  requires_approval: true
  on_error: escalate
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: The host can be isolated and its trajectory shows a process that queried a confirmed tunnel parent
    domain or one of its subdomains. The process is not an approved security or VPN tool (guardrails
    allowlist.approved_dns_tools) and not a DNS server forwarding client queries (dns.exe, named, unbound,
    dnsmasq).
  requires_approval: true
  on_error: escalate
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results and the rollback for every action.
  on_error: continue
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: continue
plan:
- id: block_tunnel_parent_domain
  description: Block the tunneling parent domain when enrichment rates it malicious, or rates it suspicious
    or unknown (new tunnel domains often have no reputation yet) while Umbrella puts it in the DNS Tunneling
    VPN category and internal queries reach 1000 in the lookback window. Clean verdicts, such as a security
    or VPN product that legitimately uses DNS lookups, are never blocked.
  atomic: block-domain
  for_each: "results['enrich-domain']"
  when: "not get(item, 'error', '') and (item.verdict == 'malicious' or (item.verdict in ['suspicious', 'unknown']
    and 'DNS Tunneling VPN' in item.categories and item.internal_queries >= 1000))"
  target: "lower(item.domain)"
  args:
    expires_hours: "get(guardrails.expiry_hours, 'block-domain', 720)"
- id: isolate_tunnel_client_hosts
  description: Isolate a host whose trajectory shows a process querying a confirmed tunnel parent domain (same
    test as block_tunnel_parent_domain) or one of its subdomains, when that process is neither an approved
    security or VPN tool (guardrails allowlist.approved_dns_tools) nor a DNS server process that only forwards
    client queries. Hosts that cannot be isolated are left to the analyst.
  atomic: isolate-endpoint
  for_each: "results['investigate-host']"
  when: "item.isolation_capable and not get(item, 'error', '') and any(get(e, 'process', '') != '' and lower(get(e,
    'process', '')) not in [lower(p) for p in get(guardrails.allowlist, 'approved_dns_tools', []) + ['dns.exe',
    'named', 'unbound', 'dnsmasq']] and any(not get(d, 'error', '') and (d.verdict == 'malicious' or (d.verdict
    in ['suspicious', 'unknown'] and 'DNS Tunneling VPN' in d.categories and d.internal_queries >= 1000)) and
    (lower(get(e, 'domain', '')) == lower(d.domain) or endswith(lower(get(e, 'domain', '')), '.' + lower(d.domain)))
    for d in results['enrich-domain']) for e in item.trajectory)"
  target: "item.connector_guid"
  args:
    reason: "'DNS tunneling (T1071.004, T1572): unapproved process queried a tunnel parent domain. Incident '
      + get(incident, 'id', 'unknown') + ': ' + incident.title"
templates:
  approval: |
    {workflow.name}: containment approval for {incident.id} ({incident.severity})
    ELEVATED approval required for (protected assets and actions over a blast-radius cap; a lead must approve): {plan.elevated}
    {incident.title}

    Planned actions:
    {plan.actions}

    Skipped by guardrails: {plan.skipped}
    Escalated (blast radius exceeded): {plan.escalate} {plan.reasons}
    Dry run: {workflow.dry_run}

    Approving blocks the listed tunnel parent domains in Umbrella (and Cloudflare Gateway when enabled)
    with a release-review reminder (never an automatic release), and network-isolates the listed hosts in Secure Endpoint while keeping the
    management channel open. Both are reversible; rollback steps go into the incident note.
    Before approving, check that no listed domain or process belongs to a sanctioned security or VPN product.
  incident_note: |
    ## {workflow.name} run for {incident.id}
    Dry run: {workflow.dry_run}. Approver: {approver.name} at {approver.time}.

    ### Enrichment and investigation
    {plan.enrichment_summary}
    Querying processes per host: {plan.querying_processes}

    ### Containment results
    {plan.results}
    Skipped by guardrails: {plan.skipped}
    Escalated: {plan.escalate} {plan.reasons}

    ### Rollback
    - block-domain: remove each domain from the Umbrella automation destination list (and the Cloudflare Gateway list when used): {plan.blocked_domains}. Blocks also expire on their own (guardrails expiry_hours.block-domain, default 720 hours).
    - isolate-endpoint: stop isolation for each connector GUID in Secure Endpoint (DELETE /v1/computers/<connector_guid>/isolation, not yet verified against vendor documentation): {plan.isolated_hosts}. The unlock code stays in the Secure Endpoint console and is not copied here.

    ### Analyst follow-up
    - [ ] Identify and remove the querying process on each isolated host.
    - [ ] Search internal resolver logs for other clients querying the blocked parent domains.
    - [ ] If a sanctioned security or VPN product was involved, add its domain to allowlist.domains and its process to allowlist.approved_dns_tools, then roll back.
  ticket_title: "[{incident.severity}] DNS tunneling: {incident.title} ({incident.id})"
  ticket_body: |
    XDR incident: {incident.id} - {incident.title}
    Severity: {incident.severity}. Source: {incident.source}. Dry run: {workflow.dry_run}.

    Findings:
    {plan.enrichment_summary}
    Querying processes per host: {plan.querying_processes}

    Containment (approved by {approver.name}):
    {plan.results}
    Skipped by guardrails: {plan.skipped}
    Escalated to a human: {plan.escalate} {plan.reasons}

    Rollback steps are in the XDR incident note.
  notification: "{workflow.name} | {incident.severity} | {incident.id}: {incident.title}. Planned {plan.planned_count},
    skipped {plan.skipped_count}, escalated {plan.escalate}, dry run {workflow.dry_run}. Ticket {ticket.id} {ticket.url}"
integrations:
- cisco-xdr
- umbrella
- secure-endpoint
- meraki
- splunk
- cloudflare
- servicenow
related_workflows:
- c2
- exfiltration
