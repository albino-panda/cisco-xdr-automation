schema_version: 1
id: mail-bombing
name: Mail bombing
status: specification
description: Respond to an email or subscription bombing burst, clear the flood and watch for the follow-up
  social engineering it often hides.
default_severity: high
mitre_attack:
- id: T1499
  name: Endpoint Denial of Service
- id: T1656
  name: Impersonation
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1499
    - T1656
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Incident raised by the cisco-xdr-mailbomb-detector project
- Sudden volume spike of neutral or graymail messages to one recipient
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident. For detector incidents
    the webhook payload (event_type, recipient, is_escalation, metrics) is carried in incident.context.
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
    Without guardrails no containment can be planned safely, so the run stops.
  on_error: stop
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
  note: Top sender domains of the burst, for the note and the approver. Not used to gate containment.
  on_error: continue
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
  note: The bombed recipient. Identity events the flood may hide (password reset or change, MFA prompt,
    MFA fatigue, MFA method registration) are reported in anomalies, each with a type and a time.
  on_error: continue
- id: build_plan
  phase: decide
  note: Evaluate the plan rules below against the detector metrics, enrichment and investigation results,
    then apply the guardrails. Protected targets stay in the plan with a skipped_* status so the approver
    sees them.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
  on_error: escalate
- id: quarantine_email
  phase: contain
  atomic: quarantine-email
  when: Detector incident (event_type mailbomb.detection) whose burst has at least 10 unique sender domains
    and at least half of its messages with a neutral or graymail verdict. The search is limited to the
    recipient, incoming mail since the detection window start and the verdicts neutral and graymail;
    spam and malicious messages are left to Secure Email policies. Capped at max_messages_quarantined.
  requires_approval: true
  on_error: escalate
- id: revoke_session
  phase: contain
  atomic: revoke-session
  when: The bombed recipient has an investigate-user anomaly of type password_reset, password_change,
    mfa_prompt, mfa_fatigue or mfa_method_registered at or after the detection window start. Protected
    users (break-glass, Domain Admins) are skipped by the guardrails.
  requires_approval: false
  on_error: escalate
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results and the rollback for every action.
  on_error: continue
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: continue
plan:
- id: quarantine_burst_messages
  description: Move the subscription-bomb burst out of the recipient's inbox. Only detector incidents with
    real sender diversity (at least 10 domains, the detector's medium floor) and a clean ratio of at least
    50 percent qualify; low-diversity floods and spam storms go to an analyst. The search matches only
    neutral and graymail messages, as in the detector's ContainBurst workflow. The search argument is a
    list of key/value pairs that the build step turns into the atomic's search object.
  atomic: quarantine-email
  when: "get(incident.context, 'event_type', '') == 'mailbomb.detection' and incident.context.metrics.unique_sender_domains >= 10 and incident.context.metrics.neutral_count + incident.context.metrics.graymail_count > 0 and (incident.context.metrics.neutral_count + incident.context.metrics.graymail_count) * 2 >= incident.context.metrics.total_messages"
  target: "incident.context.recipient"
  args:
    search: "[['recipient', incident.context.recipient], ['direction', 'incoming'], ['verdicts', ['neutral', 'graymail']], ['received_after', incident.context.metrics.window_start]]"
    max_messages: "guardrails.blast_radius.max_messages_quarantined"
- id: revoke_after_buried_identity_event
  description: Revoke the recipient's sessions when a password reset or change, or an MFA prompt, fatigue
    pattern or new MFA method, happened at or after the start of the detection window, i.e. inside the
    flood. Without detector metrics nothing is revoked automatically.
  atomic: revoke-session
  for_each: "results['investigate-user']"
  when: "lower(item.user) == lower(get(incident.context, 'recipient', '')) and any(get(a, 'type', '') in ['password_reset', 'password_change', 'mfa_prompt', 'mfa_fatigue', 'mfa_method_registered'] and get(a, 'time', '') >= get(get(incident.context, 'metrics', None), 'window_start', '9999') for a in item.anomalies)"
  target: "item.user"
templates:
  approval: |
    Approve mail bombing containment for {incident.id}: {incident.title} (severity {incident.severity}).
    Workflow {workflow.name}, dry run {plan.dry_run}.
    Planned actions:
    {plan.actions}
    Skipped by guardrails:
    {plan.skipped}
    Escalation: {plan.escalate} {plan.reasons}
    Quarantine moves only neutral and graymail messages to the recipient since the detection window start.
    Before approving, confirm the hidden-message search is done (password reset, new sign-in, order or
    payment confirmations): quarantined messages stay recoverable, but the user will no longer see them.
    Session revocation cannot be undone; the user signs in again.
  incident_note: |
    Workflow {workflow.name} ({workflow.id}) ran for {incident.id}. Dry run: {plan.dry_run}.
    Enrichment summary:
    {plan.enrichment_summary}
    Plan and results:
    {plan.action_results}
    Skipped: {plan.skipped}
    Escalation: {plan.escalate} {plan.reasons}
    Approval: {approver.decision} by {approver.name} at {approver.time}.
    Rollback:
    - quarantine-email: release the quarantined messages back to the inbox in Secure Email Threat Defense
      (Move or Reclassify Messages to the inbox folder; API not yet verified against vendor docs).
    - revoke-session: not reversible; the user signs in again. If revoked in error, tell the user and
      the help desk so the extra sign-in prompt is expected.
    Warning: mail bombing is often followed by fake IT-support calls, chats or emails that push a
    remote-access tool. Tell the user and the help desk that IT will not cold-call about the flood.
    Route any remote-access tool seen on the user's device to the rmm workflow and any suspicious
    sign-in to the account-takeover workflow.
    Ticket: {ticket.id} {ticket.url}
  ticket_title: "[Mail bombing] {incident.title} ({incident.id})"
  ticket_body: |
    Email or subscription bombing for {incident.id}: {incident.title}.
    Severity: {incident.severity}. Workflow: {workflow.name}. Dry run: {plan.dry_run}.
    Enrichment:
    {plan.enrichment_summary}
    Containment actions and status:
    {plan.action_results}
    Skipped by guardrails: {plan.skipped}
    Escalation required: {plan.escalate} {plan.reasons}
    Approved by: {approver.name}
    Help desk action: contact the user through a known channel. Warn them that callers or chat messages
    claiming to be IT support and offering to fix the spam are a known follow-up to mail bombing. IT will
    never ask them to install a remote-access tool, share their screen or read out an MFA code. Report
    any such contact to the SOC. Do not bulk-delete the flood until the SOC confirms the hidden-message
    search is done.
    Rollback steps are in the XDR incident note.
  notification: "Mail bombing {incident.severity}: {incident.title} ({incident.id}). {plan.summary} Escalate: {plan.escalate}. Warn user and help desk about fake IT-support contact. Ticket {ticket.id} {ticket.url}"
integrations:
- cisco-xdr
- umbrella
- microsoft-entra
- splunk
- secure-email
- servicenow
related_workflows:
- rmm
- account-takeover
