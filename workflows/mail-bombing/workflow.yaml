schema_version: 1
id: mail-bombing
name: Mail bombing
status: specification
description: Respond to an email or subscription bombing burst, clear the flood and watch for the follow-up
  social engineering it often hides.
default_severity: high
mitre_attack:
- id: T1499
  name: Endpoint Denial of Service
- id: T1656
  name: Impersonation
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1499
    - T1656
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Incident raised by the cisco-xdr-mailbomb-detector project
- Sudden volume spike of neutral or graymail messages to one recipient
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
- id: build_plan
  phase: decide
  note: Build the containment plan from enrichment verdicts, investigation results and guardrails. Drop
    any target that is protected, allow-listed or over the blast-radius limit.
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
- id: quarantine_email
  phase: contain
  atomic: quarantine-email
  when: Burst messages with neutral or graymail verdicts only.
  requires_approval: true
- id: revoke_session
  phase: contain
  atomic: revoke-session
  when: When a password change or MFA prompt was buried in the flood.
  requires_approval: false
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals and per-action results.
- id: create_ticket
  phase: record
  atomic: create-ticket
- id: notify_soc
  phase: notify
  atomic: notify-soc
integrations:
- cisco-xdr
- umbrella
- microsoft-entra
- splunk
- secure-email
- servicenow
related_workflows:
- rmm
- account-takeover
