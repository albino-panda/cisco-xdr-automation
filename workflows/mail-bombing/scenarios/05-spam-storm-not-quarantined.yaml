name: Spam and malicious storm stays out of the burst quarantine
description: >
  The detector fires on 90 messages from 30 domains, but most of them carry spam or malicious verdicts
  (clean ratio 17 percent). This is a spam or phishing storm, not a subscription bomb, so the
  neutral/graymail quarantine is not planned: Secure Email policies handle malicious mail and the
  analyst follows the phishing workflow. No identity event was buried, so nothing is revoked.
incident:
  id: INC-TEST-MB-0005
  title: "[HIGH] Possible email bombing of sales-desk@example.com: 90 msgs / 30 domains in 5 min"
  severity: high
  source: cisco-xdr-mailbomb-detector
  observables:
    - {type: email, value: sales-desk@example.com}
    - {type: domain, value: invoice-portal.example}
    - {type: ip, value: 192.0.2.15}
  targets:
    - {type: email, value: sales-desk@example.com}
  context:
    event_type: mailbomb.detection
    schema_version: 1
    detection_id: mailbomb-0000000000000005
    detected_at: "2026-10-05T16:45:00.000Z"
    risk_score: 58
    is_escalation: false
    matched_rules: ["threshold:high", "threshold:medium"]
    recipient: sales-desk@example.com
    recipient_domain: example.com
    xdr_incident_id: null
    metrics:
      window_start: "2026-10-05T16:40:00.000Z"
      window_end: "2026-10-05T16:45:00.000Z"
      window_minutes: 5.0
      total_messages: 90
      unique_senders: 85
      unique_sender_domains: 30
      unique_source_ips: 27
      unique_subjects: 12
      neutral_count: 10
      graymail_count: 5
      spam_count: 60
      malicious_count: 15
      messages_per_minute: 18.0
      acceleration: 1.1
results:
  enrich-domain:
    - {domain: invoice-portal.example, verdict: malicious, categories: [Phishing], first_seen: "2026-10-04", internal_queries: 1}
  investigate-user:
    - user: sales-desk@example.com
      profile: {department: Sales, manager: sales-lead@example.com, privileged_roles: [], groups: [Sales]}
      risk_level: low
      signins:
        - {ip: 203.0.113.10, location: Office, app: Outlook, result: success, time: "2026-10-05T15:58:00Z"}
      anomalies: []
      is_protected: false
      error: ""
expect:
  escalate: false
  actions: []
