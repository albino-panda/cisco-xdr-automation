  id: INC-TEST-MB-0004
  title: "[HIGH] Possible email bombing of breakglass-01@example.com: 75 msgs / 28 domains in 5 min"
  severity: high
  source: cisco-xdr-mailbomb-detector
  observables:
    - {type: email, value: breakglass-01@example.com}
    - {type: domain, value: promo-signup.test}
    - {type: ip, value: 203.0.113.60}
  targets:
    - {type: email, value: breakglass-01@example.com}
  context:
    event_type: mailbomb.detection
    schema_version: 1
    detection_id: mailbomb-0000000000000004
    detected_at: "2026-10-05T02:10:00.000Z"
    risk_score: 63
    is_escalation: false
    matched_rules: ["threshold:high", "threshold:medium"]
    recipient: breakglass-01@example.com
    recipient_domain: example.com
    xdr_incident_id: null
    metrics:
      window_start: "2026-10-05T02:05:00.000Z"
