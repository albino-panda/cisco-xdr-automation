name: Break-glass mailbox bombed with an MFA fatigue pattern
description: >-
  A break-glass account's mailbox is flooded and repeated MFA pushes appear inside the window. The
  revoke rule fires and the protected-users guardrail keeps the action planned with elevated: true,
  so cutting emergency access needs ELEVATED approval by a lead. The reversible, approval-gated
  quarantine of neutral and graymail messages is planned behind normal approval.
