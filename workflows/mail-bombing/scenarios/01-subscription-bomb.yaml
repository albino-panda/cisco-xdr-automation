name: Subscription bomb against one finance mailbox
description: >
  Classic subscription bomb as raised by cisco-xdr-mailbomb-detector: 120 messages from 45 sender
  domains in five minutes, almost all neutral or graymail. The burst is quarantined behind approval.
  The recipient changed their password the day before the flood, which is outside the detection
  window, so sessions are not revoked.
incident:
  id: INC-TEST-MB-0001
  title: "[CRITICAL] Possible email bombing of finance-analyst@example.com: 120 msgs / 45 domains in 5 min"
  severity: critical
  source: cisco-xdr-mailbomb-detector
  observables:
    - {type: email, value: finance-analyst@example.com}
    - {type: domain, value: signup-alerts.example}
    - {type: domain, value: newsletter-hub.test}
    - {type: ip, value: 198.51.100.1}
    - {type: ip, value: 198.51.100.2}
  targets:
    - {type: email, value: finance-analyst@example.com}
  context:
    event_type: mailbomb.detection
    schema_version: 1
    detection_id: mailbomb-0000000000000001
    detected_at: "2026-10-05T09:05:00.000Z"
    risk_score: 80
    is_escalation: false
    matched_rules: ["threshold:critical", "threshold:high", "threshold:medium"]
    recipient: finance-analyst@example.com
    recipient_domain: example.com
    xdr_incident_id: null
    metrics:
      window_start: "2026-10-05T09:00:00.000Z"
      window_end: "2026-10-05T09:05:00.000Z"
      window_minutes: 5.0
      total_messages: 120
      unique_senders: 103
      unique_sender_domains: 45
      unique_source_ips: 35
      unique_subjects: 120
      neutral_count: 100
      graymail_count: 7
      spam_count: 13
      malicious_count: 0
      messages_per_minute: 24.0
      acceleration: 1.2
results:
  enrich-domain:
    - {domain: signup-alerts.example, verdict: unknown, categories: [Newsletters], first_seen: "2025-03-02", internal_queries: 0}
    - {domain: newsletter-hub.test, verdict: clean, categories: [Marketing], first_seen: "2019-06-11", internal_queries: 2}
  investigate-user:
    - user: finance-analyst@example.com
      profile: {department: Finance, manager: finance-lead@example.com, privileged_roles: [], groups: [Finance]}
      risk_level: low
      signins:
        - {ip: 203.0.113.10, location: Office, app: Outlook, result: success, time: "2026-10-05T08:12:00Z"}
      anomalies:
        - {type: password_change, time: "2026-10-04T16:40:00Z", detail: Scheduled self-service change the day before}
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: quarantine-email, target: finance-analyst@example.com, status: planned, requires_approval: true}
