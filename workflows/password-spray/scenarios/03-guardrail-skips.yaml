name: Spray hits a break-glass account and a Domain Admin
description: >
  Guardrails. The spray came from one external IP and from an internal workstation. The external IP is
  blocked. The block-ip guardrail drops the internal IP; internal hosts are contained through the
  lateral-movement workflow, not blocked at the perimeter. The break-glass account and a Domain Admins
  member both had a successful sign-in from a spray source, so the rules select them, but the protected
  user list and protected group keep every action on them out of automation for a human to handle.
incident:
  id: INC-TEST-PS-0003
  title: Password spray with successful sign-ins on privileged accounts
  severity: high
  source: Microsoft Entra ID Protection
  observables:
    - {type: ip, value: 203.0.113.30}
    - {type: ip, value: 10.20.4.17}
    - {type: user, value: breakglass-01@example.com}
    - {type: user, value: it-admin@example.com}
  context: {detection: Password spray, failed_signins: 118, targeted_accounts: 22}
results:
  enrich-ip:
    - {ip: 203.0.113.30, verdict: malicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
    - {ip: 10.20.4.17, verdict: suspicious, sources: [], internal_sightings: 0, is_internal: true, error: ""}
  investigate-user:
    - user: breakglass-01@example.com
      risk_level: high
      is_protected: true
      profile: {department: IT, groups: [Emergency Access]}
      signins:
        - {ip: 203.0.113.30, result: success, app: Azure Portal, location: unknown}
      anomalies:
        - {type: new_device, detail: Unregistered device}
    - user: it-admin@example.com
      risk_level: low
      is_protected: false
      profile: {department: IT, groups: [Domain Admins]}
      signins:
        - {ip: 10.20.4.17, result: success, app: Azure Portal, location: office}
      anomalies: []
expect:
  escalate: false
  actions:
    - {atomic: block-ip, target: 203.0.113.30, status: planned, requires_approval: true}
    - {atomic: block-ip, target: 10.20.4.17, status: skipped_internal, requires_approval: true}
    - {atomic: revoke-session, target: breakglass-01@example.com, status: skipped_protected, requires_approval: false}
    - {atomic: revoke-session, target: it-admin@example.com, status: skipped_protected, requires_approval: false}
    - {atomic: disable-user, target: breakglass-01@example.com, status: skipped_protected, requires_approval: true}
