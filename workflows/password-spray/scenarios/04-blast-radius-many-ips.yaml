    - {type: ip, value: 203.0.113.108}
    - {type: ip, value: 203.0.113.109}
    - {type: ip, value: 203.0.113.110}
    - {type: ip, value: 203.0.113.111}
    - {type: ip, value: 203.0.113.112}
    - {type: user, value: k.nguyen@example.com}
    - {type: user, value: l.martin@example.com}
  context: {detection: Password spray, failed_signins: 960, targeted_accounts: 140}
