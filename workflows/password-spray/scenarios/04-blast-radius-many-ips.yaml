name: Distributed spray from many source IPs
description: >-
  Blast radius. A distributed spray from twelve source IPs exceeds the indicator cap, which this
  file lowers to 10 to stay readable (the default is 50). Every block-ip action stays planned with
  elevated: true and the plan escalates to a lead. Session revocation has no cap, so revocation for
  the one account with a successful sign-in from a spray source is planned behind normal approval.
incident:
  id: INC-TEST-PS-0004
  title: Distributed password spray from residential proxy addresses
  severity: medium
  source: Microsoft Entra ID Protection
  observables:
    - {type: ip, value: 203.0.113.101}
    - {type: ip, value: 203.0.113.102}
    - {type: ip, value: 203.0.113.103}
    - {type: ip, value: 203.0.113.104}
