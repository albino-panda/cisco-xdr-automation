name: Failed sign-ins from the corporate VPN egress after a password rotation
description: >
  Benign. After a forced password rotation, mail clients with cached old passwords fail sign-in through
  the corporate VPN egress, and the detection reads it as a spray. Enrichment says the IP is clean and
  hundreds of internal hosts talk to it, so it is treated as shared infrastructure and not blocked.
  No account had a successful sign-in from it, so no sessions are revoked. The plan is empty.
incident:
  id: INC-TEST-PS-0002
  title: Possible password spray from 198.51.100.40
  severity: low
  source: Splunk
  observables:
    - {type: ip, value: 198.51.100.40}
    - {type: user, value: p.ito@example.com}
    - {type: user, value: d.ruiz@example.com}
  context: {detection: Many failed sign-ins from one source, failed_signins: 63, note: Password rotation the day before}
results:
  enrich-ip:
    - {ip: 198.51.100.40, verdict: clean, sources: [], internal_sightings: 214, is_internal: false, error: ""}
  investigate-user:
    - user: p.ito@example.com
      risk_level: none
      is_protected: false
      signins:
        - {ip: 198.51.100.40, result: failure, app: Office 365 Exchange Online, location: office}
        - {ip: 198.51.100.40, result: failure, app: Office 365 Exchange Online, location: office}
      anomalies: []
    - user: d.ruiz@example.com
      risk_level: none
      is_protected: false
      signins:
        - {ip: 198.51.100.40, result: failure, app: Office 365 Exchange Online, location: office}
      anomalies: []
expect:
  escalate: false
  actions: []
