schema_version: 1
id: password-spray
name: Password spray
status: specification
description: Block spray sources and protect any accounts where the spray succeeded.
default_severity: medium
mitre_attack:
- id: T1110.003
  name: 'Brute Force: Password Spraying'
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1110.003
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Many failed sign-ins across many accounts from few sources
- Entra password spray risk detection
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident. The incident's ip
    observables are the spray sources; its user observables and targets are the sprayed accounts.
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
  on_error: stop
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
  on_error: continue
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
  on_error: continue
- id: build_plan
  phase: decide
  note: Build the containment plan from the plan rules below, enrichment verdicts, investigation results
    and guardrails. Allow-listed and internal targets are skipped; protected targets and targets over a blast-radius cap stay in the plan with ELEVATED approval and a warning, never dropped.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
  on_error: escalate
- id: block_ip
  phase: contain
  atomic: block-ip
  when: Spray source IP with an enrichment verdict other than clean, no internal hosts talking to it (not
    shared infrastructure) and no enrichment error.
  requires_approval: true
  on_error: continue
  note: A failed perimeter block must not hold up session revocation for accounts the spray already
    compromised. The failure is recorded in the incident note and ticket.
- id: revoke_session
  phase: contain
  atomic: revoke-session
  when: Account with at least one successful sign-in whose IP is a spray source.
  requires_approval: true
  on_error: escalate
- id: disable_user
  phase: contain
  atomic: disable-user
  when: Account with a successful sign-in from a spray source and suspicious follow-on activity (impossible
    travel, new device or MFA fatigue anomaly, or Entra risk level high).
  requires_approval: true
  on_error: escalate
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results and rollback steps.
  on_error: continue
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: continue
plan:
- id: block_spray_sources
  description: Spray source IPs that are not shared infrastructure. A clean verdict or any internal host talking
    to the IP marks it as possibly shared (cloud egress, partner proxy, CDN) and leaves it to the analyst.
    Internal and allow-listed ranges are dropped by the block-ip guardrail.
  atomic: block-ip
  for_each: "results['enrich-ip']"
  when: "item.verdict != 'clean' and item.internal_sightings == 0 and not get(item, 'error', '')"
  target: item.ip
  args:
    expires_hours: "get(get(guardrails, 'expiry_hours', None), 'block-ip', 168)"
- id: revoke_sprayed_sessions
  description: Accounts with at least one successful sign-in whose source IP is one of the incident's spray
    source IPs. Failed attempts alone never revoke sessions.
  atomic: revoke-session
  for_each: "results['investigate-user']"
  when: "any(s.result == 'success' and s.ip in [o.value for o in get(incident, 'observables', []) if o.type
    == 'ip'] for s in item.signins)"
  target: item.user
- id: disable_compromised_accounts
  description: Accounts with a successful sign-in from a spray source followed by suspicious activity, meaning
    an impossible travel, new device or MFA fatigue anomaly, or Entra risk level high. An unfamiliar location
    alone does not count because every spray success from an external IP has one.
  atomic: disable-user
  for_each: "results['investigate-user']"
  when: "any(s.result == 'success' and s.ip in [o.value for o in get(incident, 'observables', []) if o.type
    == 'ip'] for s in item.signins) and (lower(item.risk_level) == 'high' or any(a.type in ['impossible_travel',
    'new_device', 'mfa_fatigue'] for a in item.anomalies))"
  target: item.user
  args:
    reason: "'Password spray succeeded and was followed by suspicious activity: ' + incident.title"
templates:
  approval: |
    {workflow.name}: containment approval for {incident.id} ({incident.severity})
    ELEVATED approval required for (protected assets and actions over a blast-radius cap; a lead must approve): {plan.elevated}
    {incident.title}

    Planned actions:
    {plan.actions}

    Skipped by guardrails: {plan.skipped}
    Escalated (blast radius exceeded): {plan.escalate} {plan.reasons}
    Dry run: {workflow.dry_run}

    Approving blocks the listed spray source IPs at the Meraki MX and Cloudflare edge for
    {plan.block_ip_expiry_hours} hours and disables the listed accounts in Entra ID. Session
    revocation for accounts with a successful sign-in from a spray source does not need approval
    and is not reversible; the user signs in again. Rollback steps go into the incident note.
  incident_note: |
    ## {workflow.name} run for {incident.id}
    Dry run: {workflow.dry_run}. Approver: {approver.name} ({approver.decision}) at {approver.time}.

    ### Spray sources (enrich-ip)
    {plan.enrichment_summary}

    ### Targeted accounts (investigate-user)
    {plan.investigation_summary}

    ### Containment results
    {plan.results}
    Skipped by guardrails: {plan.skipped}
    Escalated: {plan.escalate} {plan.reasons}

    ### Rollback
    - block-ip: remove each IP from the Meraki MX rule set and the Cloudflare IP list. Blocks also
      expire on their own after {plan.block_ip_expiry_hours} hours.
    - revoke-session: not reversible. The user signs in again; confirm the password was reset first.
    - disable-user: after the password reset and MFA re-registration, set accountEnabled back to true
      in Entra ID for each disabled account.

    ### Follow-up
    - [ ] Password reset for every account with a successful sign-in from a spray source
    - [ ] Hand each such account to the account-takeover workflow
    - [ ] Review Conditional Access and smart lockout coverage for the targeted apps
  ticket_title: "[{incident.severity}] Password spray: {incident.title} ({incident.id})"
  ticket_body: |
    XDR incident: {incident.id} - {incident.title}
    Severity: {incident.severity}. Source: {incident.source}. Dry run: {workflow.dry_run}.

    Spray sources:
    {plan.enrichment_summary}

    Targeted accounts:
    {plan.investigation_summary}

    Containment (approved by {approver.name}):
    {plan.results}
    Skipped by guardrails: {plan.skipped}
    Escalated to a human: {plan.escalate} {plan.reasons}

    Next steps:
    - [ ] Reset passwords for accounts with a successful sign-in from a spray source
    - [ ] Run account-takeover for each of those accounts
    - [ ] Confirm IP blocks expire or are removed after {plan.block_ip_expiry_hours} hours

    Rollback is in the XDR incident note.
  notification: "{workflow.name} | {incident.severity} | {incident.id} {incident.title} | planned: {plan.planned_count},
    skipped: {plan.skipped_count}, escalate: {plan.escalate} | ticket {ticket.id} {ticket.url}"
integrations:
- cisco-xdr
- umbrella
- splunk
- microsoft-entra
- meraki
- cloudflare
- servicenow
related_workflows:
- account-takeover
- cloud-compromise
