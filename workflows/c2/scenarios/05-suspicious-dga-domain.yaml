name: Suspicious DGA-style domains without a confirmed malicious indicator
description: >
  C2 edge case. Two newly registered, algorithm-looking domains come back suspicious, not malicious.
  The one Umbrella also categorises as Command and Control is blocked with a short 168 hour expiry.
  The one that is only newly seen is not blocked. The host has only a suspicious detection and no
  indicator in the incident is malicious, so it is not isolated and the analyst decides.
incident:
  id: INC-TEST-C2-0005
  title: DGA-like DNS lookups from wks-0412
  severity: medium
  source: Cisco Umbrella
  observables:
    - {type: domain, value: qx7kz2vbn4.test}
    - {type: domain, value: mpl0r8tyw1.test}
  targets:
    - {type: endpoint, value: wks-0412}
  context: {}
results:
  enrich-domain:
    - {domain: qx7kz2vbn4.test, verdict: suspicious, categories: [Command and Control, Newly Seen Domains], first_seen: "2026-10-05", internal_queries: 14}
    - {domain: mpl0r8tyw1.test, verdict: suspicious, categories: [Newly Seen Domains], first_seen: "2026-10-05", internal_queries: 2}
  investigate-host:
    - host: wks-0412
      connector_guid: 0f3c2a10-0000-4000-8000-000000000412
      detections: [{name: Generic.Suspicious.Network, disposition: suspicious}]
      trajectory: []
      isolation_capable: true
      is_protected: false
expect:
  escalate: false
  actions:
    - {atomic: block-domain, target: qx7kz2vbn4.test, status: planned, requires_approval: true}
