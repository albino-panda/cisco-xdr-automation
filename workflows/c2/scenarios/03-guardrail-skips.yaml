name: C2 indicators that hit guardrails
description: >
  Guardrails. A domain controller beacons to beacon-relay.test through a compromised internal relay.
  Enrichment also returns a malicious verdict for an own-domain host and for the internal relay IP.
  The external domain is planned. The allow-listed domain, the internal IP and the protected domain
  controller stay in the plan as skipped so the approver sees them, and nothing changes for them.
incident:
  id: INC-TEST-C2-0003
  title: Beaconing to beacon-relay.test through an internal relay
  severity: high
  source: Cisco XDR
  observables:
    - {type: domain, value: beacon-relay.test}
    - {type: domain, value: updates.example.com}
    - {type: ip, value: 10.20.30.40}
  targets:
    - {type: endpoint, value: dc-02}
  context: {}
results:
  enrich-domain:
    - {domain: beacon-relay.test, verdict: malicious, categories: [Command and Control], first_seen: "2026-10-04", internal_queries: 37}
    - {domain: updates.example.com, verdict: malicious, categories: [Command and Control], first_seen: "2015-01-01", internal_queries: 2200}
  enrich-ip:
    - {ip: 10.20.30.40, verdict: malicious, sources: [], internal_sightings: 3, is_internal: true}
  investigate-host:
    - host: dc-02
      connector_guid: 0f3c2a10-0000-4000-8000-0000000d0002
      detections: [{name: W32.C2.Beacon, disposition: malicious}]
      trajectory: []
      isolation_capable: true
      is_protected: true
expect:
  escalate: false
  actions:
    - {atomic: block-domain, target: beacon-relay.test, status: planned, requires_approval: true}
    - {atomic: block-domain, target: updates.example.com, status: skipped_allowlisted}
    - {atomic: block-ip, target: 10.20.30.40, status: skipped_internal}
    - {atomic: isolate-endpoint, target: 0f3c2a10-0000-4000-8000-0000000d0002, status: skipped_protected}
