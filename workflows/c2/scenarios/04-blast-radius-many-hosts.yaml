name: Six hosts beaconing to the same C2 domain
description: >
  Blast radius. Internal DNS shows six workstations beaconing to the same C2 domain, each with a
  malicious detection. Six isolations exceed max_hosts_isolated (5), so every isolation becomes
  skipped_limit and the run escalates to a human. The domain and IP blocks fall under a separate cap
  and stay planned, which cuts the channel for all six hosts while a human decides on isolation.
incident:
  id: INC-TEST-C2-0004
  title: Multiple workstations beaconing to sync-api.test
  severity: critical
  source: Cisco Umbrella
  observables:
    - {type: domain, value: sync-api.test}
    - {type: ip, value: 192.0.2.66}
  targets:
    - {type: endpoint, value: wks-0301}
    - {type: endpoint, value: wks-0302}
    - {type: endpoint, value: wks-0303}
    - {type: endpoint, value: wks-0304}
    - {type: endpoint, value: wks-0305}
    - {type: endpoint, value: wks-0306}
  context: {}
results:
  enrich-domain:
    - {domain: sync-api.test, verdict: malicious, categories: [Command and Control], first_seen: "2026-10-03", internal_queries: 1880}
  enrich-ip:
    - {ip: 192.0.2.66, verdict: malicious, sources: [], internal_sightings: 6, is_internal: false}
  investigate-host:
    - {host: wks-0301, connector_guid: 0f3c2a10-0000-4000-8000-000000000301, detections: [{name: W32.C2.Beacon, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false}
    - {host: wks-0302, connector_guid: 0f3c2a10-0000-4000-8000-000000000302, detections: [{name: W32.C2.Beacon, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false}
    - {host: wks-0303, connector_guid: 0f3c2a10-0000-4000-8000-000000000303, detections: [{name: W32.C2.Beacon, disposition: malicious}], trajectory: [], isolation_capable: true, is_protected: false}
