schema_version: 1
id: c2
name: Command and control
status: specification
description: Cut off a host beaconing to attacker infrastructure and find other hosts talking to it.
default_severity: high
mitre_attack:
- id: T1071.001
  name: 'Application Layer Protocol: Web Protocols'
- id: T1573
  name: Encrypted Channel
- id: T1568.002
  name: Domain Generation Algorithms
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1071.001
    - T1573
    - T1568.002
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Umbrella security category hit (C2 / malware)
- Periodic beaconing detection
- XDR incident with C2 indicators
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
    Without guardrails no containment can be planned safely, so the run stops.
  on_error: stop
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
  on_error: continue
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
  on_error: continue
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
  note: Every host in the incident targets plus any internal host reported as querying or contacting a
    C2 domain or IP (internal_queries / internal_sightings) that the analyst or source adds as a target.
  on_error: continue
- id: build_plan
  phase: decide
  note: Evaluate the plan rules below against enrichment verdicts and investigation results, then apply
    the guardrails. Protected, allow-listed, internal and over-limit targets are kept in the plan with a
    skipped_* status so the approver sees them.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
  on_error: escalate
- id: block_domain
  phase: contain
  atomic: block-domain
  when: Domain with enrich-domain verdict malicious, or verdict suspicious with a Command and Control
    category. Allow-listed domains are skipped by the guardrails.
  requires_approval: true
  on_error: continue
- id: block_ip
  phase: contain
  atomic: block-ip
  when: IP with enrich-ip verdict malicious that is not listed in incident.context.shared_infrastructure_ips
    (shared hosting or CDN). Internal and allow-listed ranges are skipped by the guardrails.
  requires_approval: true
  on_error: continue
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: Isolation-capable host with a malicious endpoint detection while at least one domain or IP in the
    incident has a malicious verdict. Protected hosts are skipped; more than max_hosts_isolated escalates.
  requires_approval: true
  on_error: escalate
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results and the rollback for every action.
  on_error: continue
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: continue
plan:
- id: block_c2_domains
  description: C2 domains. Malicious verdict, or suspicious verdict with a Command and Control category
    (typical for newly registered or DGA domains). Suspicious blocks get a shorter expiry.
  atomic: block-domain
  for_each: "results['enrich-domain']"
  when: "item.verdict == 'malicious' or (item.verdict == 'suspicious' and any(lower(c) == 'command and control' for c in item.categories))"
  target: "item.domain"
  args:
    expires_hours: "get(get(guardrails, 'expiry_hours', None), 'block-domain', 720) if item.verdict == 'malicious' else 168"
- id: block_c2_ips
  description: C2 IPs with a malicious verdict that are not shared hosting or CDN addresses. Internal and
    allow-listed ranges are left to the block-ip guardrail.
  atomic: block-ip
  for_each: "results['enrich-ip']"
  when: "item.verdict == 'malicious' and item.ip not in get(incident.context, 'shared_infrastructure_ips', [])"
  target: "item.ip"
  args:
    expires_hours: "get(get(guardrails, 'expiry_hours', None), 'block-ip', 168)"
- id: isolate_beaconing_hosts
  description: Hosts with confirmed beaconing. The host has a malicious endpoint detection, can be isolated,
    and the incident has at least one domain or IP with a malicious verdict.
  atomic: isolate-endpoint
  for_each: "results['investigate-host']"
  when: "item.isolation_capable and any(d.disposition == 'malicious' for d in item.detections) and any(r.verdict == 'malicious' for r in results['enrich-domain'] + results['enrich-ip'])"
  target: "item.connector_guid"
  args:
    reason: "'C2 beaconing: ' + incident.title"
templates:
  approval: |
    Approve containment for {incident.id}: {incident.title} (severity {incident.severity}).
    Workflow {workflow.name}, dry run {plan.dry_run}.
    Planned actions:
    {plan.actions}
    Skipped by guardrails:
    {plan.skipped}
    Escalation: {plan.escalate} {plan.reasons}
    Every action is reversible; the rollback for each is written to the incident note.
  incident_note: |
    Workflow {workflow.name} ({workflow.id}) ran for {incident.id}. Dry run: {plan.dry_run}.
    Enrichment summary:
    {plan.enrichment_summary}
    Plan and results:
    {plan.action_results}
    Skipped: {plan.skipped}
    Escalation: {plan.escalate} {plan.reasons}
    Approval: {approver.decision} by {approver.name} at {approver.time}.
    Rollback:
    - block-domain: remove the domain from the automation block list in Umbrella / Secure Access and,
      when used, the Cloudflare Gateway list. Blocks auto-expire after the planned expires_hours.
    - block-ip: remove the Meraki MX rule or Cloudflare IP list item; Meraki restores from the saved
      rule set. Blocks auto-expire after the planned expires_hours.
    - isolate-endpoint: stop isolation for the connector GUID in Secure Endpoint (Stop Isolation API,
      endpoint not yet verified against vendor docs). Unlock codes: {plan.unlock_codes}
    Ticket: {ticket.id} {ticket.url}
  ticket_title: "[C2] {incident.title} ({incident.id})"
  ticket_body: |
    Command and control activity for {incident.id}: {incident.title}.
    Severity: {incident.severity}. Workflow: {workflow.name}. Dry run: {plan.dry_run}.
    Enrichment:
    {plan.enrichment_summary}
    Containment actions and status:
    {plan.action_results}
    Skipped by guardrails: {plan.skipped}
    Escalation required: {plan.escalate} {plan.reasons}
    Approved by: {approver.name}
    Rollback steps are in the XDR incident note.
  notification: "C2 {incident.severity}: {incident.title} ({incident.id}). {plan.summary} Escalate: {plan.escalate}. Ticket {ticket.id} {ticket.url}"
integrations:
- cisco-xdr
- umbrella
- splunk
- secure-endpoint
- meraki
- cloudflare
- servicenow
related_workflows:
- dns-tunneling
- malware
- exfiltration
