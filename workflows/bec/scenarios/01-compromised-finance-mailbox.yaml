name: Compromised internal finance mailbox sends payment-change requests
description: >-
  True positive. An accounts-payable mailbox signed in successfully from a malicious IP, gained an
  external forwarding rule and sent bank-detail change requests to colleagues. The plan revokes its
  sessions (no approval), disables the account and quarantines its fraudulent messages across all
  recipients (both with approval). No lookalike domain is involved, so nothing is blocked.
incident:
  id: INC-TEST-BEC-0001
  title: Internal mailbox requesting vendor bank detail change
  severity: high
  source: Secure Email Threat Defense
  observables:
    - {type: email, value: ap-clerk-01@example.com}
    - {type: ip, value: 203.0.113.45}
    - {type: domain, value: example.com}
  targets:
    - {type: user, value: ap-clerk-01@example.com}
  context:
    fraud_senders: [ap-clerk-01@example.com]
    lookalike_domains: []
    mailbox_rules:
      - {user: ap-clerk-01@example.com, action: forward, destination: invoices@remit-desk.example, forwards_externally: true}
results:
  enrich-domain:
    - {domain: example.com, verdict: clean, categories: [Business], first_seen: "2005-01-01", internal_queries: 5000, error: ""}
  enrich-ip:
    - {ip: 203.0.113.45, verdict: malicious, sources: [], internal_sightings: 1, is_internal: false, error: ""}
  investigate-user:
    - user: ap-clerk-01@example.com
      profile: {department: Finance, manager: finance-lead@example.com, groups: [Finance-AP]}
      risk_level: medium
      signins:
        - {ip: 203.0.113.45, location: Unknown, app: Exchange Online, result: success}
        - {ip: 10.20.30.40, location: Office, app: Outlook, result: success}
      anomalies: [unfamiliar location, new device]
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: revoke-session, target: ap-clerk-01@example.com, status: planned, requires_approval: false}
    - {atomic: disable-user, target: ap-clerk-01@example.com, status: planned, requires_approval: true}
    - {atomic: quarantine-email, target: ap-clerk-01@example.com, status: planned, requires_approval: true}
