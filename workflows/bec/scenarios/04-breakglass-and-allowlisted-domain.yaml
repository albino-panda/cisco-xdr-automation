name: Break-glass sign-in and an allow-listed domain flagged as lookalike
description: >-
  Guardrail case. A break-glass account shows a risky successful sign-in but no abuse yet, so only
  session revocation is considered and the protected-user guardrail skips it. The gateway also flags
  the organisation's own subdomain as a lookalike; block-domain is skipped as allow-listed and the
  lookalike quarantine rule refuses allow-listed domains, so no mail is pulled.
incident:
  id: INC-TEST-BEC-0004
  title: Risky break-glass sign-in during payment-change investigation
  severity: high
  source: Microsoft Entra ID Protection
  observables:
    - {type: email, value: breakglass-01@example.com}
    - {type: domain, value: pay.example.com}
    - {type: ip, value: 203.0.113.9}
  targets:
    - {type: user, value: breakglass-01@example.com}
  context:
    fraud_senders: []
    lookalike_domains: [pay.example.com]
    mailbox_rules: []
results:
  enrich-domain:
    - {domain: pay.example.com, verdict: unknown, categories: [], first_seen: "2026-10-05", internal_queries: 12, error: ""}
  enrich-ip:
    - {ip: 203.0.113.9, verdict: malicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
  investigate-user:
    - user: breakglass-01@example.com
      profile: {department: IT, groups: [Emergency Access]}
      risk_level: low
      signins:
        - {ip: 203.0.113.9, location: Unknown, app: Azure Portal, result: success}
      anomalies: [unfamiliar location]
      is_protected: true
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: revoke-session, target: breakglass-01@example.com, status: skipped_protected, requires_approval: false}
    - {atomic: block-domain, target: pay.example.com, status: skipped_allowlisted, requires_approval: true}
