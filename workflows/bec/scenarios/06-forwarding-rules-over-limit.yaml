name: Several mailboxes with external forwarding rules exceed the disable limit
description: >-
  Edge case for a tenant-wide BEC campaign. Two finance mailboxes signed in from a malicious IP and
  each gained an external forwarding rule (T1114.003), but neither sent fraud yet. With
  max_users_disabled lowered to 1, both disables stay planned with elevated: true and the plan
  escalates to a lead. Session revocation has no cap and is planned behind normal approval; nothing
  is quarantined because no fraud sender is listed.
incident:
  id: INC-TEST-BEC-0006
  title: External forwarding rules created on multiple finance mailboxes
  severity: high
  source: Splunk
  observables:
    - {type: email, value: ap-clerk-04@example.com}
    - {type: email, value: ap-clerk-05@example.com}
    - {type: ip, value: 203.0.113.60}
  targets:
    - {type: user, value: ap-clerk-04@example.com}
    - {type: user, value: ap-clerk-05@example.com}
  context:
    fraud_senders: []
    lookalike_domains: []
    mailbox_rules:
      - {user: ap-clerk-04@example.com, action: forward, destination: archive@remit-desk.example, forwards_externally: true}
      - {user: ap-clerk-05@example.com, action: forward, destination: archive@remit-desk.example, forwards_externally: true}
results:
  enrich-ip:
    - {ip: 203.0.113.60, verdict: malicious, sources: [], internal_sightings: 2, is_internal: false, error: ""}
  investigate-user:
    - user: ap-clerk-04@example.com
      profile: {department: Finance, groups: [Finance-AP]}
      risk_level: medium
      signins:
        - {ip: 203.0.113.60, location: Unknown, app: Exchange Online, result: success}
      anomalies: [unfamiliar location]
      is_protected: false
      error: ""
    - user: ap-clerk-05@example.com
      profile: {department: Finance, groups: [Finance-AP]}
      risk_level: medium
      signins:
        - {ip: 203.0.113.60, location: Unknown, app: Exchange Online, result: success}
      anomalies: [unfamiliar location]
      is_protected: false
      error: ""
guardrails:
  blast_radius: {max_users_disabled: 1}
expect:
  escalate: true
  actions:
    - {atomic: revoke-session, target: ap-clerk-04@example.com, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: ap-clerk-05@example.com, status: planned, requires_approval: true}
    - {atomic: disable-user, target: ap-clerk-04@example.com, status: planned, elevated: true, requires_approval: true}
    - {atomic: disable-user, target: ap-clerk-05@example.com, status: planned, elevated: true, requires_approval: true}
