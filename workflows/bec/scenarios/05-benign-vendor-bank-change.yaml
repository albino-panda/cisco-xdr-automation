name: Legitimate vendor bank-detail change reported by a user
description: >-
  Benign. A user reports a bank-detail change from a long-established vendor domain. The domain is
  clean and not a lookalike, the reporting user has no risky sign-ins and no forwarding rules exist.
  The plan is empty; finance still verifies the change by phone (templates reminder).
incident:
  id: INC-TEST-BEC-0005
  title: User-reported payment change request from vendor
  severity: medium
  source: User report
  observables:
    - {type: email, value: billing@vendor-supplies.example}
    - {type: domain, value: vendor-supplies.example}
    - {type: ip, value: 198.51.100.80}
  targets:
    - {type: user, value: ap-clerk-03@example.com}
  context:
    fraud_senders: []
    lookalike_domains: []
    mailbox_rules: []
results:
  enrich-domain:
    - {domain: vendor-supplies.example, verdict: clean, categories: [Business], first_seen: "2015-03-02", internal_queries: 240, error: ""}
  enrich-ip:
    - {ip: 198.51.100.80, verdict: clean, sources: [], internal_sightings: 0, is_internal: false, error: ""}
  investigate-user:
    - user: ap-clerk-03@example.com
      profile: {department: Finance, groups: [Finance-AP]}
      risk_level: none
      signins:
        - {ip: 10.20.30.42, location: Office, app: Outlook, result: success}
      anomalies: []
      is_protected: false
      error: ""
expect:
  escalate: false
  actions: []
