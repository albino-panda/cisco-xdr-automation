name: Compromised protected executive mailbox
description: >-
  An executive mailbox listed in protected.users is compromised (Entra risk high), has an external
  forwarding rule and sent payment requests. Revocation and disabling are skipped by the user guardrail
  and must be done by a human. Quarantine has no user guardrail, so the fraudulent messages are still
  pulled from every recipient.
incident:
  id: INC-TEST-BEC-0003
  title: Executive mailbox forwarding mail and requesting payment
  severity: critical
  source: Secure Email Threat Defense
  observables:
    - {type: email, value: exec-01@example.com}
    - {type: ip, value: 192.0.2.77}
  targets:
    - {type: user, value: exec-01@example.com}
  context:
    fraud_senders: [exec-01@example.com]
    lookalike_domains: []
    mailbox_rules:
      - {user: exec-01@example.com, action: redirect, destination: assistant@remit-desk.example, forwards_externally: true}
results:
  enrich-ip:
    - {ip: 192.0.2.77, verdict: suspicious, sources: [], internal_sightings: 1, is_internal: false, error: ""}
  investigate-user:
    - user: exec-01@example.com
      profile: {department: Executive, groups: [Executives]}
      risk_level: high
      signins:
        - {ip: 192.0.2.77, location: Unknown, app: Exchange Online, result: success}
      anomalies: [impossible travel]
      is_protected: true
      error: ""
guardrails:
  protected:
    users:
      - "breakglass-01@example.com"
      - "breakglass-02@example.com"
      - "exec-01@example.com"
expect:
  escalate: false
  actions:
    - {atomic: revoke-session, target: exec-01@example.com, status: skipped_protected, requires_approval: false}
    - {atomic: disable-user, target: exec-01@example.com, status: skipped_protected, requires_approval: true}
    - {atomic: quarantine-email, target: exec-01@example.com, status: planned, requires_approval: true}
