schema_version: 1
id: bec
name: Business email compromise
status: specification
description: Contain a mailbox used for fraud and catch payment-redirection or forwarding-rule abuse.
default_severity: high
mitre_attack:
- id: T1534
  name: Internal Spearphishing
- id: T1114.003
  name: Email Forwarding Rule
- id: T1656
  name: Impersonation
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1534
    - T1114.003
    - T1656
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Suspicious inbox or forwarding rule creation
- Lookalike sender domain targeting finance
- Payment change requests flagged by users
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident. Map the email
    gateway's BEC facts into incident.context (fraud_senders, lookalike_domains, mailbox_rules).
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
  on_error: stop
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
  on_error: continue
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
  on_error: continue
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
  on_error: continue
- id: build_plan
  phase: decide
  note: Build the containment plan from the rules in `plan`, enrichment verdicts, investigation results
    and guardrails. Drop any target that is protected, allow-listed or over the blast-radius limit.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
  on_error: escalate
- id: revoke_session
  phase: contain
  atomic: revoke-session
  when: Investigated user is an internal (tenant) mailbox with compromise evidence, meaning Entra risk
    level high or a successful sign-in from an IP that enrich-ip rates malicious or suspicious.
  requires_approval: false
  on_error: escalate
- id: disable_user
  phase: contain
  atomic: disable-user
  when: Same compromise evidence as revoke_session, plus ongoing abuse, meaning the mailbox has a rule
    forwarding mail outside the organisation or is a listed sender of the fraudulent messages.
  requires_approval: true
  on_error: escalate
- id: quarantine_email
  phase: contain
  atomic: quarantine-email
  when: Fraudulent messages, searched across all recipients, from either a compromised internal mailbox
    that is a listed fraud sender, or a gateway-flagged lookalike sender domain that is not rated clean
    and not allow-listed.
  requires_approval: true
  on_error: escalate
- id: block_domain
  phase: contain
  atomic: block-domain
  when: Domain flagged by the email gateway as a lookalike of an organisation domain and not rated clean
    by enrich-domain. Allow-listed domains are skipped.
  requires_approval: true
  on_error: continue
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results and the rollback for every
    containment action (templates.incident_note).
  on_error: continue
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: continue
plan:
- id: revoke_compromised_mailbox_sessions
  description: Internal mailbox with compromise evidence (Entra risk high, or a successful sign-in from an
    IP rated malicious or suspicious). Sessions are revoked even before abuse is seen.
  atomic: revoke-session
  for_each: "results['investigate-user']"
  when: >-
    not get(item, 'error', '')
    and len(get(item, 'profile', None) or []) > 0
    and (lower(get(item, 'risk_level', '')) == 'high'
    or any(s.result == 'success' and s.ip in [r.ip for r in results['enrich-ip'] if r.verdict in ['malicious', 'suspicious']] for s in item.signins))
  target: item.user
- id: disable_abused_mailbox
  description: Compromised internal mailbox (same evidence as above) with ongoing abuse, meaning an
    external forwarding rule on the mailbox or the mailbox sent the fraudulent messages.
  atomic: disable-user
  for_each: "results['investigate-user']"
  when: >-
    not get(item, 'error', '')
    and len(get(item, 'profile', None) or []) > 0
    and (lower(get(item, 'risk_level', '')) == 'high'
    or any(s.result == 'success' and s.ip in [r.ip for r in results['enrich-ip'] if r.verdict in ['malicious', 'suspicious']] for s in item.signins))
    and (any(lower(r.user) == lower(item.user) and r.forwards_externally for r in get(incident.context, 'mailbox_rules', []))
    or lower(item.user) in [lower(x) for x in get(incident.context, 'fraud_senders', [])])
  target: item.user
  args:
    reason: "'Business email compromise: ' + incident.title"
- id: quarantine_compromised_mailbox_fraud
  description: Fraudulent messages sent by a compromised internal mailbox that is a listed fraud sender,
    searched across all recipients.
  atomic: quarantine-email
  for_each: "results['investigate-user']"
  when: >-
    not get(item, 'error', '')
    and len(get(item, 'profile', None) or []) > 0
    and (lower(get(item, 'risk_level', '')) == 'high'
    or any(s.result == 'success' and s.ip in [r.ip for r in results['enrich-ip'] if r.verdict in ['malicious', 'suspicious']] for s in item.signins))
    and lower(item.user) in [lower(x) for x in get(incident.context, 'fraud_senders', [])]
  target: lower(item.user)
  args:
    max_messages: guardrails.blast_radius.max_messages_quarantined
- id: quarantine_lookalike_sender_mail
  description: Messages from a gateway-flagged lookalike sender domain that is not rated clean and is not
    an allow-listed domain or a subdomain of one, searched across all recipients.
  atomic: quarantine-email
  for_each: "results['enrich-domain']"
  when: >-
    lower(item.domain) in [lower(d) for d in get(incident.context, 'lookalike_domains', [])]
    and item.verdict != 'clean'
    and not any(lower(item.domain) == lower(a) or endswith(lower(item.domain), '.' + lower(a)) for a in guardrails.allowlist.domains)
  target: lower(item.domain)
  args:
    max_messages: guardrails.blast_radius.max_messages_quarantined
- id: block_lookalike_domain
  description: Gateway-flagged lookalike domain that enrich-domain does not rate clean. The engine skips
    allow-listed domains.
  atomic: block-domain
  for_each: "results['enrich-domain']"
  when: >-
    lower(item.domain) in [lower(d) for d in get(incident.context, 'lookalike_domains', [])]
    and item.verdict != 'clean'
  target: lower(item.domain)
  args:
    expires_hours: "guardrails.expiry_hours['block-domain']"
templates:
  approval: |
    Business email compromise containment for incident {incident.id} ({incident.severity}): {incident.title}

    Planned actions:
    {plan.actions}

    Skipped by guardrails or limits:
    {plan.skipped}

    Escalation needed: {plan.escalate} {plan.reasons}
    Dry run: {workflow.dry_run}

    Revoking sessions forces the user to sign in again and cannot be undone. Disabling an account stops
    all mail for that user. Approve only if the evidence above shows the mailbox is compromised or the
    sender domain is a lookalike.
  incident_note: |
    Workflow {workflow.name} ran on {incident.id} (dry run: {workflow.dry_run}).

    Plan: {plan.actions}
    Skipped: {plan.skipped}
    Escalation: {plan.escalate} {plan.reasons}
    Approval: {approver.decision} by {approver.name}
    Results: {plan.results}

    Rollback per action:
    - revoke-session: not reversible; the user signs in again after the password reset.
    - disable-user: set accountEnabled back to true once the password is reset and MFA is re-registered.
    - quarantine-email: release the messages from quarantine back to the recipients' inboxes.
    - block-domain: remove the domain from the automation block list (it also expires after the
      configured expiry hours).

    Manual follow-up: review and remove malicious inbox and forwarding rules on the affected mailboxes and
    record them in ticket {ticket.id}. Finance must hold pending payments to any changed bank details until
    each change is verified by phone with a known contact.
  ticket_title: "BEC: {incident.title} ({incident.id})"
  ticket_body: |
    Business email compromise response for XDR incident {incident.id}, severity {incident.severity}.

    Planned or completed containment: {plan.actions}
    Skipped by guardrails or limits: {plan.skipped}
    Escalation: {plan.escalate} {plan.reasons}
    Approved by: {approver.name} ({approver.decision})

    Open tasks:
    1. Finance: hold pending payments to changed bank details and verify each change by phone with a
       known vendor contact, never with contact details taken from the email.
    2. Mail admin: review and remove malicious inbox and forwarding rules and list them here.
    3. Identity: reset the password and re-register MFA for each compromised mailbox before re-enabling it.
  notification: |
    [{incident.severity}] BEC on {incident.id}: {incident.title}. Plan: {plan.summary}. Escalation:
    {plan.escalate}. Ticket {ticket.id} {ticket.url}. Reminder to finance: hold payments to changed bank
    details until each change is verified.
integrations:
- cisco-xdr
- umbrella
- splunk
- microsoft-entra
- secure-email
- cloudflare
- servicenow
related_workflows:
- account-takeover
- phishing
