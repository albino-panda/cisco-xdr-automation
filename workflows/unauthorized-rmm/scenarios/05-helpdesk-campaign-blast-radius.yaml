name: Fake help-desk campaign puts FictiDesk sessions on six hosts
description: >-
  The same fake help-desk caller reaches six users in one morning and each gets an active FictiDesk
  session. The relay domain and installer hash blocks are planned once (duplicates collapse), but
  six isolations exceed blast_radius.max_hosts_isolated (5), so every isolation stays planned with
  elevated: true and the plan escalates to a lead instead of isolating part of the group.
incident:
  id: INC-TEST-RMM-0005
  title: FictiDesk sessions on six workstations after help-desk impersonation calls
  severity: critical
  source: Cisco XDR
  observables:
    - {type: domain, value: relay.fictidesk.example}
    - {type: sha256, value: 7e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e57}
    - {type: host, value: ws-ops-101}
    - {type: host, value: ws-ops-102}
    - {type: host, value: ws-ops-103}
    - {type: host, value: ws-ops-104}
    - {type: host, value: ws-ops-105}
    - {type: host, value: ws-ops-106}
  context:
    rmm_tool: FictiDesk
    rmm_relay_domains: [relay.fictidesk.example]
    rmm_installer_sha256: [7e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e57]
    rmm_sessions:
      - {host: ws-ops-101, active: true, operator_verified: false}
      - {host: ws-ops-102, active: true, operator_verified: false}
      - {host: ws-ops-103, active: true, operator_verified: false}
      - {host: ws-ops-104, active: true, operator_verified: false}
      - {host: ws-ops-105, active: true, operator_verified: false}
      - {host: ws-ops-106, active: true, operator_verified: false}
results:
  enrich-domain:
    - {domain: relay.fictidesk.example, verdict: suspicious, categories: [Remote Access], first_seen: "2026-03-02", internal_queries: 214}
  enrich-hash:
    - {sha256: 7e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e57, disposition: unknown, prevalence: 6, hosts: [ws-ops-101, ws-ops-102, ws-ops-103, ws-ops-104, ws-ops-105, ws-ops-106]}
  investigate-host:
    - {host: ws-ops-101, connector_guid: 00000000-0000-4000-8000-000000000101, detections: [], trajectory: [], isolation_capable: true, is_protected: false}
    - {host: ws-ops-102, connector_guid: 00000000-0000-4000-8000-000000000102, detections: [], trajectory: [], isolation_capable: true, is_protected: false}
    - {host: ws-ops-103, connector_guid: 00000000-0000-4000-8000-000000000103, detections: [], trajectory: [], isolation_capable: true, is_protected: false}
    - {host: ws-ops-104, connector_guid: 00000000-0000-4000-8000-000000000104, detections: [], trajectory: [], isolation_capable: true, is_protected: false}
    - {host: ws-ops-105, connector_guid: 00000000-0000-4000-8000-000000000105, detections: [], trajectory: [], isolation_capable: true, is_protected: false}
    - {host: ws-ops-106, connector_guid: 00000000-0000-4000-8000-000000000106, detections: [], trajectory: [], isolation_capable: true, is_protected: false}
expect:
  escalate: true
  actions:
    - {atomic: block-domain, target: relay.fictidesk.example, status: planned, requires_approval: true}
    - {atomic: block-hash, target: 7e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e57, status: planned, requires_approval: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000101, status: planned, elevated: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000102, status: planned, elevated: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000103, status: planned, elevated: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000104, status: planned, elevated: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000105, status: planned, elevated: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000106, status: planned, elevated: true}
