name: Unapproved RMM tool installed after a fake help-desk call
description: >-
  After a mail-bombing wave, a caller posing as the IT help desk talks a finance user into installing
  the unapproved tool FictiDesk and opens a live session. The plan blocks the tool's two relay domains
  and its installer hash and isolates the one host with the active session. The internal domain, the
  unrelated document hash and the second investigated host (no session) are left alone.
incident:
  id: INC-TEST-RMM-0001
  title: Unapproved remote access tool FictiDesk on ws-fin-014 after help-desk call
  severity: high
  source: Cisco Secure Endpoint
  observables:
    - {type: domain, value: relay.fictidesk.example}
    - {type: domain, value: broker.fictidesk.example}
    - {type: domain, value: intranet.example.com}
    - {type: sha256, value: 7e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e57}
    - {type: sha256, value: 0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c}
    - {type: host, value: ws-fin-014}
    - {type: host, value: ws-fin-020}
    - {type: user, value: user01@example.com}
  context:
    initial_contact: External chat call from a caller posing as the IT help desk, 20 minutes after a mail-bombing wave
    rmm_tool: FictiDesk
    rmm_relay_domains: [relay.fictidesk.example, broker.fictidesk.example]
    rmm_installer_sha256: [7e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e57]
    rmm_sessions:
      - {host: ws-fin-014, active: true, operator_verified: false, peer_ip: 203.0.113.45}
results:
  enrich-domain:
    - {domain: relay.fictidesk.example, verdict: suspicious, categories: [Remote Access], first_seen: "2026-03-02", internal_queries: 37}
    - {domain: broker.fictidesk.example, verdict: unknown, categories: [Remote Access], first_seen: "2026-03-02", internal_queries: 4}
    - {domain: intranet.example.com, verdict: clean, categories: [Business], first_seen: "2015-01-10", internal_queries: 9120}
  enrich-hash:
    - {sha256: 7e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e57, disposition: unknown, prevalence: 1, hosts: [ws-fin-014]}
    - {sha256: 0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c0d0c, disposition: clean, prevalence: 812, hosts: [ws-fin-014, ws-fin-020]}
  investigate-host:
    - {host: ws-fin-014, connector_guid: 00000000-0000-4000-8000-00000000f014, detections: [], trajectory: [], isolation_capable: true, is_protected: false}
    - {host: ws-fin-020, connector_guid: 00000000-0000-4000-8000-00000000f020, detections: [], trajectory: [], isolation_capable: true, is_protected: false}
  investigate-user:
    - {user: user01@example.com, profile: {department: Finance}, risk_level: medium, signins: [], anomalies: [], is_protected: false}
expect:
  escalate: false
  actions:
    - {atomic: block-domain, target: relay.fictidesk.example, status: planned, requires_approval: true}
    - {atomic: block-domain, target: broker.fictidesk.example, status: planned, requires_approval: true}
    - {atomic: block-hash, target: 7e577e577e577e577e577e577e577e577e577e577e577e577e577e577e577e57, status: planned, requires_approval: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-00000000f014, status: planned, requires_approval: true}
