name: Privileged admin takeover with a rogue app credential and a risky consent
description: >
  An Application Administrator signs in from a malicious IP and a suspicious IP, then adds a client
  secret to an app registration; a second, non-privileged user granted consent to the same app and shows
  a new-device anomaly. The plan revokes both users, disables only the privileged admin, and blocks the
  malicious IP plus the suspicious IP the high-risk admin signed in from. The clean IP used by the
  second user is not blocked.
incident:
  id: INC-TEST-0301
  title: New client secret on app registration after unfamiliar admin sign-in
  severity: high
  source: Microsoft Entra ID Protection
  observables:
    - {type: user, value: cloud-admin-07@example.com}
    - {type: user, value: sales-analyst-14@example.com}
    - {type: ip, value: 203.0.113.45}
    - {type: ip, value: 198.51.100.77}
    - {type: ip, value: 192.0.2.10}
  context:
    app_display_name: Reporting Connector (test)
    credential_type: client_secret
    credential_added_by: cloud-admin-07@example.com
    consented_by: [sales-analyst-14@example.com]
    change_ticket: null
results:
  enrich-ip:
    - {ip: 203.0.113.45, verdict: malicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
    - {ip: 198.51.100.77, verdict: suspicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
    - {ip: 192.0.2.10, verdict: clean, sources: [], internal_sightings: 4, is_internal: false, error: ""}
  investigate-user:
    - user: cloud-admin-07@example.com
      profile: {department: IT, groups: [Cloud Operations], privileged_roles: [Application Administrator]}
      risk_level: high
      signins:
        - {ip: 203.0.113.45, location: Unknown, app: Azure Portal, result: success}
        - {ip: 198.51.100.77, location: Unknown, app: Microsoft Graph, result: success}
      anomalies: [unfamiliar_location, impossible_travel]
      is_protected: false
      error: ""
    - user: sales-analyst-14@example.com
      profile: {department: Sales, groups: [Sales], privileged_roles: []}
      risk_level: medium
      signins:
        - {ip: 192.0.2.10, location: Branch office, app: Office 365, result: success}
      anomalies: [new_device]
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: revoke-session, target: cloud-admin-07@example.com, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: sales-analyst-14@example.com, status: planned, requires_approval: true}
    - {atomic: disable-user, target: cloud-admin-07@example.com, status: planned, requires_approval: true}
    - {atomic: block-ip, target: 203.0.113.45, status: planned, requires_approval: true}
    - {atomic: block-ip, target: 198.51.100.77, status: planned, requires_approval: true}
