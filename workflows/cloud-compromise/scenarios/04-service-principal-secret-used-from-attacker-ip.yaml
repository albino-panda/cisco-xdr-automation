name: Leaked service principal secret used from an attacker IP (app-only access)
description: >
  Cloud-specific edge case. A client secret on a service principal is used for app-only token requests
  from a malicious IP; no human session is involved. The app owner had one failed sign-in from the same
  IP but no successful one, low risk and no anomalies, so the owner is neither revoked nor disabled even
  though they hold a privileged role. Only the IP is blocked. Revoking user sessions would not stop
  app-only tokens, so removing the secret is the manual task in the ticket.
incident:
  id: INC-TEST-0304
  title: Service principal sign-in from unfamiliar IP after new client secret
  severity: high
  source: Microsoft Entra service principal sign-in logs via Splunk
  observables:
    - {type: user, value: app-owner-05@example.com}
    - {type: ip, value: 203.0.113.80}
    - {type: ip, value: 10.20.0.8}
  context:
    service_principal: reporting-connector-sp
    sign_in_type: service_principal
    credential_type: client_secret
    credential_added_by: app-owner-05@example.com
    change_ticket: null
results:
  enrich-ip:
    - {ip: 203.0.113.80, verdict: malicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
    - {ip: 10.20.0.8, verdict: clean, sources: [], internal_sightings: 0, is_internal: true, error: ""}
  investigate-user:
    - user: app-owner-05@example.com
      profile: {department: IT, groups: [Application Owners], privileged_roles: [Application Administrator]}
      risk_level: low
      signins:
        - {ip: 203.0.113.80, location: Unknown, app: Azure Portal, result: failure}
        - {ip: 10.20.0.8, location: Head office, app: Microsoft Entra admin center, result: success}
      anomalies: []
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: block-ip, target: 203.0.113.80, status: planned, requires_approval: true}
