name: Approved app-credential rotation (benign)
description: >
  The "new credential on an app registration" detection fires for a scheduled certificate rotation done
  by the app owner under an approved change, from the corporate network. The owner holds a privileged
  role but has no identity risk, no anomalies and only clean, internal sign-ins, so the plan is empty.
  This proves a privileged role alone never triggers containment.
incident:
  id: INC-TEST-0302
  title: New certificate added to app registration Payroll Export (test)
  severity: medium
  source: Microsoft Entra audit log via Splunk
  observables:
    - {type: user, value: app-owner-03@example.com}
    - {type: ip, value: 10.20.0.5}
  context:
    app_display_name: Payroll Export (test)
    credential_type: certificate
    credential_added_by: app-owner-03@example.com
    change_ticket: CHG-TEST-0042
results:
  enrich-ip:
    - {ip: 10.20.0.5, verdict: clean, sources: [], internal_sightings: 0, is_internal: true, error: ""}
  investigate-user:
    - user: app-owner-03@example.com
      profile: {department: IT, groups: [Application Owners], privileged_roles: [Cloud Application Administrator]}
      risk_level: none
      signins:
        - {ip: 10.20.0.5, location: Head office, app: Microsoft Entra admin center, result: success}
      anomalies: []
      is_protected: false
      error: ""
expect:
  escalate: false
  actions: []
