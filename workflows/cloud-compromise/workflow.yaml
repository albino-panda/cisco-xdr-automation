schema_version: 1
id: cloud-compromise
name: Cloud compromise
status: specification
description: Respond to abuse of cloud identities, app credentials or OAuth consent.
default_severity: high
mitre_attack:
- id: T1078.004
  name: 'Valid Accounts: Cloud Accounts'
- id: T1098.001
  name: Additional Cloud Credentials
- id: T1528
  name: Steal Application Access Token
- id: T1530
  name: Data from Cloud Storage
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1078.004
    - T1098.001
    - T1528
    - T1530
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- New credential added to an app registration or service principal
- Risky OAuth consent
- Unusual admin activity from new locations
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
- id: build_plan
  phase: decide
  note: Build the containment plan from enrichment verdicts, investigation results and guardrails. Drop
    any target that is protected, allow-listed or over the blast-radius limit.
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
- id: revoke_session
  phase: contain
  atomic: revoke-session
  when: Affected user accounts.
  requires_approval: false
- id: disable_user
  phase: contain
  atomic: disable-user
  when: Compromised accounts with admin roles.
  requires_approval: true
- id: block_ip
  phase: contain
  atomic: block-ip
  when: Attacker IPs.
  requires_approval: true
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals and per-action results.
- id: create_ticket
  phase: record
  atomic: create-ticket
- id: notify_soc
  phase: notify
  atomic: notify-soc
integrations:
- cisco-xdr
- umbrella
- splunk
- microsoft-entra
- meraki
- cloudflare
- servicenow
related_workflows:
- account-takeover
- exfiltration
- privilege-escalation
