schema_version: 1
id: phishing
name: Phishing
status: specification
description: Triage a reported or detected phishing message, remove copies from all mailboxes and block
  its indicators.
default_severity: medium
mitre_attack:
- id: T1566.001
  name: Spearphishing Attachment
- id: T1566.002
  name: Spearphishing Link
- id: T1204
  name: User Execution
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1566.001
    - T1566.002
    - T1204
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- User-reported phish
- Secure Email verdict change to malicious after delivery
- XDR incident from email telemetry
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
- id: enrich_hash
  phase: enrich
  atomic: enrich-hash
  for_each: sha256
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
- id: build_plan
  phase: decide
  note: Build the containment plan from enrichment verdicts, investigation results and guardrails. Drop
    any target that is protected, allow-listed or over the blast-radius limit.
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
- id: quarantine_email
  phase: contain
  atomic: quarantine-email
  when: All delivered copies matching sender and subject or URL.
  requires_approval: true
- id: block_url
  phase: contain
  atomic: block-url
  when: Malicious URLs on otherwise legitimate domains.
  requires_approval: true
- id: block_domain
  phase: contain
  atomic: block-domain
  when: Domains with a malicious verdict that are not allow-listed.
  requires_approval: true
- id: block_hash
  phase: contain
  atomic: block-hash
  when: Malicious attachments.
  requires_approval: true
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals and per-action results.
- id: create_ticket
  phase: record
  atomic: create-ticket
- id: notify_soc
  phase: notify
  atomic: notify-soc
integrations:
- cisco-xdr
- umbrella
- splunk
- secure-endpoint
- microsoft-entra
- secure-email
- cloudflare
- servicenow
related_workflows:
- account-takeover
- bec
- malware
