name: Credential phishing link and malicious attachment delivered to finance
description: >
  True positive. Secure Email flags a delivered message as malicious after delivery. The link points to
  a malicious lookalike domain and the attachment is malicious. The plan quarantines every delivered
  copy, blocks the domain and the attachment hash. The URL itself is not blocked separately because the
  domain block already covers it.
incident:
  id: INC-TEST-PH-0001
  title: Credential phishing link and attachment delivered to finance
  severity: medium
  source: Secure Email Threat Defense
  observables:
    - {type: email, value: billing@invoice-portal.example}
    - {type: email_subject, value: "Overdue invoice 4471 - action required"}
    - {type: url, value: "https://invoice-portal.example/login/verify"}
    - {type: domain, value: invoice-portal.example}
    - {type: ip, value: 203.0.113.25}
    - {type: sha256, value: 1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b}
    - {type: user, value: ap-clerk-01@example.com}
  context:
    sender: billing@invoice-portal.example
    subject: "Overdue invoice 4471 - action required"
    email_verdict: malicious
    malicious_urls: ["https://invoice-portal.example/login/verify"]
    delivered_copies: 14
results:
  enrich-domain:
    - {domain: invoice-portal.example, verdict: malicious, categories: [Phishing], first_seen: "2026-10-02", internal_queries: 3, error: ""}
  enrich-ip:
    - {ip: 203.0.113.25, verdict: suspicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
  enrich-hash:
    - {sha256: 1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b, disposition: malicious, prevalence: 0, hosts: [], error: ""}
  investigate-user:
    - {user: ap-clerk-01@example.com, risk_level: low, signins: [], anomalies: [], is_protected: false, error: ""}
expect:
  escalate: false
  actions:
    - {atomic: quarantine-email, target: billing@invoice-portal.example, status: planned, requires_approval: true}
    - {atomic: block-domain, target: invoice-portal.example, status: planned, requires_approval: true}
    - {atomic: block-hash, target: 1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b3c4d5e6f7a8b9c0d1a2b, status: planned, requires_approval: true}
