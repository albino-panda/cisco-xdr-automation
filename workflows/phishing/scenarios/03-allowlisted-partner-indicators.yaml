name: Phish from a compromised partner whose indicators are allow-listed
description: >
  Guardrail skips. A trusted partner's mail system is compromised and sends a malicious invoice. The
  partner domain and its signed installer hash are on this tenant's allow-list, so block-domain and
  block-hash are proposed but skipped as allow-listed and left for a human. Quarantine has no allow-list
  guardrail and is still planned, matching only that sender and subject.
incident:
  id: INC-TEST-PH-0003
  title: Malicious invoice from compromised partner mailbox
  severity: high
  source: Secure Email Threat Defense
  observables:
    - {type: email, value: accounts@partner-portal.example}
    - {type: email_subject, value: "Updated remittance details"}
    - {type: domain, value: partner-portal.example}
    - {type: sha256, value: 9f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0}
  context:
    sender: accounts@partner-portal.example
    subject: "Updated remittance details"
    email_verdict: malicious
    malicious_urls: []
results:
  enrich-domain:
    - {domain: partner-portal.example, verdict: malicious, categories: [Phishing, Compromised Sites], first_seen: "2015-06-01", internal_queries: 540, error: ""}
  enrich-hash:
    - {sha256: 9f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0, disposition: malicious, prevalence: 2, hosts: [], error: ""}
guardrails:
  allowlist:
    # Lists replace the base file's lists, so the defaults are repeated here.
    domains: ["example.com", "*.microsoft.com", "*.cisco.com", "partner-portal.example"]
    hashes: ["9f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0"]
expect:
  escalate: false
  actions:
    - {atomic: quarantine-email, target: accounts@partner-portal.example, status: planned, requires_approval: true}
    - {atomic: block-domain, target: partner-portal.example, status: skipped_allowlisted, requires_approval: true}
    - {atomic: block-hash, target: 9f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0, status: skipped_allowlisted, requires_approval: true}
