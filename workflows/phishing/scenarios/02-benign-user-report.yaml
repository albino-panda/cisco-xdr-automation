name: User-reported newsletter that is not phishing
description: >
  Benign. A user reports a marketing newsletter as phishing. Secure Email rates it clean, the link
  domain is clean and no URL is listed as malicious. Nothing is quarantined or blocked; the run only
  records the enrichment so the analyst can close the report.
incident:
  id: INC-TEST-PH-0002
  title: User-reported suspicious newsletter
  severity: low
  source: User-reported phish
  observables:
    - {type: email, value: news@vendor-updates.test}
    - {type: email_subject, value: "October product update"}
    - {type: url, value: "https://vendor-updates.test/newsletter/october"}
    - {type: domain, value: vendor-updates.test}
    - {type: user, value: sales-rep-04@example.com}
  context:
    sender: news@vendor-updates.test
    subject: "October product update"
    email_verdict: clean
    malicious_urls: []
results:
  enrich-domain:
    - {domain: vendor-updates.test, verdict: clean, categories: [Business], first_seen: "2019-03-11", internal_queries: 212, error: ""}
  investigate-user:
    - {user: sales-rep-04@example.com, risk_level: none, signins: [], anomalies: [], is_protected: false, error: ""}
expect:
  escalate: false
  actions: []
