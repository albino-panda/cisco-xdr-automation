name: Confirmed web shell on an internet-facing web server
description: >
  An upload endpoint with a known, unpatched vulnerability was exploited from one external source and
  Secure Endpoint confirmed a web shell on the web server. The plan blocks the source at the edge,
  virtually patches the vulnerable endpoint until the fix ships, and isolates the web server after
  owner approval. A second web server in the same pool is clean and must not be isolated.
incident:
  id: INC-TEST-WEB-0001
  title: Web shell detected on shop web server after upload exploitation
  severity: high
  source: Cisco Secure Endpoint
  observables:
    - {type: ip, value: 203.0.113.45}
    - {type: url, value: "https://shop.example.net/upload"}
    - {type: hostname, value: web-shop-01}
    - {type: hostname, value: web-shop-02}
  targets:
    - {type: endpoint, value: web-shop-01}
  context:
    waf_hits_over_baseline: true
    targeted_endpoints:
      - {url: "https://shop.example.net/upload", vulnerable: true, fix_pending: true}
results:
  enrich-ip:
    - {ip: 203.0.113.45, verdict: malicious, sources: [{name: Talos, verdict: malicious}], internal_sightings: 0, is_internal: false, error: ""}
  investigate-host:
    - host: web-shop-01
      connector_guid: 00000000-0000-4000-8000-000000000101
      detections:
        - {name: Web shell file written to web root, disposition: malicious, technique: T1505.003}
      trajectory:
        - Web server worker process wrote a new script file to the web root
        - Web server worker process started a command shell
      isolation_capable: true
      is_protected: false
      error: ""
    - host: web-shop-02
      connector_guid: 00000000-0000-4000-8000-000000000102
      detections: []
      trajectory: []
      isolation_capable: true
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: block-ip, target: 203.0.113.45, status: planned, requires_approval: true}
    - {atomic: block-url, target: "https://shop.example.net/upload", status: planned, requires_approval: true}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-000000000101, status: planned, requires_approval: true}
