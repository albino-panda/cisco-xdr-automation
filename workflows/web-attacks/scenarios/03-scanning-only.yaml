name: Unauthorised vulnerability scanning without success indicators
description: >
  An unknown external source scanned the shop application. WAF hits are above baseline, but no
  targeted endpoint is known vulnerable and Secure Endpoint shows only a suspicious, non-web-shell
  detection on the web server. The plan blocks the scanning source and must not isolate the server,
  because scanning alone never triggers isolation.
incident:
  id: INC-TEST-WEB-0003
  title: Vulnerability scanning against shop application
  severity: low
  source: Cloudflare WAF
  observables:
    - {type: ip, value: 192.0.2.77}
    - {type: hostname, value: web-shop-01}
  context:
    waf_hits_over_baseline: true
    targeted_endpoints:
      - {url: "https://shop.example.net/login", vulnerable: false, fix_pending: false}
      - {url: "https://shop.example.net/admin", vulnerable: false, fix_pending: false}
results:
  enrich-ip:
    - {ip: 192.0.2.77, verdict: suspicious, sources: [{name: Talos, verdict: suspicious}], internal_sightings: 0, is_internal: false, error: ""}
  investigate-host:
    - host: web-shop-01
      connector_guid: 00000000-0000-4000-8000-000000000101
      detections:
        - {name: Burst of failed web requests logged, disposition: suspicious, technique: T1595.002}
      trajectory: []
      isolation_capable: true
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: block-ip, target: 192.0.2.77, status: planned, requires_approval: true}
