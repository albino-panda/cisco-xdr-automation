name: Authorised external vulnerability scan
description: >
  The contracted external scanning service ran its scheduled scan. Reputation feeds flag the scanner
  as suspicious, but the incident lists it as an authorised scanner, no targeted endpoint is known
  vulnerable and the web server is clean. Nothing may be blocked or isolated; the run only records
  and notifies.
incident:
  id: INC-TEST-WEB-0002
  title: WAF rule hits from scheduled external vulnerability scan
  severity: low
  source: Cloudflare WAF
  observables:
    - {type: ip, value: 198.51.100.20}
    - {type: hostname, value: web-shop-01}
  context:
    authorized_scanners: [198.51.100.20]
    scan_window: "2026-10-05T01:00Z/2026-10-05T03:00Z"
    targeted_endpoints:
      - {url: "https://shop.example.net/search", vulnerable: false, fix_pending: false}
results:
  enrich-ip:
    - {ip: 198.51.100.20, verdict: suspicious, sources: [{name: Talos, verdict: suspicious}], internal_sightings: 0, is_internal: false, error: ""}
  investigate-host:
    - {host: web-shop-01, connector_guid: 00000000-0000-4000-8000-000000000101, detections: [], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
expect:
  escalate: false
  actions: []
