name: Distributed exploitation attempts exceed the indicator blast radius
description: >
  Exploitation attempts against the shop application arrive from many malicious sources at once.
  The scenario lowers max_indicators_blocked to 5 to keep the file short. Six sources qualify, so every
  block in the indicator group becomes skipped_limit and the plan escalates to a human instead of
  blocking automatically. The web server shows no web shell, so nothing is isolated.
incident:
  id: INC-TEST-WEB-0005
  title: Exploitation attempts from many sources against shop application
  severity: medium
  source: Cloudflare WAF
  observables:
    - {type: ip, value: 203.0.113.10}
    - {type: ip, value: 203.0.113.11}
    - {type: ip, value: 203.0.113.12}
    - {type: ip, value: 198.51.100.30}
    - {type: ip, value: 198.51.100.31}
    - {type: ip, value: 192.0.2.90}
    - {type: hostname, value: web-shop-01}
  context:
    waf_hits_over_baseline: true
results:
  enrich-ip:
    - {ip: 203.0.113.10, verdict: malicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
    - {ip: 203.0.113.11, verdict: malicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
    - {ip: 203.0.113.12, verdict: malicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
    - {ip: 198.51.100.30, verdict: suspicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
    - {ip: 198.51.100.31, verdict: suspicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
    - {ip: 192.0.2.90, verdict: malicious, sources: [], internal_sightings: 0, is_internal: false, error: ""}
  investigate-host:
    - {host: web-shop-01, connector_guid: 00000000-0000-4000-8000-000000000101, detections: [], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
guardrails:
  blast_radius: {max_indicators_blocked: 5}
expect:
  escalate: true
  actions:
    - {atomic: block-ip, target: 203.0.113.10, status: skipped_limit, requires_approval: true}
    - {atomic: block-ip, target: 203.0.113.11, status: skipped_limit, requires_approval: true}
    - {atomic: block-ip, target: 203.0.113.12, status: skipped_limit, requires_approval: true}
    - {atomic: block-ip, target: 198.51.100.30, status: skipped_limit, requires_approval: true}
    - {atomic: block-ip, target: 198.51.100.31, status: skipped_limit, requires_approval: true}
    - {atomic: block-ip, target: 192.0.2.90, status: skipped_limit, requires_approval: true}
