schema_version: 1
id: malicious-powershell
name: Suspicious PowerShell
status: specification
description: Investigate encoded, obfuscated or download-cradle style PowerShell and contain the host
  when malicious.
default_severity: medium
mitre_attack:
- id: T1059.001
  name: 'Command and Scripting Interpreter: PowerShell'
- id: T1027
  name: Obfuscated Files or Information
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1059.001
    - T1027
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Secure Endpoint behavioural protection or exploit prevention alert
- Script block logging alert from SIEM
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident. Domains, IPs and
    hashes come from the script's network destinations and written files as reported by the source alert.
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
  on_error: stop
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
  on_error: continue
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
  on_error: continue
- id: enrich_hash
  phase: enrich
  atomic: enrich-hash
  for_each: sha256
  on_error: continue
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
  on_error: continue
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
  on_error: continue
- id: build_plan
  phase: decide
  note: Build the containment plan from the plan rules below, enrichment verdicts, investigation results
    and guardrails. Allow-listed and internal targets are skipped; protected targets and targets over a blast-radius cap stay in the plan with ELEVATED approval and a warning, never dropped.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
  on_error: escalate
- id: block_domain
  phase: contain
  atomic: block-domain
  when: Download destination domain with enrich-domain verdict malicious, or verdict suspicious while an
    enriched payload hash is malicious. Enrichment errors are never actioned; allow-listed domains are
    skipped.
  requires_approval: true
  on_error: escalate
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: Isolation-capable host where a malicious payload hash was seen (payload retrieved), or with a malicious
    Secure Endpoint detection while a download destination domain or IP is malicious (payload executed).
    Protected hosts and more hosts than max_hosts_isolated need ELEVATED approval; over the cap the plan escalates.
  requires_approval: true
  on_error: escalate
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results and the rollback for every action.
  on_error: continue
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: continue
plan:
- id: block_malicious_download_domain
  description: Block a domain the script contacted or downloaded from when enrichment rates it malicious.
  atomic: block-domain
  for_each: "results['enrich-domain']"
  when: "item.verdict == 'malicious' and not get(item, 'error', '')"
  target: "item.domain"
  args:
    expires_hours: "get(guardrails.expiry_hours, 'block-domain', 720)"
    incident_id: "get(incident, 'id', '')"
- id: block_suspicious_domain_serving_payload
  description: Block a suspicious download domain when the payload hash retrieved in the same incident is
    malicious, so the destination is confirmed as a payload host.
  atomic: block-domain
  for_each: "results['enrich-domain']"
  when: "item.verdict == 'suspicious' and not get(item, 'error', '') and any(h.disposition == 'malicious'
    and not get(h, 'error', '') for h in results['enrich-hash'])"
  target: "item.domain"
  args:
    expires_hours: "get(guardrails.expiry_hours, 'block-domain', 720)"
    incident_id: "get(incident, 'id', '')"
- id: isolate_host_with_retrieved_payload
  description: Isolate an isolation-capable host whose connector GUID or hostname is in the host list of
    a malicious payload hash, meaning the payload landed on that host.
  atomic: isolate-endpoint
  for_each: "results['investigate-host']"
  when: "item.isolation_capable and not get(item, 'error', '') and any(h.disposition == 'malicious' and
    (item.connector_guid in h.hosts or item.host in h.hosts) for h in results['enrich-hash'])"
  target: "item.connector_guid"
  args:
    reason: "'Suspicious PowerShell: malicious payload retrieved on ' + item.host + ' (' + incident.title
      + ')'"
    incident_id: "get(incident, 'id', '')"
- id: isolate_host_with_executed_payload
  description: Isolate an isolation-capable host with a malicious Secure Endpoint detection in the lookback
    window while at least one download destination (domain or IP) is malicious. Covers payloads fetched
    from a bare IP or not present as a hash observable.
  atomic: isolate-endpoint
  for_each: "results['investigate-host']"
  when: "item.isolation_capable and not get(item, 'error', '') and any(get(d, 'disposition', '') == 'malicious'
    for d in item.detections) and (any(x.verdict == 'malicious' and not get(x, 'error', '') for x in results['enrich-domain'])
    or any(x.verdict == 'malicious' and not get(x, 'error', '') for x in results['enrich-ip']))"
  target: "item.connector_guid"
  args:
    reason: "'Suspicious PowerShell: payload executed after contact with a malicious destination on ' +
      item.host + ' (' + incident.title + ')'"
    incident_id: "get(incident, 'id', '')"
templates:
  approval: |
    {workflow.name}: containment approval for {incident.id} ({incident.severity})
    ELEVATED approval required for (protected assets and actions over a blast-radius cap; a lead must approve): {plan.elevated}
    {incident.title}

    Planned actions:
    {plan.actions}

    Skipped by guardrails: {plan.skipped}
    Escalated (blast radius exceeded): {plan.escalate} {plan.reasons}
    Dry run: {workflow.dry_run}

    Approving adds the listed download domains to the automation block list (release review due after
    {plan.block_expiry_hours} hours; removal needs a separate human release approval) and network-isolates the listed hosts in Secure Endpoint.
    Both are reversible; the rollback for each action is written into the incident note.
    Before approving, check the script against known admin and software-deployment scripts.
  incident_note: |
    ## {workflow.name} run for {incident.id}
    Dry run: {workflow.dry_run}. Approver: {approver.name} at {approver.time}.

    ### Enrichment and investigation
    Download destinations: {plan.destinations}
    Payload hashes: {plan.hashes}
    Hosts and detections: {plan.hosts}
    Users: {plan.users}

    ### Containment results
    {plan.results}
    Skipped by guardrails: {plan.skipped}
    Escalated: {plan.escalate} {plan.reasons}

    ### Rollback
    - block-domain: remove each domain from the automation block list in Umbrella / Secure Access (and
      Cloudflare Gateway when used): {plan.blocked_domains}. Blocks expire on their own after
      {plan.block_expiry_hours} hours.
    - isolate-endpoint: stop isolation for each connector GUID in Secure Endpoint (stop-isolation API,
      endpoint not yet verified against vendor documentation): {plan.isolated_hosts}.
      The unlock code stays in the Secure Endpoint console and is not copied here.

    ### Follow-up
    - [ ] Payload removed or quarantined on every host in the payload hash host list
    - [ ] Script block logging reviewed for further stages on the isolated hosts
    - [ ] Sign-ins and risk state of the user who ran the script reviewed: {plan.users}
  ticket_title: "[{incident.severity}] Suspicious PowerShell: {incident.title} ({incident.id})"
  ticket_body: |
    XDR incident: {incident.id} - {incident.title}
    Severity: {incident.severity}. Source: {incident.source}. Dry run: {workflow.dry_run}.

    Findings:
    - Download destinations: {plan.destinations}
    - Payload hashes: {plan.hashes}
    - Hosts and detections: {plan.hosts}

    Containment (approved by {approver.name}):
    {plan.results}
    Skipped by guardrails: {plan.skipped}
    Escalated to a human: {plan.escalate} {plan.reasons}

    Rollback steps are in the XDR incident note.
  notification: "{workflow.name} | {incident.severity} | {incident.id} {incident.title} | planned: {plan.planned_count},
    skipped: {plan.skipped_count}, escalate: {plan.escalate} | ticket {ticket.id} {ticket.url}"
integrations:
- cisco-xdr
- umbrella
- splunk
- secure-endpoint
- meraki
- microsoft-entra
- cloudflare
- servicenow
related_workflows:
- malware
- c2
