name: Signed software-deployment script with an encoded command
description: >
  Benign. The software deployment agent ran a signed, encoded PowerShell script that fetched an installer
  from the vendor's package mirror. The domain and the installer hash are clean, the hash is common across
  the fleet and the host has no malicious detections. Encoding alone is not a reason to contain, so the
  plan is empty and the run only records the findings.
incident:
  id: INC-TEST-PS-0002
  title: Encoded PowerShell from software deployment agent on ws-eng-221
  severity: medium
  source: Splunk script block logging
  observables:
    - {type: domain, value: packages.vendor.example}
    - {type: sha256, value: bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22}
    - {type: host, value: ws-eng-221}
  targets:
    - {type: endpoint, value: ws-eng-221}
  context:
    parent_process: software deployment agent
    script_traits: [encoded command, signed script, download from known vendor mirror]
results:
  enrich-domain:
    - {domain: packages.vendor.example, verdict: clean, categories: [Software Updates], first_seen: "2019-03-11", internal_queries: 1840, error: ""}
  enrich-hash:
    - sha256: bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22bb22
      disposition: clean
      prevalence: 812
      hosts: [ws-eng-221, ws-eng-222, ws-fin-014]
      error: ""
  investigate-host:
    - host: ws-eng-221
      connector_guid: 4b1c7a10-0000-4000-8000-000000000221
      detections: []
      trajectory:
        - {event: Deployment agent started an encoded PowerShell command}
        - {event: Outbound HTTPS to packages.vendor.example}
        - {event: Signed installer written and started}
      isolation_capable: true
      is_protected: false
      error: ""
expect:
  escalate: false
  actions: []
