name: Admin upload from a domain controller to a partner transfer site
description: >-
  Guardrails. A risky admin account uploads from a domain controller through an internal relay to a
  sanctioned partner transfer site that has no reputation yet. One action per contain atomic is
  produced. The partner domain is allow-listed (added through the guardrails override) and the relay
  IP is internal, so both are kept with a skipped status for the approver to see. The host matches
  dc-* and the account is in Domain Admins, so their isolation and disable stay planned with
  elevated: true and need ELEVATED approval.
incident:
  id: INC-TEST-EXF-0003
  title: Unusual upload from domain controller by admin account
  severity: critical
  source: Cisco XDR
  observables:
    - {type: domain, value: partner-sftp.example}
    - {type: ip, value: 10.20.30.40}
    - {type: hostname, value: dc-02}
    - {type: email, value: adm-r.lee@example.com}
  context:
    destination_domains: [partner-sftp.example]
    destination_ips: [10.20.30.40]
    source_hosts: [dc-02]
    actor_users: [adm-r.lee@example.com]
    transfer_ongoing: true
    transfer_started: "2026-10-06T11:02:00Z"
    transfer_last_seen: "2026-10-06T11:20:00Z"
    bytes_out: 734003200
    file_count: 3
    data_types: [directory export]
results:
  enrich-domain:
    - {domain: partner-sftp.example, verdict: unknown, categories: [File Transfer Services], first_seen: "2026-09-30", internal_queries: 2, error: ""}
  enrich-ip:
    - {ip: 10.20.30.40, verdict: suspicious, sources: [], internal_sightings: 2, is_internal: true, error: ""}
  investigate-host:
    - {host: dc-02, connector_guid: 00000000-0000-4000-8000-00000000e703, detections: [], trajectory: [], isolation_capable: true, is_protected: true, error: ""}
  investigate-user:
    - user: adm-r.lee@example.com
      profile: {department: IT, groups: [Domain Admins]}
      risk_level: high
      signins: [{ip: 198.51.100.9, location: unfamiliar, app: Azure Portal, result: success}]
      anomalies: [unfamiliar location]
      is_protected: true
      error: ""
guardrails:
  allowlist:
    domains: ["example.com", "*.microsoft.com", "*.cisco.com", "partner-sftp.example"]
expect:
  escalate: false
  actions:
    - {atomic: block-domain, target: partner-sftp.example, status: skipped_allowlisted}
    - {atomic: block-ip, target: 10.20.30.40, status: skipped_internal}
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-00000000e703, status: planned, elevated: true}
    - {atomic: disable-user, target: adm-r.lee@example.com, status: planned, elevated: true}
