name: Sanctioned nightly backup to an allow-listed service
description: >-
  Benign. An outbound volume anomaly fires while the backup server copies data to the organisation's
  own backup service. The destination domain and IP are clean and widely used, the host has no
  detections and the service account has no risk. The transfer is still running, which proves that an
  ongoing transfer alone does not isolate a host. The plan is empty.
