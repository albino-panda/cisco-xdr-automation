name: Transfer to a malicious drop site that already finished
description: >-
  Edge case specific to exfiltration. The same evidence as a live transfer, but the source reports the
  transfer as finished (transfer_ongoing false). The destinations are still blocked so they cannot be
  reused, but the host is not isolated because there is nothing left to stop, and the evidence is preserved
  without cutting the user off. The account shows no compromise and no insider flag, so it stays enabled.
incident:
  id: INC-TEST-EXF-0004
  title: Overnight upload to malicious file share completed
  severity: critical
  source: Cisco Umbrella / Secure Access
  observables:
    - {type: domain, value: share-upload.test}
    - {type: ip, value: 198.51.100.66}
    - {type: hostname, value: fin-lt-12}
    - {type: email, value: m.ng@example.com}
  context:
    destination_domains: [share-upload.test]
    destination_ips: [198.51.100.66]
    source_hosts: [fin-lt-12]
    actor_users: [m.ng@example.com]
    transfer_ongoing: false
    transfer_started: "2026-10-05T23:10:00Z"
    transfer_last_seen: "2026-10-06T00:05:00Z"
    bytes_out: 1073741824
    file_count: 212
    data_types: [employee payroll records]
results:
  enrich-domain:
    - {domain: share-upload.test, verdict: malicious, categories: [Malware], first_seen: "2026-10-04", internal_queries: 1, error: ""}
  enrich-ip:
    - {ip: 198.51.100.66, verdict: unknown, sources: [], internal_sightings: 1, is_internal: false, error: ""}
  investigate-host:
    - {host: fin-lt-12, connector_guid: 00000000-0000-4000-8000-00000000e704, detections: [], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
  investigate-user:
    - {user: m.ng@example.com, profile: {department: Finance, groups: [Finance]}, risk_level: low, signins: [], anomalies: [], is_protected: false, error: ""}
expect:
  escalate: false
  actions:
    - {atomic: block-domain, target: share-upload.test, status: planned, requires_approval: true}
    - {atomic: block-ip, target: 198.51.100.66, status: planned, requires_approval: true}
