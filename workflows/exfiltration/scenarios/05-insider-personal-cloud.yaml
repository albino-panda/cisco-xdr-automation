    destination_ips: [203.0.113.80]
    source_hosts: [eng-lt-21]
    actor_users: [a.khan@example.com]
    insider_risk: true
    transfer_ongoing: false
    transfer_started: "2026-10-05T17:30:00Z"
    transfer_last_seen: "2026-10-05T18:10:00Z"
    bytes_out: 2147483648
    file_count: 640
