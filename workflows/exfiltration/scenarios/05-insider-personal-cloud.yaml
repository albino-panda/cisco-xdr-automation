name: Insider upload to clean personal cloud storage
description: >-
  Insider case. The source flags insider risk for a departing employee who uploaded design files to a
  clean, widely used personal cloud storage service. Clean shared destinations are not blocked and the
  transfer has finished, so only the named actor is disabled. A second user in the incident (the file
  owner) has no risk and is not named as an actor, which proves the insider decision does not spread.
incident:
  id: INC-TEST-EXF-0005
  title: Departing employee uploaded design files to personal cloud storage
  severity: high
  source: Cisco XDR (DLP alert forwarded by Splunk)
  observables:
