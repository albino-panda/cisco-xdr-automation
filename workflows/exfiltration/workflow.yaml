schema_version: 1
id: exfiltration
name: Data exfiltration
status: specification
description: Stop large or unusual outbound transfers and preserve evidence for impact assessment.
default_severity: critical
mitre_attack:
- id: T1041
  name: Exfiltration Over C2 Channel
- id: T1567.002
  name: Exfiltration to Cloud Storage
- id: T1048
  name: Exfiltration Over Alternative Protocol
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1041
    - T1567.002
    - T1048
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Outbound volume anomaly
- Upload to unsanctioned cloud storage
- Archive creation followed by transfer
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
- id: build_plan
  phase: decide
  note: Build the containment plan from enrichment verdicts, investigation results and guardrails. Drop
    any target that is protected, allow-listed or over the blast-radius limit.
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
- id: block_domain
  phase: contain
  atomic: block-domain
  when: Destination when not a sanctioned service.
  requires_approval: true
- id: block_ip
  phase: contain
  atomic: block-ip
  when: Destination IP when not shared infrastructure.
  requires_approval: true
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: Source host while transfer is ongoing.
  requires_approval: true
- id: disable_user
  phase: contain
  atomic: disable-user
  when: Insider or compromised account driving the transfer.
  requires_approval: true
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals and per-action results.
- id: create_ticket
  phase: record
  atomic: create-ticket
- id: notify_soc
  phase: notify
  atomic: notify-soc
integrations:
- cisco-xdr
- umbrella
- splunk
- secure-endpoint
- meraki
- microsoft-entra
- cloudflare
- servicenow
related_workflows:
- c2
- dns-tunneling
- cloud-compromise
