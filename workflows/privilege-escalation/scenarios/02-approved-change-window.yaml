name: Role assignment inside an approved change window
description: >
  Benign. An IT administrator assigns the Exchange Administrator role to a colleague during the window
  of an approved change request, and the colleague's workstation has only clean detections. Every
  privilege change carries an approved change number, so no containment is planned. The run still
  writes the note and ticket so the assignment is on record.
incident:
  id: INC-TEST-PE-0002
  title: Privileged role assigned to a.lee@example.com
  severity: medium
  source: Microsoft Entra ID
  observables:
    - {type: user, value: a.lee@example.com}
    - {type: hostname, value: ws-it-0031.example.com}
  context:
    privilege_changes:
      - {user: a.lee@example.com, change: role_assigned, role: Exchange Administrator, actor: it-admin-03@example.com, approved_change: CHG0040123}
results:
  investigate-host:
    - host: ws-it-0031.example.com
      connector_guid: 0b7c6d5e-2f3a-4b1c-9d8e-000000000031
      detections:
        - {name: Potentially unwanted application, disposition: clean}
      trajectory: []
      isolation_capable: true
      is_protected: false
      error: ""
  investigate-user:
    - user: a.lee@example.com
      profile: {department: IT, groups: [Messaging Team]}
      risk_level: low
      signins: []
      anomalies: []
      is_protected: false
      error: ""
    - user: it-admin-03@example.com
      profile: {department: IT, groups: [Identity Admins]}
      risk_level: none
      signins: []
      anomalies: []
      is_protected: false
      error: ""
expect:
  escalate: false
  actions: []
