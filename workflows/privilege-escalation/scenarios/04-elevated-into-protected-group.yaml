name: UAC bypass then self-added to Domain Admins
description: >-
  Edge case specific to privilege escalation. A UAC bypass detection fires on an engineering
  workstation and the user's account is then added to Domain Admins with no approved change.
  Investigation reads the current membership, which already includes Domain Admins, so the
  protected-group guardrail marks revoke-session and disable-user for the very account the attacker
  elevated as elevated: true (ELEVATED approval). The workstation isolation is planned. This pins
  the behaviour so the approval text and README warn the approver to remove the membership by hand
  first.
incident:
  id: INC-TEST-PE-0004
  title: UAC bypass followed by Domain Admins membership change
  severity: high
  source: Splunk
  observables:
    - {type: hostname, value: ws-eng-0077.example.com}
    - {type: user, value: m.ortiz@example.com}
  context:
    privilege_changes:
      - {user: m.ortiz@example.com, change: group_added, group: Domain Admins, actor: m.ortiz@example.com, approved_change: ""}
results:
  investigate-host:
    - host: ws-eng-0077.example.com
      connector_guid: 2c3d4e5f-6a7b-4c8d-9e0f-000000000077
      detections:
        - {name: UAC bypass behaviour, disposition: malicious}
      trajectory: []
      isolation_capable: true
      is_protected: false
      error: ""
  investigate-user:
    - user: m.ortiz@example.com
      profile: {department: Engineering, groups: [Engineering, Domain Admins]}
      risk_level: medium
      signins: []
      anomalies: [new device]
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: isolate-endpoint, target: 2c3d4e5f-6a7b-4c8d-9e0f-000000000077, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: m.ortiz@example.com, status: planned, elevated: true, requires_approval: true}
    - {atomic: disable-user, target: m.ortiz@example.com, status: planned, elevated: true, requires_approval: true}
