name: Compromised admin creates four privileged accounts
description: >-
  Blast radius. A compromised identity administrator creates four accounts and assigns each a
  privileged role, none under an approved change. Session revocation is planned for the admin and
  the four new accounts (revoke-session has no cap), but four disable-user actions exceed
  max_users_disabled (3), so all four stay planned with elevated: true and the plan escalates to a
  lead. The exploit host is not isolation-capable, so no isolation is planned for it and the
  investigator must contain it by hand.
incident:
  id: INC-TEST-PE-0005
  title: Burst of account creations with privileged roles
  severity: critical
  source: Microsoft Entra ID
  observables:
    - {type: user, value: idm-admin-07@example.com}
    - {type: hostname, value: ws-idm-0007.example.com}
  context:
    privilege_changes:
      - {user: svc-report-a@example.com, change: account_created, actor: idm-admin-07@example.com, approved_change: ""}
      - {user: svc-report-b@example.com, change: account_created, actor: idm-admin-07@example.com, approved_change: ""}
      - {user: svc-report-c@example.com, change: account_created, actor: idm-admin-07@example.com, approved_change: ""}
      - {user: svc-report-d@example.com, change: account_created, actor: idm-admin-07@example.com, approved_change: ""}
      - {user: svc-report-a@example.com, change: role_assigned, role: Application Administrator, actor: idm-admin-07@example.com, approved_change: ""}
      - {user: svc-report-b@example.com, change: role_assigned, role: Application Administrator, actor: idm-admin-07@example.com, approved_change: ""}
