name: Exploit on a domain controller and elevation of a break-glass account
description: >
  Guardrails. A malicious privilege-escalation detection fires on a domain controller and a break-glass
  account is assigned a role from an unfamiliar location with no approved change. All three rules match,
  but the domain controller matches protected host pattern dc-* and the break-glass account is a
  protected user, so every action is skipped_protected and a human must respond.
incident:
  id: INC-TEST-PE-0003
  title: Privilege escalation on dc-02 and break-glass role change
  severity: critical
  source: Cisco XDR
  observables:
    - {type: hostname, value: dc-02.example.com}
    - {type: user, value: breakglass-01@example.com}
  context:
    privilege_changes:
      - {user: breakglass-01@example.com, change: role_assigned, role: Privileged Role Administrator, actor: breakglass-01@example.com, approved_change: ""}
results:
  investigate-host:
    - host: dc-02.example.com
      connector_guid: 9a8b7c6d-3e4f-4a5b-8c7d-0000000000d2
      detections:
        - {name: Exploit Prevention - kernel exploit blocked, disposition: malicious}
      trajectory: []
      isolation_capable: true
      is_protected: false
      error: ""
  investigate-user:
    - user: breakglass-01@example.com
      profile: {department: IT, groups: [Emergency Access]}
      risk_level: high
      signins:
        - {ip: 203.0.113.45, location: unknown, app: Azure Portal, result: success}
      anomalies: [unfamiliar location]
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: isolate-endpoint, target: 9a8b7c6d-3e4f-4a5b-8c7d-0000000000d2, status: skipped_protected, requires_approval: true}
    - {atomic: revoke-session, target: breakglass-01@example.com, status: skipped_protected, requires_approval: false}
    - {atomic: disable-user, target: breakglass-01@example.com, status: skipped_protected, requires_approval: true}
