name: Same encoded payload on six workstations exceeds the isolation limit
description: >
  Guardrail (blast radius). A logon script started the same encoded PowerShell download on six
  workstations, and the malicious payload landed on all of them. Six hosts is more than the default
  max_hosts_isolated of 5, so every isolation becomes skipped_limit and the plan escalates to a human.
  The single download domain is still planned for blocking because the indicator cap is not reached.
incident:
  id: INC-TEST-PS-0004
  title: Encoded PowerShell payload on six workstations
  severity: critical
  source: Cisco Secure Endpoint
  observables:
    - {type: domain, value: update-check.test}
    - {type: sha256, value: dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44}
    - {type: host, value: ws-ops-101}
    - {type: host, value: ws-ops-102}
    - {type: host, value: ws-ops-103}
    - {type: host, value: ws-ops-104}
    - {type: host, value: ws-ops-105}
    - {type: host, value: ws-ops-106}
  context:
    parent_process: logon script
    script_traits: [encoded command, download from unknown domain]
results:
  enrich-domain:
    - {domain: update-check.test, verdict: malicious, categories: [Malware], first_seen: "2026-10-05", internal_queries: 6, error: ""}
  enrich-hash:
    - sha256: dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44dd44
      disposition: malicious
      prevalence: 6
      hosts: [ws-ops-101, ws-ops-102, ws-ops-103, ws-ops-104, ws-ops-105, ws-ops-106]
      error: ""
  investigate-host:
    - {host: ws-ops-101, connector_guid: 4b1c7a10-0000-4000-8000-000000000101, detections: [], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-102, connector_guid: 4b1c7a10-0000-4000-8000-000000000102, detections: [], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-103, connector_guid: 4b1c7a10-0000-4000-8000-000000000103, detections: [], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-104, connector_guid: 4b1c7a10-0000-4000-8000-000000000104, detections: [], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-105, connector_guid: 4b1c7a10-0000-4000-8000-000000000105, detections: [], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
    - {host: ws-ops-106, connector_guid: 4b1c7a10-0000-4000-8000-000000000106, detections: [], trajectory: [], isolation_capable: true, is_protected: false, error: ""}
expect:
  escalate: true
  actions:
    - {atomic: block-domain, target: update-check.test, status: planned, requires_approval: true}
    - {atomic: isolate-endpoint, target: 4b1c7a10-0000-4000-8000-000000000101, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 4b1c7a10-0000-4000-8000-000000000102, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 4b1c7a10-0000-4000-8000-000000000103, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 4b1c7a10-0000-4000-8000-000000000104, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 4b1c7a10-0000-4000-8000-000000000105, status: skipped_limit}
    - {atomic: isolate-endpoint, target: 4b1c7a10-0000-4000-8000-000000000106, status: skipped_limit}
