name: Download cradle fetches its payload from a bare IP address
description: >
  Edge case specific to PowerShell. The encoded command downloads straight from an external IP address,
  so there is no domain to block and the dropped file's hash is not an incident observable. The host has a
  malicious Secure Endpoint detection and the IP is malicious, so the executed-payload rule isolates the
  host. Nothing is blocked: this workflow has no block-ip step (IP blocking belongs to the c2 workflow).
incident:
  id: INC-TEST-PS-0005
  title: Encoded PowerShell downloaded from an IP address on ws-hr-007
  severity: high
  source: Cisco Secure Endpoint
  observables:
    - {type: ip, value: 203.0.113.45}
    - {type: host, value: ws-hr-007}
    - {type: user, value: a.lee@example.com}
  targets:
    - {type: endpoint, value: ws-hr-007}
  context:
    script_traits: [encoded command, download from IP address without a hostname]
results:
  enrich-ip:
    - {ip: 203.0.113.45, verdict: malicious, sources: [{name: Talos, verdict: malicious}], internal_sightings: 1, is_internal: false, error: ""}
  investigate-host:
    - host: ws-hr-007
      connector_guid: 4b1c7a10-0000-4000-8000-000000000007
      detections:
        - {name: Malicious file executed after PowerShell download, disposition: malicious}
      trajectory:
        - {event: Encoded PowerShell command started}
        - {event: Outbound HTTP to 203.0.113.45}
      isolation_capable: true
      is_protected: false
      error: ""
  investigate-user:
    - user: a.lee@example.com
      profile: {department: HR, groups: [HR Users]}
      risk_level: none
      signins: []
      anomalies: []
      is_protected: false
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: isolate-endpoint, target: 4b1c7a10-0000-4000-8000-000000000007, status: planned, requires_approval: true}
