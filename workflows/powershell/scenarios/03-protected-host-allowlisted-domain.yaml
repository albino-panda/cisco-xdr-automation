name: Obfuscated script on a domain controller pulls a payload from an internal share
description: >
  Guardrails. An obfuscated PowerShell script on a domain controller downloaded a malicious payload from a
  compromised internal web share on the organisation's own domain. The suspicious domain is confirmed as a
  payload host by the malicious hash, but it is allow-listed, and the domain controller is a protected
  host. Both actions are recorded as skipped so a human handles them; nothing is changed automatically.
incident:
  id: INC-TEST-PS-0003
  title: Obfuscated PowerShell on dc-02 retrieved a payload from files.example.com
  severity: high
  source: Cisco Secure Endpoint
  observables:
    - {type: domain, value: files.example.com}
    - {type: sha256, value: cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33}
    - {type: host, value: dc-02}
  targets:
    - {type: endpoint, value: dc-02}
  context:
    script_traits: [obfuscated command, download from internal web share]
results:
  enrich-domain:
    - {domain: files.example.com, verdict: suspicious, categories: [Business Services], first_seen: "2018-06-01", internal_queries: 950, error: ""}
  enrich-hash:
    - sha256: cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33cc33
      disposition: malicious
      prevalence: 1
      hosts: [4b1c7a10-0000-4000-8000-0000000dc002, dc-02]
      error: ""
  investigate-host:
    - host: dc-02
      connector_guid: 4b1c7a10-0000-4000-8000-0000000dc002
      detections:
        - {name: Malicious file written by PowerShell, disposition: malicious}
      trajectory:
        - {event: Obfuscated PowerShell command started}
        - {event: Outbound HTTPS to files.example.com}
      isolation_capable: true
      is_protected: true
      error: ""
expect:
  escalate: false
  actions:
    - {atomic: block-domain, target: files.example.com, status: skipped_allowlisted, requires_approval: true}
    - {atomic: isolate-endpoint, target: 4b1c7a10-0000-4000-8000-0000000dc002, status: skipped_protected, requires_approval: true}
