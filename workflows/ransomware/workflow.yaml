schema_version: 1
id: ransomware
name: Ransomware
status: specification
description: Contain suspected ransomware quickly to limit encryption spread, then scope affected hosts
  and accounts.
default_severity: critical
mitre_attack:
- id: T1486
  name: Data Encrypted for Impact
- id: T1490
  name: Inhibit System Recovery
- id: T1489
  name: Service Stop
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1486
    - T1490
    - T1489
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Secure Endpoint ransomware or malicious-activity-protection detection
- Mass file modification or shadow copy deletion alerts
- XDR incident tagged with an impact technique
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
  on_error: stop
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
  on_error: stop
- id: enrich_hash
  phase: enrich
  atomic: enrich-hash
  for_each: sha256
  on_error: continue
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
  on_error: continue
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
  on_error: continue
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
  note: Incident hosts plus the hosts that enrich-hash lists for a malicious payload, so payload spread
    reaches the isolation rules.
  on_error: continue
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
  note: User observables of the incident and of its targets.
  on_error: continue
- id: build_plan
  phase: decide
  note: Build the containment plan from the rules in `plan`, then drop any target that is protected,
    allow-listed or over the blast-radius limit.
  on_error: escalate
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
  on_error: escalate
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: Isolation-capable host that has a malicious detection, or that has seen a malicious payload hash
    with a prevalence of 50 or less. Protected hosts are skipped. Eligible for auto-approval when guardrails
    allow.
  requires_approval: true
  on_error: escalate
- id: block_hash
  phase: contain
  atomic: block-hash
  when: Payload hash with malicious disposition and a prevalence of 50 or less. Unknown-disposition or
    more widespread hashes are left to the approver.
  requires_approval: true
  on_error: escalate
- id: revoke_session
  phase: contain
  atomic: revoke-session
  when: Account listed in the same incident target as a host that has a malicious detection.
  requires_approval: false
  on_error: escalate
- id: disable_user
  phase: contain
  atomic: disable-user
  when: Account with Entra risk level high and at least one sign-in anomaly.
  requires_approval: true
  on_error: escalate
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals, per-action results and the rollback for every action.
  on_error: escalate
- id: create_ticket
  phase: record
  atomic: create-ticket
  on_error: continue
- id: notify_soc
  phase: notify
  atomic: notify-soc
  on_error: escalate
plan:
- id: isolate_detected_hosts
  description: Hosts with a malicious Secure Endpoint detection (ransomware, malicious-activity protection
    or recovery inhibition) whose connector policy allows isolation.
  atomic: isolate-endpoint
  for_each: "results['investigate-host']"
  when: "item.isolation_capable and any(get(d, 'disposition') == 'malicious' for d in item.detections)"
  target: item.connector_guid
  args:
    reason: "'Ransomware containment: ' + incident.title"
- id: isolate_payload_hosts
  description: Hosts without a detection of their own that have seen a malicious payload hash with a
    prevalence of 50 or less (staged or spreading payload).
  atomic: isolate-endpoint
  for_each: "results['investigate-host']"
  when: >-
    item.isolation_capable and any(h.disposition == 'malicious' and h.prevalence <= 50
    and (item.connector_guid in h.hosts or get(item, 'host', '') in h.hosts) for h in results['enrich-hash'])
  target: item.connector_guid
  args:
    reason: "'Ransomware payload seen on host: ' + incident.title"
- id: block_payload_hash
  description: Payload hashes with a malicious disposition seen on 50 endpoints or fewer. A wider prevalence
    points to a mis-scored common binary or a fleet-wide event, which the approver decides.
  atomic: block-hash
  for_each: "results['enrich-hash']"
  when: "item.disposition == 'malicious' and item.prevalence <= 50"
  target: item.sha256
  args:
    description: "'Ransomware payload, incident ' + get(incident, 'id', 'unknown')"
- id: revoke_sessions_on_affected_hosts
  description: Accounts that appear in the same incident target as a host with a malicious detection.
  atomic: revoke-session
  for_each: "results['investigate-user']"
  when: >-
    any(any(o.type == 'user' and lower(o.value) == lower(item.user) for o in t.observables)
    and any(o.type == 'hostname' and lower(o.value) in [lower(get(h, 'host', '')) for h in results['investigate-host']
    if any(get(d, 'disposition') == 'malicious' for d in h.detections)] for o in t.observables)
    for t in get(incident, 'targets', []))
  target: item.user
- id: disable_compromised_users
  description: Accounts confirmed compromised, meaning Entra risk level high together with at least one
    sign-in anomaly.
  atomic: disable-user
  for_each: "results['investigate-user']"
  when: "lower(get(item, 'risk_level', 'none')) == 'high' and len(item.anomalies) > 0"
  target: item.user
  args:
    reason: "'Ransomware: account confirmed compromised in ' + incident.title"
templates:
  approval: |
    Ransomware containment for {incident.id}: {incident.title} (severity {incident.severity}).
    {plan.summary}
    Planned actions: {plan.actions}
    Skipped by guardrails: {plan.skipped}
    Blast-radius escalation: {plan.escalate} {plan.reasons}
    Rollback per action: {plan.rollback}
    Approve to run with dry_run={workflow.dry_run}. Reject to leave all hosts and accounts unchanged.
  incident_note: |
    {workflow.name} run {workflow.run_id} (dry_run={workflow.dry_run}).
    Approval: {approver.decision} by {approver.name} at {approver.time}.
    Findings: {plan.findings}
    Actions and results: {plan.results}
    Skipped or escalated: {plan.skipped} {plan.reasons}
    Rollback:
    - isolate-endpoint: stop isolation for the connector GUID in Secure Endpoint. The unlock code stays in the Secure Endpoint console and is not copied here.
    - block-hash: delete the SHA-256 from the Secure Endpoint simple custom detection list.
    - revoke-session: not reversible; the user signs in again.
    - disable-user: set accountEnabled back to true in Entra ID.
  ticket_title: "[Ransomware] {incident.severity}: {incident.title} ({incident.id})"
  ticket_body: |
    Incident: {incident.id} {incident.title}
    Severity: {incident.severity}, source {incident.source}
    Findings: {plan.findings}
    Containment: {plan.results}
    Skipped or escalated: {plan.skipped} {plan.reasons}
    Rollback: {plan.rollback}
    Approver: {approver.name} ({approver.decision}), dry_run={workflow.dry_run}
  notification: "Ransomware {incident.severity}: {incident.title} ({incident.id}). {plan.summary} Escalate:
    {plan.escalate}. Ticket {ticket.id} {ticket.url}"
integrations:
- cisco-xdr
- secure-endpoint
- umbrella
- splunk
- meraki
- microsoft-entra
- servicenow
related_workflows:
- malware
- lateral-movement
- exfiltration
