schema_version: 1
id: ransomware
name: Ransomware
status: specification
description: Contain suspected ransomware quickly to limit encryption spread, then scope affected hosts
  and accounts.
default_severity: critical
mitre_attack:
- id: T1486
  name: Data Encrypted for Impact
- id: T1490
  name: Inhibit System Recovery
- id: T1489
  name: Service Stop
triggers:
- type: incident_rule
  description: XDR Automation incident rule matching the techniques or titles below.
  match:
    mitre_techniques:
    - T1486
    - T1490
    - T1489
- type: pivot_menu
  description: Manual run from an observable or incident.
- type: playbook_task
  description: Task in the matching XDR incident response playbook.
detection_signals:
- Secure Endpoint ransomware or malicious-activity-protection detection
- Mass file modification or shadow copy deletion alerts
- XDR incident tagged with an impact technique
inputs:
- name: incident_id
  type: string
  required: false
  description: Cisco XDR incident ID, used for notes and audit.
- name: dry_run
  type: boolean
  required: false
  description: When true, report the planned change without making it. Default true for containment.
- name: observables
  type: list
  required: false
  description: Overrides the incident observables.
defaults:
  dry_run: true
  lookback_hours: 24
steps:
- id: load_incident
  phase: intake
  action: XDR - Incident - Get Incident Summary
  note: Collect observables, targets and existing notes from the triggering incident.
- id: load_guardrails
  phase: intake
  action: Core - Read guardrails
  note: Protected hosts/users, allow-lists and blast-radius limits (docs/deployment/guardrails.example.yaml).
- id: enrich_hash
  phase: enrich
  atomic: enrich-hash
  for_each: sha256
- id: enrich_domain
  phase: enrich
  atomic: enrich-domain
  for_each: domain
- id: enrich_ip
  phase: enrich
  atomic: enrich-ip
  for_each: ip
- id: investigate_host
  phase: investigate
  atomic: investigate-host
  for_each: host
- id: investigate_user
  phase: investigate
  atomic: investigate-user
  for_each: user
- id: build_plan
  phase: decide
  note: Build the containment plan from enrichment verdicts, investigation results and guardrails. Drop
    any target that is protected, allow-listed or over the blast-radius limit.
- id: approval
  phase: decide
  action: Approval Task
  note: Show the plan to an approver. Skipped when dry_run is true (plan is only recorded).
  skip_if: dry_run == true
- id: isolate_endpoint
  phase: contain
  atomic: isolate-endpoint
  when: Every affected host that is not protected. Eligible for auto-approval when guardrails allow.
  requires_approval: true
- id: block_hash
  phase: contain
  atomic: block-hash
  when: Payload hash with malicious disposition and low clean prevalence.
  requires_approval: true
- id: revoke_session
  phase: contain
  atomic: revoke-session
  when: Accounts active on the affected hosts.
  requires_approval: false
- id: disable_user
  phase: contain
  atomic: disable-user
  when: Accounts confirmed compromised.
  requires_approval: true
- id: incident_note
  phase: record
  action: XDR - Incident - Add Note to Incident
  note: Write enrichment summary, plan, approvals and per-action results.
- id: create_ticket
  phase: record
  atomic: create-ticket
- id: notify_soc
  phase: notify
  atomic: notify-soc
integrations:
- cisco-xdr
- secure-endpoint
- umbrella
- splunk
- meraki
- microsoft-entra
- servicenow
related_workflows:
- malware
- lateral-movement
- exfiltration
