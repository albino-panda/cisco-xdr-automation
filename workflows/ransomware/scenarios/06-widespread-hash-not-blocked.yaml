name: Malicious verdict on a widely deployed binary alongside the real payload
description: >
  Prevalence gate. Two hashes come back malicious: the real payload (prevalence 1) and a common
  software updater that one intel source mis-scored (prevalence 1800). Only the low-prevalence payload
  is blocked, and only hosts with a detection or with the low-prevalence payload are isolated. The
  marketing workstation that merely has the common updater is left alone, and the approver sees the
  widespread hash as an unactioned finding.
incident:
  id: INC-TEST-RW-0006
  title: Ransomware with a second, widespread malicious-scored file
  severity: critical
  source: Cisco Secure Endpoint
  observables:
    - {type: sha256, value: 1f3e5d7c9b0a2f4e6d8c1b3a5f7e9d0c1f3e5d7c9b0a2f4e6d8c1b3a5f7e9d0c}
    - {type: sha256, value: 7b9d1f3a5c8e0b2d4f6a9c1e3b5d7f0a7b9d1f3a5c8e0b2d4f6a9c1e3b5d7f0a}
    - {type: hostname, value: ws-sal-019}
  targets:
    - type: endpoint
      observables:
        - {type: hostname, value: ws-sal-019}
  context:
    detection: Ransomware.Generic
results:
