      disposition: malicious
      prevalence: 1
      hosts: [00000000-0000-4000-8000-00000000c019]
    - sha256: 7b9d1f3a5c8e0b2d4f6a9c1e3b5d7f0a7b9d1f3a5c8e0b2d4f6a9c1e3b5d7f0a
      disposition: malicious
      prevalence: 1800
      hosts: [00000000-0000-4000-8000-00000000c019, 00000000-0000-4000-8000-00000000d011]
  investigate-host:
