name: Ransomware spreading to seven workstations in one run
description: >
  Blast radius. The same payload encrypts seven operations workstations. Seven isolations exceed
  max_hosts_isolated (5), so every isolation becomes skipped_limit and the plan escalates to a human,
  who decides on segment-level containment. The hash block and the session revocation are outside that
  cap and stay planned, so spread is still slowed while the human decides.
incident:
  id: INC-TEST-RW-0004
  title: Ransomware outbreak in operations
  severity: critical
  source: Cisco Secure Endpoint
  observables:
    - {type: sha256, value: b5d1f3a7c9e0b2d4f6a8c1e3b5d7f9a0b5d1f3a7c9e0b2d4f6a8c1e3b5d7f9a0}
  targets:
    - type: endpoint
      observables:
        - {type: hostname, value: ws-ops-001}
        - {type: user, value: ops.lead@example.com}
  context:
    detection: Ransomware.Generic on multiple endpoints
results:
