name: Per-victim payload encrypting a file share over the network
description: >
  Ransomware edge case. The payload is a fresh per-victim build, so threat intel has no verdict yet
  (disposition unknown) and the hash is not blocked automatically. Behavioural detection on the source
  workstation ws-hr-007 is enough to isolate it. The file server srv-file-03 only sees its shares being
  rewritten over SMB and has a suspicious mass-modification alert, not a malicious detection, so it is
  not isolated: cutting off the victim share would not stop the encryption, isolating the source does.
  The account on the source workstation loses its sessions but is not disabled (risk medium, no anomaly).
incident:
  id: INC-TEST-RW-0005
  title: File share encrypted from HR workstation
  severity: critical
  source: Cisco XDR
  observables:
    - {type: sha256, value: e0c2a4b6d8f1e3c5a7b9d0f2e4c6a8b1e0c2a4b6d8f1e3c5a7b9d0f2e4c6a8b1}
    - {type: hostname, value: ws-hr-007}
    - {type: hostname, value: srv-file-03}
  targets:
    - type: endpoint
      observables:
        - {type: hostname, value: ws-hr-007}
        - {type: user, value: hr.coordinator@example.com}
    - type: endpoint
      observables:
        - {type: hostname, value: srv-file-03}
  context:
    detection: Malicious activity protection; shadow copy deletion; remote share modification
results:
  enrich-hash:
    - sha256: e0c2a4b6d8f1e3c5a7b9d0f2e4c6a8b1e0c2a4b6d8f1e3c5a7b9d0f2e4c6a8b1
      disposition: unknown
      prevalence: 1
      hosts: [00000000-0000-4000-8000-00000000b007]
  investigate-host:
    - host: ws-hr-007
      connector_guid: 00000000-0000-4000-8000-00000000b007
      detections:
        - {name: Malicious activity protection, disposition: malicious}
        - {name: Shadow copy deletion, disposition: malicious}
      trajectory: []
      isolation_capable: true
      is_protected: false
    - host: srv-file-03
      connector_guid: 00000000-0000-4000-8000-00000000f003
      detections:
        - {name: Mass file modification over SMB, disposition: suspicious}
      trajectory: []
      isolation_capable: true
      is_protected: false
  investigate-user:
    - user: hr.coordinator@example.com
      profile: {department: Human Resources, groups: [HR Users]}
      risk_level: medium
      signins: [{ip: 10.40.0.17, location: Head office, app: Office 365, result: success}]
      anomalies: []
      is_protected: false
expect:
  escalate: false
  actions:
    - {atomic: isolate-endpoint, target: 00000000-0000-4000-8000-00000000b007, status: planned, requires_approval: true}
    - {atomic: revoke-session, target: hr.coordinator@example.com, status: planned, requires_approval: true}
